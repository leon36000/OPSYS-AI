# metrics-as-code v1 (D-010 : chaque module livre ses métriques à SON build ; consommateur = entrepôt M8).
# chemin d'agrégation cible : /registries/metrics/ (entrepôt central, story core ultérieure) — ce fichier est la livraison côté module.
schema_version: 1
module: M7-marketing
owner_calcul: "M8 (le LLM ne calcule jamais)"
metrics:
  - id: m7_cpl
    nom: "Coût par lead"
    definition: "Coût total marketing divisé par le nombre de leads générés sur la période."
    unite: "EUR/lead"
    source_donnees: "Module M7 — campagnes et CRM"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_cout_par_soumission
    nom: "Coût par soumission"
    definition: "Coût total marketing divisé par le nombre de soumissions de formulaire qualifiées."
    unite: "EUR/soumission"
    source_donnees: "Module M7 — campagnes et CRM"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_roi_par_canal
    nom: "ROI par canal"
    definition: "Revenu attribué à un canal marketing moins le coût de ce canal, rapporté au coût de ce canal."
    unite: "ratio"
    source_donnees: "Module M7 — attribution et finance"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_part_citations_ia
    nom: "Part des réponses d'assistants IA citant l'entreprise"
    definition: "Proportion d'échantillons de requêtes pour lesquels un assistant IA mentionne ou cite l'entreprise, mesurée par échantillonnage indépendant et jamais auto-déclarée."
    unite: "pourcentage"
    source_donnees: "Module M7 — panel d'échantillonnage IA"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_taux_doc_none
    nom: "Taux de documentation NONE"
    definition: "Proportion d'artefacts du module M7 dont la documentation est absente, incomplète ou marquée NONE, conformément à la gouvernance C-06."
    unite: "pourcentage"
    source_donnees: "Module M7 — registre d'artefacts"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_rep_total_avis
    nom: "Nombre total d'avis ingérés"
    definition: "Nombre d'avis clients chargés depuis les fixtures (M7-S009 — lecture seule D-043)."
    unite: "entier"
    source_donnees: "Module M7 — fixtures/avis (read-only)"
    frequence: "à la demande"
    consommateur: "entrepôt M8"
  - id: m7_rep_repartition_notes
    nom: "Répartition des notes (1-5)"
    definition: "Nombre d'avis par note de 1 à 5, calculé de manière déterministe sans LLM (REJ-0040)."
    unite: "dict {note: entier}"
    source_donnees: "Module M7 — fixtures/avis (read-only)"
    frequence: "à la demande"
    consommateur: "entrepôt M8"
  - id: m7_rep_note_moyenne
    nom: "Note moyenne des avis"
    definition: "Moyenne arithmétique des notes clients sur la période, calculée déterministement."
    unite: "float (1.0–5.0)"
    source_donnees: "Module M7 — fixtures/avis (read-only)"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_rep_taux_reponse
    nom: "Taux de réponse proposée"
    definition: "Proportion d'avis ayant reçu au moins une réponse PROPOSÉE (statut PROPOSE, jamais auto-publiée)."
    unite: "ratio (0.0–1.0)"
    source_donnees: "Module M7 — Reputation Engine (M7-S009)"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_rep_repartition_cats
    nom: "Répartition des catégories classifiées"
    definition: "Nombre d'avis par catégorie déterministe : litige, urgence, eloge, neutre (REJ-0040)."
    unite: "dict {categorie: entier}"
    source_donnees: "Module M7 — Reputation Engine (M7-S009)"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
  - id: m7_rep_delai_moyen_jours
    nom: "Délai moyen de réponse proposée"
    definition: "Délai moyen en jours entre la date de l'avis et la date de traitement de la réponse PROPOSÉE."
    unite: "float (jours)"
    source_donnees: "Module M7 — Reputation Engine (M7-S009)"
    frequence: "mensuelle"
    consommateur: "entrepôt M8"
