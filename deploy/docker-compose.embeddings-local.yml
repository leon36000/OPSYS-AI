# Profil R41 opt-in: docker compose -f docker-compose.yml -f docker-compose.embeddings-local.yml \
#   --profile embeddings-local up -d
services:
  opsys:
    networks:
      embeddings_private: {}
    environment:
      OPSYS_EMBEDDINGS_URL: http://bge-m3:8001/v1
      OPSYS_EMBEDDINGS_MODELE: BAAI/bge-m3
      OPSYS_EMBEDDINGS_CLE: ${OPSYS_EMBEDDINGS_CLE:?OPSYS_EMBEDDINGS_CLE requis pour R41}
      OPSYS_EMBEDDINGS_LOCAL: "1"
      OPSYS_EMBEDDINGS_TAILLE_LOT: "1"

  openclaw-gateway:
    networks:
      embeddings_private: {}
    environment:
      OPSYS_EMBEDDINGS_URL: http://bge-m3:8001/v1
      OPSYS_EMBEDDINGS_MODELE: BAAI/bge-m3
      OPSYS_EMBEDDINGS_CLE: ${OPSYS_EMBEDDINGS_CLE:?OPSYS_EMBEDDINGS_CLE requis pour R41}
      OPSYS_EMBEDDINGS_LOCAL: "1"
      OPSYS_EMBEDDINGS_TAILLE_LOT: "1"

  bge-m3:
    profiles: ["embeddings-local"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.embeddings-local
    restart: unless-stopped
    networks: [embeddings_private]
    environment:
      OPSYS_EMBEDDINGS_HOST: 0.0.0.0
      OPSYS_EMBEDDINGS_PORT: "8001"
      OPSYS_EMBEDDINGS_DELAI_S: "25"
      OPSYS_EMBEDDINGS_ASSETS: /models
      OPSYS_EMBEDDINGS_CLE: ${OPSYS_EMBEDDINGS_CLE:?OPSYS_EMBEDDINGS_CLE requis pour R41}
    volumes:
      - type: bind
        source: ${OPSYS_BGE_M3_ASSETS:?OPSYS_BGE_M3_ASSETS doit pointer vers les fichiers locaux BGE-M3 vérifiés}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    cpus: 2.0
    mem_limit: 3g
    # 3 GiB est un plafond provisoire; RSS à 512 tokens/VPS reste à mesurer.

networks:
  embeddings_private:
    driver: bridge
    internal: true
