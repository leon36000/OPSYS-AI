# deploy/fail2ban/opsys-console.filter.conf — installé en /etc/fail2ban/filter.d/opsys-console.conf
#
# Échecs de connexion à la console OPSYS : POST /connexion refusé (401 mauvais mot de passe, 400
# nom invalide). Source : journal d'accès uvicorn du conteneur `opsys`, envoyé à journald avec
# SYSLOG_IDENTIFIER=opsys (docker-compose.yml, `logging.options.tag`). Le backend systemd de
# fail2ban présente chaque entrée sous la forme `<hôte> opsys[<pid>]: <message>`, d'où
# `__prefix_line`. L'adresse est celle du client réel : la console n'accepte X-Forwarded-For que
# de Caddy (FORWARDED_ALLOW_IPS).
#
# Vérifié avec fail2ban-regex sur des lignes réelles de la console (bac à sable, 2026-09-28) :
# 401 en IPv4 et en IPv6 retenus ; GET, connexion réussie (303) et avertissement applicatif ignorés.
# Contrôle sur le VPS : sudo fail2ban-regex systemd-journal opsys-console
[INCLUDES]
before = common.conf

[Definition]
_daemon = opsys
failregex = ^%(__prefix_line)sINFO:\s+<ADDR>:\d+ - "POST /connexion HTTP/1\.\d" (?:400|401|403|422)\b
ignoreregex =
