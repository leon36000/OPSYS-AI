name: OPSYS-AI Core task
description: Issue atomique liée au registre Core
title: "[CXX-YYY] "
labels: ["opsys-ai", "area:core", "type:task", "proof:required", "status:backlog"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: C00-001
    validations:
      required: true
  - type: input
    id: task_spec_sha256
    attributes:
      label: Task Spec SHA-256
    validations:
      required: true
  - type: textarea
    id: mission
    attributes:
      label: Mission et critères
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contrat
      options:
        - label: "Dépôt exact leon36000/OPSYS-AI"
          required: true
        - label: "Evidence Bundle et revue indépendante obligatoires"
          required: true
