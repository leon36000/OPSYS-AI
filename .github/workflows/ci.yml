name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

# Une exécution commencée va au bout : avec l'annulation, chaque push arrivé en moins de 25 minutes
# (durée de la suite M3) annulait le précédent, et plus aucune exécution ne se terminait. Sans
# annulation, GitHub ne garde qu'UNE exécution en attente par groupe (la plus récente) : au plus une
# qui tourne et une qui attend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Socle : lint, cohérence des départements, tests du socle.
  socle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Installation (socle + départements)
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint du socle
        run: ruff check src tests
      - name: Cohérence des départements (manifestes, outils, dépendances)
        run: OPSYS_HOME="$RUNNER_TEMP/opsys" opsys verifier
      - name: Tests du socle
        run: pytest

  # Un job par département, en parallèle : la suite M3 (outils de mutation compris) prend à elle
  # seule près de 20 minutes, et une boucle séquentielle dépassait le délai du job unique.
  departement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Départements dont `ruff check` est à zéro : le lint y est bloquant (PLAN T5.1). Ajouter un
      # dossier ici dès qu'il est propre ; il ne reste que M3 à corriger. Un département
      # absent de cette liste n'est pas linté. `tests/test_ci_departements.py` vérifie que chaque
      # dossier listé existe, figure dans la matrice et passe `ruff check`.
      DEPARTEMENTS_LINT: >-
        [
          "m01-front-office",
          "m02-revenue-crm",
          "m04-field-ops",
          "m05-financecore",
          "m06-material-control",
          "m07-marketing",
          "m08-analytics",
          "m09-strategic-intelligence",
          "m10-memoire"
        ]
    strategy:
      fail-fast: false
      matrix:
        dossier:
          - m01-front-office
          - m02-revenue-crm
          - m03-estimation
          - m04-field-ops
          - m05-financecore
          - m06-material-control
          - m07-marketing
          - m08-analytics
          - m09-strategic-intelligence
          - m10-memoire
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Installation (socle + départements)
        run: python -m pip install --quiet -e ".[dev]"
      # PyVRP (extra `tournees`, PLAN T4.1-c) : seul M4 s'en sert ; sans lui, ses tests PyVRP seraient
      # sautés et seul le DP exact serait exercé.
      - name: Extra tournées (PyVRP) pour M4
        if: matrix.dossier == 'm04-field-ops'
        run: python -m pip install --quiet -e ".[tournees]"
      # ReportLab (extra `soumission`, PLAN T2.3-f) : seul M3 s'en sert (soumission brouillon en PDF) ; sans
      # lui, ses tests PDF seraient sautés et le rendu ne serait jamais exercé.
      - name: Extra soumission (ReportLab) pour M3
        if: matrix.dossier == 'm03-estimation'
        run: python -m pip install --quiet -e ".[soumission]"
      - name: Lint du département ${{ matrix.dossier }}
        if: contains(fromJSON(env.DEPARTEMENTS_LINT), matrix.dossier)
        run: ruff check "departments/${{ matrix.dossier }}"
      # M3 : les deux fichiers des outils de preuve (batteries de mutations) tournent dans `m03-preuves`,
      # en parallèle ; ensemble, ils dépassaient le délai de 45 minutes de ce job (CI 1929).
      - name: Tests du département ${{ matrix.dossier }}
        run: >-
          python -m pytest "departments/${{ matrix.dossier }}/tests" -q --import-mode=importlib -p no:cacheprovider
          ${{ matrix.dossier == 'm03-estimation' && format('--deselect {0} --deselect {1}',
          'departments/m03-estimation/tests/test_gardes_des_outils.py',
          'departments/m03-estimation/tests/test_outils_de_preuve.py') || '' }}

  # Les outils de preuve de M3 (mutations sur copie, T0.12) : un fichier par exécuteur, pour que chacun
  # tienne dans son délai. Même installation que le job de M3 (extra `soumission` compris).
  m03-preuves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `test_gardes_des_outils.py` dépassait seul 60 minutes (CI 1936) : ses cas sont répartis en
        # tourniquet sur `parts` exécuteurs ; chaque cas collecté va à une part et une seule.
        include:
          - {fichier: test_outils_de_preuve.py, part: 0, parts: 1}
          - {fichier: test_gardes_des_outils.py, part: 0, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 1, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 2, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 3, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 4, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 5, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 6, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 7, parts: 8}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Installation (socle + départements, extra soumission)
        run: python -m pip install --quiet -e ".[dev,soumission]"
      - name: Outils de preuve de M3 (${{ matrix.fichier }}, part ${{ matrix.part }}/${{ matrix.parts }})
        shell: bash
        run: |
          set -euo pipefail
          fichier="departments/m03-estimation/tests/${{ matrix.fichier }}"
          mapfile -t cas < <(python -m pytest "$fichier" --collect-only | grep "::")
          test "${#cas[@]}" -gt 0
          retenus=()
          for i in "${!cas[@]}"; do
            if (( i % ${{ matrix.parts }} == ${{ matrix.part }} )); then retenus+=("${cas[$i]}"); fi
          done
          echo "${#retenus[@]} cas sur ${#cas[@]} (part ${{ matrix.part }} sur ${{ matrix.parts }})"
          if (( ${#retenus[@]} == 0 )); then echo "aucun cas pour cette part"; exit 0; fi
          python -m pytest "${retenus[@]}" --durations=0

  # `gates` est le contexte requis par la protection de branche de `main` : garder ce nom. Il
  # tourne toujours (`if: always()`) et échoue explicitement si un job requis n'a pas réussi : un
  # job requis sauté ou annulé ne doit jamais passer pour un succès.
  gates:
    needs: [socle, departement, m03-preuves]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les jobs requis ont réussi
        run: |
          test "${{ needs.socle.result }}" = "success"
          test "${{ needs.departement.result }}" = "success"
          test "${{ needs.m03-preuves.result }}" = "success"
