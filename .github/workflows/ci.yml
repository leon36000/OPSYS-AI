name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

# Une exécution commencée va au bout : avec l'annulation, chaque push arrivé en moins de 25 minutes
# (durée de la suite M3) annulait le précédent, et plus aucune exécution ne se terminait. Sans
# annulation, GitHub ne garde qu'UNE exécution en attente par groupe (la plus récente) : au plus une
# qui tourne et une qui attend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Une politique commune juge le diff complet ; aucun filtre GitHub limité à 300 fichiers.
  changements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      core: ${{ steps.selection.outputs.core }}
      e2e_core: ${{ steps.selection.outputs.e2e_core }}
      mobile: ${{ steps.selection.outputs.mobile }}
      installateur: ${{ steps.selection.outputs.installateur }}
      dependency_audit: ${{ steps.selection.outputs.dependency_audit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Sélection du même commit et du diff complet
        id: selection
        run: python .github/ci/selection_workflows.py selection

  core:
    needs: changements
    if: needs.changements.outputs.core == 'true'
    uses: ./.github/workflows/core.yml

  e2e_core:
    needs: changements
    if: needs.changements.outputs.e2e_core == 'true'
    uses: ./.github/workflows/e2e-core.yml

  mobile:
    needs: changements
    if: needs.changements.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile.yml

  installateur:
    needs: changements
    if: needs.changements.outputs.installateur == 'true'
    uses: ./.github/workflows/installateur.yml

  dependency_audit:
    needs: changements
    if: needs.changements.outputs.dependency_audit == 'true'
    uses: ./.github/workflows/dependency-audit.yml

  # Socle : lint, cohérence des départements, tests du socle.
  socle:
    runs-on: ubuntu-latest
    # La suite complète n'est pas tronquée : le runner du HEAD 0753f4c3 a atteint
    # 45 minutes à 68 % malgré une référence verte en 41 minutes sur un autre runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Concordance entre uv.lock et le lock d'image
        run: |
          uv export --locked --group build --no-dev --extra postgres --extra console --extra tournees --extra soumission \
            --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/requirements-runtime.lock.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          expected = Path("requirements-runtime.lock.txt").read_text(encoding="utf-8").splitlines()[2:]
          generated = (Path(os.environ["RUNNER_TEMP"]) / "requirements-runtime.lock.txt").read_text(encoding="utf-8").splitlines()[2:]
          if expected != generated:
              raise SystemExit("requirements-runtime.lock.txt ne correspond plus à uv.lock")
          PY
      - name: Installation verrouillée (socle)
        run: |
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation --no-install-project
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint du socle
        run: ruff check src tests
      # `opsys` est la commande du core (PLAN T0.7 lot 2) ; la CLI du moteur est `opsys-metier` (`opsys metier` la lance
      # depuis le core, éprouvé par le job installateur).
      - name: Cohérence des départements (manifestes, outils, dépendances)
        run: OPSYS_HOME="$RUNNER_TEMP/opsys" opsys-metier verifier
      - name: Vérification de l’isolation PDF native
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          # Le runner Ubuntu applique un profil générique qui refuse net_admin/setpcap.
          # Opt-in par binaire uniquement : aucun sysctl global ni option bwrap changé.
          sudo install -o root -g root -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/opsys-ci-bwrap
          sudo apparmor_parser -a /etc/apparmor.d/opsys-ci-bwrap
          sudo grep -Fx '/usr/bin/bwrap (unconfined)' /sys/kernel/security/apparmor/profiles
          python - <<'PY'
          import subprocess
          from opsys.fusion_pdf import _commande_isolee

          commande = _commande_isolee()
          commande[-2:] = ["-I", "-c", "pass"]
          subprocess.run(commande, check=True, env={}, timeout=10)
          PY
      - name: Diagnostic du confinement PDF
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for chemin in (
              "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
              "/proc/sys/kernel/unprivileged_userns_clone",
              "/proc/self/attr/current",
          ):
              try:
                  valeur = Path(chemin).read_text().strip()
              except OSError as exc:
                  valeur = type(exc).__name__
              print(json.dumps({"source": chemin, "valeur": valeur}))
          for commande in (
              ["sudo", "aa-status"],
              ["sudo", "journalctl", "-k", "--no-pager", "--since=-5min", "-n", "64",
               "--grep=apparmor.*(bwrap|unprivileged_userns)"],
          ):
              resultat = subprocess.run(commande, capture_output=True, text=True, timeout=10)
              print(json.dumps({"commande": commande, "code": resultat.returncode,
                                "stdout": resultat.stdout[:16384], "stderr": resultat.stderr[:2048]}))
          PY
      - name: Préparation PostgreSQL pour les tests du socle
        run: python scripts/ci/preparer_pgvector.py
      - name: Tests du socle
        run: pytest -rs

  # Un job par département, en parallèle : la suite M3 (outils de mutation compris) prend à elle
  # seule près de 20 minutes, et une boucle séquentielle dépassait le délai du job unique.
  departement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Départements dont `ruff check` est à zéro : le lint y est bloquant (PLAN T5.1). Ajouter un
      # dossier ici dès qu'il est propre ; les dix départements sont maintenant contrôlés. Un département
      # absent de cette liste n'est pas linté. `tests/test_ci_departements.py` vérifie que chaque
      # dossier listé existe, figure dans la matrice et passe `ruff check`.
      DEPARTEMENTS_LINT: >-
        [
          "m01-front-office",
          "m02-revenue-crm",
          "m03-estimation",
          "m04-field-ops",
          "m05-financecore",
          "m06-material-control",
          "m07-marketing",
          "m08-analytics",
          "m09-strategic-intelligence",
          "m10-memoire"
        ]
    strategy:
      fail-fast: false
      matrix:
        dossier:
          - m01-front-office
          - m02-revenue-crm
          - m03-estimation
          - m04-field-ops
          - m05-financecore
          - m06-material-control
          - m07-marketing
          - m08-analytics
          - m09-strategic-intelligence
          - m10-memoire
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Installation verrouillée (extras requis par le département)
        env:
          DOSSIER: ${{ matrix.dossier }}
        run: |
          extras=(--extra dev)
          if [[ "$DOSSIER" == m04-field-ops ]]; then extras+=(--extra tournees); fi
          if [[ "$DOSSIER" == m03-estimation ]]; then extras+=(--extra soumission); fi
          uv sync --locked --group build "${extras[@]}" --no-build-isolation --no-install-project
          uv sync --locked --group build "${extras[@]}" --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint du département ${{ matrix.dossier }}
        if: contains(fromJSON(env.DEPARTEMENTS_LINT), matrix.dossier)
        run: ruff check "departments/${{ matrix.dossier }}"
      # Le test PostgreSQL en RAM refuse tout téléchargement implicite (--pull=never).
      # Le runner hébergé a un cache vide : préparer la même image que la fixture.
      - name: Préparation PostgreSQL pour les tests M10 en RAM
        if: matrix.dossier == 'm10-memoire'
        run: python scripts/ci/preparer_pgvector.py
      # M3 : les deux fichiers des outils de preuve (batteries de mutations) tournent dans `m03-preuves`,
      # en parallèle ; ensemble, ils dépassaient le délai de 45 minutes de ce job (CI 1929).
      - name: Tests du département ${{ matrix.dossier }}
        run: >-
          python -m pytest "departments/${{ matrix.dossier }}/tests" -q --import-mode=importlib -p no:cacheprovider
          ${{ matrix.dossier == 'm03-estimation' && format('--deselect {0} --deselect {1}',
          'departments/m03-estimation/tests/test_gardes_des_outils.py',
          'departments/m03-estimation/tests/test_outils_de_preuve.py') || '' }}

  # Les outils de preuve M3 restent répartis : leurs assertions d’empreinte sont désormais
  # appliquées à chaque scénario existant, sans rejouer toute la campagne dans un job isolé.
  m03-preuves:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Chaque cas collecté appartient exactement à une des parts du fichier.
        include:
          - {fichier: test_outils_de_preuve.py, part: 0, parts: 1}
          - {fichier: test_gardes_des_outils.py, part: 0, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 1, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 2, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 3, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 4, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 5, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 6, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 7, parts: 8}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Installation verrouillée (preuves M3)
        run: |
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation --no-install-project
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Outils de preuve de M3 (${{ matrix.fichier }}, part ${{ matrix.part }}/${{ matrix.parts }})
        shell: bash
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
        run: |
          set -euo pipefail
          fichier="departments/m03-estimation/tests/${{ matrix.fichier }}"
          collecte=$(python -m pytest "$fichier" --collect-only)
          mapfile -t cas < <(printf '%s\n' "$collecte" | grep "::")
          test "${#cas[@]}" -gt 0
          retenus=()
          for i in "${!cas[@]}"; do
            if (( i % PARTS == PART )); then retenus+=("${cas[$i]}"); fi
          done
          echo "${#retenus[@]} cas sur ${#cas[@]} (part $PART sur $PARTS)"
          test "${#retenus[@]}" -gt 0  # une part vide est une erreur, jamais un succès vide
          python -m pytest "${retenus[@]}" --durations=0

  # La frontière PostgreSQL reste une preuve réelle ; aucun skip autorisé sur le runner.
  frontiere-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Installation verrouillée pour la frontière PostgreSQL
        run: |
          uv sync --locked --group build --extra dev --extra postgres --no-build-isolation --no-install-project
          uv sync --locked --group build --extra dev --extra postgres --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Préparation explicite de PostgreSQL
        run: python scripts/ci/preparer_pgvector.py
      - name: Refus C02, lectures et ingestion M9, publication et retry du bus sur PostgreSQL réel
        env:
          OPSYS_QUALIFIER_M9_PG17: "1"
        run: |
          python -m pytest tests/e2e/test_verticale_postgresql_refus_c02.py tests/e2e/test_m9_snapshot_concurrent.py tests/e2e/test_m9_ingestion_concurrent.py tests/e2e/test_bus_publication_concurrente.py tests/e2e/test_m8_ingestion_reprise_concurrente.py tests/e2e/test_m5_mouvement_concurrent.py tests/e2e/test_m5_facture_brouillon_concurrent.py tests/e2e/test_m5_facture_consommateur_concurrent.py tests/e2e/test_m5_envoi_facture_concurrent.py tests/e2e/test_m5_paiement_facture_concurrent.py tests/e2e/test_m5_saisie_facture_fournisseur_concurrente.py tests/e2e/test_m5_saisie_sans_po_concurrente.py tests/e2e/test_m5_annulation_fournisseur_concurrente.py tests/e2e/test_m5_correction_fournisseur_concurrente.py tests/e2e/test_m5_reception_consumer_concurrente.py tests/e2e/test_m7_inbox_concurrente.py tests/e2e/test_m7_decision_concurrente.py --junitxml="$RUNNER_TEMP/frontiere-postgresql.xml"
          python - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          rapport = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "frontiere-postgresql.xml")
          cas = list(rapport.iter("testcase"))
          assert len(cas) == 24, "un refus C02, trois lectures, une ingestion M9, deux publications du bus, un claim de retry frais du bus, une reprise M8, un mouvement M5, un brouillon M5 deux ordres devis/WCT M5 un envoi N4 approuvé M5 un paiement constaté N5 M5 une saisie fournisseur AP M5 une saisie sans PO M5 une annulation fournisseur N4 M5 une correction fournisseur N4 M5 une réception M6 vers M5 deux imports M7 interposés et deux décisions M7 opposées sont requis"
          assert all(c.find("skipped") is None for c in cas), "PostgreSQL ne doit pas être ignoré sur le runner"
          assert all(c.find("failure") is None and c.find("error") is None for c in cas)
          print(f"{len(cas)} frontières PostgreSQL réelles qualifiées ; verticale C02 complète bloquée")
          PYTHON
      - name: Conserver les preuves PostgreSQL, y compris rouges
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2, MIT
        with:
          name: frontiere-postgresql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontiere-postgresql.xml
          if-no-files-found: error

  # Le contexte requis juge les groupes Python et les cinq appels du même run/commit.
  gates:
    # Le push privé juge un diff à deux points ; son contrôle a un nom distinct de celui de la PR.
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'gates-push' || 'gates' }}
    needs: [changements, socle, departement, m03-preuves, frontiere-postgresql, core, e2e_core, mobile, installateur, dependency_audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Chaque preuve applicable a réussi ; seuls les appels non applicables sont ignorés
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python .github/ci/selection_workflows.py gates
