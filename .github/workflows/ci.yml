name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `gates` est le contexte requis par la protection de branche de `main` : garder ce nom.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Installation (socle + départements)
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint du socle
        run: ruff check src tests
      - name: Cohérence des départements (manifestes, outils, dépendances)
        run: OPSYS_HOME="$RUNNER_TEMP/opsys" opsys verifier
      - name: Tests du socle
        run: pytest
      - name: Tests des départements
        run: |
          set -e
          for d in departments/*/; do
            python -m pytest "$d/tests" -q --import-mode=importlib -p no:cacheprovider
          done
