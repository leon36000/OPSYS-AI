name: gates
on: [pull_request, push]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5 — pin SHA (D-035)
      - name: Installer les dépendances de test
        run: python3 -m pip install --quiet pytest pyyaml
      - name: Structure lint (D-038)
        run: python3 scripts/structure_lint.py
      - name: Ledger integrity (D-042)
        run: python3 scripts/ledger_append.py verify
      - name: Statut lint (cohérence statut déclaré / réalité mesurée, #152)
        run: python3 scripts/statut_lint.py
      - name: Tests des scripts de methode (R-030)
        run: python3 -m pytest scripts/tests -q
      # AUD-CI-003/004 (issue #565) : ces trois steps sont des pytest unitaires
      # purs (imports vérifiés : stdlib + pytest + PyYAML uniquement, aucun
      # besoin du harnais e2e) — déplacés hors du job `e2e` (continue-on-error)
      # car `gates` est le SEUL contexte required en branch protection sur
      # `main` (mesuré : gh api repos/leon36000/OPSYS-AI/branches/main/protection).
      # Les y placer les rend réellement bloquants, pas seulement exécutés.
      - name: Tests dashboard (P0-5a)
        run: python3 -m pytest "surfaces/dashboard/tests" -q
      - name: Tests authz (P0-5c)
        run: python3 -m pytest "core/src/authz/tests" -q
      - name: Tests config/vault (P0-5d)
        run: python3 -m pytest "core/src/config/tests" -q
      - name: Tests module M7 (M7-S000)
        run: python3 -m pytest "Modules M/M7-marketing/tests" -q
      # Un pytest DISTINCT par module : les modules exposent des noms de premier niveau
      # identiques (registre, horodatage, verdicts, encodage). Dans un processus partage,
      # sys.modules garde le premier charge et un module en exercerait un autre — mesure
      # M2-S002 : 21 echecs, verdicts/horodatage/registre resolus vers le mauvais arbre.
      # Isolation intermodule GLOBALE (C04-002) : le garde-fou réel est ce step, pas un
      # fichier de test unique — commentaire précédent périmé (citait un chemin
      # jamais réel dans ce dépôt, cf. tasks/C04-002.md).
      - name: Isolation intermodule globale (C04-002)
        run: python3 core/scripts/check_module_isolation.py
      - name: Tests module M1 (EPIC E — branché avant la premiere story, exigence revue scellee)
        run: python3 -m pytest "Modules M/M1-front-office/tests" -q
      - name: Tests module M2 (EPIC F — rattrapage, M2-S001 avait fusionne sans gate)
        run: python3 -m pytest "Modules M/M2-revenue-crm/tests" -q
      - name: Tests module M4 (EPIC G — branché avant la première story, leçon M1)
        run: python3 -m pytest "Modules M/M4-field-ops/tests" -q
      - name: Tests module M3 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M3-estimation/tests" -q
      - name: Tests module M6 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M6-material-control/tests" -q
      - name: Tests module M8 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M8-analytics/tests" -q
      - name: Tests module M5 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M5-financecore/tests" -q
      - name: Tests module M9 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M9-strategic-intelligence/tests" -q
      - name: Tests module M10 (cadrage — sentinelle branchée avant la première story)
        run: python3 -m pytest "Modules M/M10-memoire/tests" -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_BIN: python3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5 — pin SHA (D-035)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test épinglées
        run: python3 -m pip install --quiet --require-hashes -r tests/e2e/requirements.lock
      - name: Run e2e harness
        run: bash scripts/run-e2e.sh e2e

  e2e-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_BIN: python3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5 — pin SHA (D-035)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test épinglées
        run: python3 -m pip install --quiet --require-hashes -r tests/e2e/requirements.lock
      - name: Installer k6 v0.54.0 (pinné avec checksum)
        run: |
          K6_VERSION="v0.54.0"
          K6_TAR="k6-${K6_VERSION}-linux-amd64.tar.gz"
          K6_URL="https://github.com/grafana/k6/releases/download/${K6_VERSION}/${K6_TAR}"
          EXPECTED_SHA256="c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589"
          curl -fsSL -o "${K6_TAR}" "${K6_URL}"
          echo "${EXPECTED_SHA256}  ${K6_TAR}" | sha256sum -c -
          mkdir -p "${HOME}/k6"
          tar -xzf "${K6_TAR}" -C "${HOME}/k6" --strip-components=1
          echo "${HOME}/k6" >> "${GITHUB_PATH}"
      - name: Run k6 smoke
        run: bash scripts/run-e2e.sh load
