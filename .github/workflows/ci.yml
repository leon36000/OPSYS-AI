name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

# Une exécution commencée va au bout : avec l'annulation, chaque push arrivé en moins de 25 minutes
# (durée de la suite M3) annulait le précédent, et plus aucune exécution ne se terminait. Sans
# annulation, GitHub ne garde qu'UNE exécution en attente par groupe (la plus récente) : au plus une
# qui tourne et une qui attend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Socle : lint, cohérence des départements, tests du socle.
  socle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Concordance entre uv.lock et le lock d'image
        run: |
          uv export --locked --group build --no-dev --extra postgres --extra console --extra tournees --extra soumission \
            --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/requirements-runtime.lock.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          expected = Path("requirements-runtime.lock.txt").read_text(encoding="utf-8").splitlines()[2:]
          generated = (Path(os.environ["RUNNER_TEMP"]) / "requirements-runtime.lock.txt").read_text(encoding="utf-8").splitlines()[2:]
          if expected != generated:
              raise SystemExit("requirements-runtime.lock.txt ne correspond plus à uv.lock")
          PY
      - name: Installation verrouillée (socle)
        run: |
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation --no-install-project
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint du socle
        run: ruff check src tests
      # `opsys` est la commande du core (PLAN T0.7 lot 2) ; la CLI du moteur est `opsys-metier` (`opsys metier` la lance
      # depuis le core, éprouvé par le job installateur).
      - name: Cohérence des départements (manifestes, outils, dépendances)
        run: OPSYS_HOME="$RUNNER_TEMP/opsys" opsys-metier verifier
      - name: Vérification de l’isolation PDF native
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          # Le runner Ubuntu applique un profil générique qui refuse net_admin/setpcap.
          # Opt-in par binaire uniquement : aucun sysctl global ni option bwrap changé.
          sudo install -o root -g root -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/opsys-ci-bwrap
          sudo apparmor_parser -a /etc/apparmor.d/opsys-ci-bwrap
          sudo grep -Fx '/usr/bin/bwrap (unconfined)' /sys/kernel/security/apparmor/profiles
          python - <<'PY'
          import subprocess
          from opsys.fusion_pdf import _commande_isolee

          commande = _commande_isolee()
          commande[-2:] = ["-I", "-c", "pass"]
          subprocess.run(commande, check=True, env={}, timeout=10)
          PY
      - name: Diagnostic du confinement PDF
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for chemin in (
              "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
              "/proc/sys/kernel/unprivileged_userns_clone",
              "/proc/self/attr/current",
          ):
              try:
                  valeur = Path(chemin).read_text().strip()
              except OSError as exc:
                  valeur = type(exc).__name__
              print(json.dumps({"source": chemin, "valeur": valeur}))
          for commande in (
              ["sudo", "aa-status"],
              ["sudo", "journalctl", "-k", "--no-pager", "--since=-5min", "-n", "64",
               "--grep=apparmor.*(bwrap|unprivileged_userns)"],
          ):
              resultat = subprocess.run(commande, capture_output=True, text=True, timeout=10)
              print(json.dumps({"commande": commande, "code": resultat.returncode,
                                "stdout": resultat.stdout[:16384], "stderr": resultat.stderr[:2048]}))
          PY
      - name: Tests du socle
        run: pytest

  # Un job par département, en parallèle : la suite M3 (outils de mutation compris) prend à elle
  # seule près de 20 minutes, et une boucle séquentielle dépassait le délai du job unique.
  departement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Départements dont `ruff check` est à zéro : le lint y est bloquant (PLAN T5.1). Ajouter un
      # dossier ici dès qu'il est propre ; les dix départements sont maintenant contrôlés. Un département
      # absent de cette liste n'est pas linté. `tests/test_ci_departements.py` vérifie que chaque
      # dossier listé existe, figure dans la matrice et passe `ruff check`.
      DEPARTEMENTS_LINT: >-
        [
          "m01-front-office",
          "m02-revenue-crm",
          "m03-estimation",
          "m04-field-ops",
          "m05-financecore",
          "m06-material-control",
          "m07-marketing",
          "m08-analytics",
          "m09-strategic-intelligence",
          "m10-memoire"
        ]
    strategy:
      fail-fast: false
      matrix:
        dossier:
          - m01-front-office
          - m02-revenue-crm
          - m03-estimation
          - m04-field-ops
          - m05-financecore
          - m06-material-control
          - m07-marketing
          - m08-analytics
          - m09-strategic-intelligence
          - m10-memoire
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Installation verrouillée (extras requis par le département)
        env:
          DOSSIER: ${{ matrix.dossier }}
        run: |
          extras=(--extra dev)
          if [[ "$DOSSIER" == m04-field-ops ]]; then extras+=(--extra tournees); fi
          if [[ "$DOSSIER" == m03-estimation ]]; then extras+=(--extra soumission); fi
          uv sync --locked --group build "${extras[@]}" --no-build-isolation --no-install-project
          uv sync --locked --group build "${extras[@]}" --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint du département ${{ matrix.dossier }}
        if: contains(fromJSON(env.DEPARTEMENTS_LINT), matrix.dossier)
        run: ruff check "departments/${{ matrix.dossier }}"
      # M3 : les deux fichiers des outils de preuve (batteries de mutations) tournent dans `m03-preuves`,
      # en parallèle ; ensemble, ils dépassaient le délai de 45 minutes de ce job (CI 1929).
      - name: Tests du département ${{ matrix.dossier }}
        run: >-
          python -m pytest "departments/${{ matrix.dossier }}/tests" -q --import-mode=importlib -p no:cacheprovider
          ${{ matrix.dossier == 'm03-estimation' && format('--deselect {0} --deselect {1}',
          'departments/m03-estimation/tests/test_gardes_des_outils.py',
          'departments/m03-estimation/tests/test_outils_de_preuve.py') || '' }}

  # Les outils de preuve M3 restent répartis : leurs assertions d’empreinte sont désormais
  # appliquées à chaque scénario existant, sans rejouer toute la campagne dans un job isolé.
  m03-preuves:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Chaque cas collecté appartient exactement à une des parts du fichier.
        include:
          - {fichier: test_outils_de_preuve.py, part: 0, parts: 1}
          - {fichier: test_gardes_des_outils.py, part: 0, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 1, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 2, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 3, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 4, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 5, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 6, parts: 8}
          - {fichier: test_gardes_des_outils.py, part: 7, parts: 8}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée)
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Installation verrouillée (preuves M3)
        run: |
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation --no-install-project
          uv sync --locked --group build --extra dev --extra soumission --no-build-isolation
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Outils de preuve de M3 (${{ matrix.fichier }}, part ${{ matrix.part }}/${{ matrix.parts }})
        shell: bash
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
        run: |
          set -euo pipefail
          fichier="departments/m03-estimation/tests/${{ matrix.fichier }}"
          collecte=$(python -m pytest "$fichier" --collect-only)
          mapfile -t cas < <(printf '%s\n' "$collecte" | grep "::")
          test "${#cas[@]}" -gt 0
          retenus=()
          for i in "${!cas[@]}"; do
            if (( i % PARTS == PART )); then retenus+=("${cas[$i]}"); fi
          done
          echo "${#retenus[@]} cas sur ${#cas[@]} (part $PART sur $PARTS)"
          test "${#retenus[@]}" -gt 0  # une part vide est une erreur, jamais un succès vide
          python -m pytest "${retenus[@]}" --durations=0

  # `gates` reste le contexte requis par la protection de branche historique. Le job mobile a un
  # nom distinct (`mobile-gates`). Ce contrôle tourne toujours (`if: always()`) et échoue si un
  # job Python requis a été sauté ou annulé.
  gates:
    needs: [socle, departement, m03-preuves]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les jobs requis ont réussi
        run: |
          test "${{ needs.socle.result }}" = "success"
          test "${{ needs.departement.result }}" = "success"
          test "${{ needs.m03-preuves.result }}" = "success"
