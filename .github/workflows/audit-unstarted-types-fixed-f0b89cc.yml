        pnpm tsgo:test:root 2>&1 | tee "$AUDIT_OUTPUT/type_29.log"
    - name: État de chaque invocation, sans transformer les rouges en verts
      if: always()
      env:
        ONLY_TYPE_OUTCOMES: '{"type_01":"${{ steps.type_01.outcome }}","type_02":"${{ steps.type_02.outcome }}","type_03":"${{
          steps.type_03.outcome }}","type_04":"${{ steps.type_04.outcome }}","type_05":"${{ steps.type_05.outcome }}","type_06":"${{
          steps.type_06.outcome }}","type_07":"${{ steps.type_07.outcome }}","type_08":"${{ steps.type_08.outcome }}","type_09":"${{
          steps.type_09.outcome }}","type_10":"${{ steps.type_10.outcome }}","type_11":"${{ steps.type_11.outcome }}","type_12":"${{
          steps.type_12.outcome }}","type_13":"${{ steps.type_13.outcome }}","type_14":"${{ steps.type_14.outcome }}","type_15":"${{
          steps.type_15.outcome }}","type_16":"${{ steps.type_16.outcome }}","type_17":"${{ steps.type_17.outcome }}","type_18":"${{
          steps.type_18.outcome }}","type_19":"${{ steps.type_19.outcome }}","type_20":"${{ steps.type_20.outcome }}","type_21":"${{
          steps.type_21.outcome }}","type_22":"${{ steps.type_22.outcome }}","type_23":"${{ steps.type_23.outcome }}","type_24":"${{
          steps.type_24.outcome }}","type_25":"${{ steps.type_25.outcome }}","type_26":"${{ steps.type_26.outcome }}","type_27":"${{
          steps.type_27.outcome }}","type_28":"${{ steps.type_28.outcome }}","type_29":"${{ steps.type_29.outcome }}"}'
      timeout-minutes: 1
      run: |
        python3 -I -B - <<'PY_OUTCOMES'
        import json,os,pathlib
        p=pathlib.Path(os.environ['AUDIT_OUTPUT'])
        commands=json.loads((p/'commands.json').read_text())
        states=json.loads(os.environ['ONLY_TYPE_OUTCOMES'])
        assert set(states)=={c['id']for c in commands}
        result=[dict(c,step_outcome=states[c['id']])for c in commands]
        (p/'outcomes.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps({'total':len(result),'outcomes':states,'not_test_PASS_credit':True}))
        PY_OUTCOMES
    - name: Source43996 exacte après les graphes, même rouges
      if: always() && steps.identity.outcome == 'success'
      env:
        IDENTITY_PHASE: after
      timeout-minutes: 5
      run: |
        python3 -I -B - <<'PY_IDENTITY'
        import hashlib, json, os, pathlib, re, subprocess
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        def git(*args):
            return subprocess.check_output(['git', '-C', str(root), *args])
        head = git('rev-parse', 'HEAD').decode().strip()
        tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
        assert head == os.environ['EXPECTED_HEAD'], 'HEAD_DIFFERENT'
        assert tree == os.environ['EXPECTED_TREE'], 'TREE_DIFFERENT'
        paths = sorted(p.decode('utf-8') for p in git('ls-files', '-z').split(bytes([0])) if p)
        assert len(paths) == 43996 and len(set(paths)) == 43996, 'TRACKED_FILE_COUNT'
        aggregate = hashlib.sha256()
        for name in paths:
            file = root / name
            assert file.is_file() and not file.is_symlink(), 'TRACKED_FILE_KIND'
            content = hashlib.sha256()
            with file.open('rb') as stream:
                for block in iter(lambda: stream.read(1024 * 1024), b''):
                    content.update(block)
            aggregate.update(name.encode('utf-8'))
            aggregate.update(bytes([0]))
            aggregate.update(content.digest())
        assert aggregate.hexdigest() == os.environ['EXPECTED_SOURCE_SHA'], 'SOURCE_BYTES_DIFFERENT'
        package = json.loads((root / 'core/package.json').read_text())
        assert package['packageManager'] == os.environ['EXPECTED_PACKAGE_MANAGER'], 'PACKAGE_MANAGER_DIFFERENT'
        shards = (root / 'core/test/vitest/vitest.test-shards.mjs').read_text().split('export const fullSuiteVitestShards = [', 1)[1]
        groups = re.findall('config: "([^"]+)",.*?name: "([^"]+)"', shards, re.S)
        assert len(groups) == 12 and len({g[0] for g in groups}) == 12, 'CANONICAL_GROUP_COUNT'
        receipt = {'head':head, 'tree':tree, 'tracked_files':len(paths), 'SourceSHA':aggregate.hexdigest(),
                   'packageManager':package['packageManager'], 'canonical_groups':[{'config':c,'name':n} for c,n in groups],
                   'scope':'identity and bytes only; not test/runtime qualification'}
        output = pathlib.Path(os.environ['AUDIT_OUTPUT'])
        output.mkdir(parents=True, exist_ok=True)
        (output / ('identity-' + os.environ['IDENTITY_PHASE'] + '.json')).write_text(json.dumps(receipt, indent=2) + chr(10))
        print(json.dumps(receipt))
        PY_IDENTITY
