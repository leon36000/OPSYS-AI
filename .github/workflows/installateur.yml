name: installateur
on:
  workflow_dispatch:
    inputs:
      sans_service:
        description: "1 : saute la phase du service systemd utilisateur"
        type: choice
        options: ["0", "1"]
        default: "0"
  push:
    branches: [main, "claude/**"]
    paths:
      - "install/**"
      - "tests/installateur/**"
      - "src/opsys/instance.py"
      - "src/opsys/exportation.py"
      - "core/package.json"
      - "core/pnpm-lock.yaml"
      - "pyproject.toml"
      - ".github/workflows/installateur.yml"
  pull_request:
    paths:
      - "install/**"
      - "tests/installateur/**"
      - "src/opsys/instance.py"
      - "src/opsys/exportation.py"
      - "core/package.json"
      - "core/pnpm-lock.yaml"
      - "pyproject.toml"
      - ".github/workflows/installateur.yml"

permissions:
  contents: read

# Un run commencé va à son terme (même règle que core.yml, e2e-core.yml et ci.yml).
concurrency:
  group: installateur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Analyse statique, rapide : les scripts bash passent shellcheck, les scripts PowerShell passent l'analyseur
  # syntaxique de PowerShell (préinstallé sur les runners GitHub). C'est la seule vérification de install.ps1 et
  # uninstall.ps1 : aucun job ne les exécute sous Windows (voir docs/exploitation/INSTALLATION.md).
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - name: shellcheck et bash -n
        run: |
          shellcheck -s bash install/install.sh install/uninstall.sh tests/installateur/bout_en_bout.sh
          for script in install/install.sh install/uninstall.sh tests/installateur/bout_en_bout.sh; do bash -n "$script"; done
      - name: Analyse syntaxique PowerShell
        shell: pwsh
        run: |
          $echec = $false
          foreach ($fichier in 'install/install.ps1', 'install/uninstall.ps1') {
            $erreurs = $null
            $jetons = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $fichier).Path, [ref]$jetons, [ref]$erreurs) | Out-Null
            if ($erreurs.Count -gt 0) {
              $echec = $true
              foreach ($erreur in $erreurs) { Write-Host "::error file=$fichier,line=$($erreur.Extent.StartLineNumber)::$($erreur.Message)" }
            } else {
              Write-Host "$fichier : syntaxe valide"
            }
          }
          if ($echec) { exit 1 }

  # Le trajet réel : install.sh construit le core, installe le moteur par uv, génère et valide la configuration,
  # démarre le Gateway (qui lance le moteur), installe le service utilisateur si systemd --user existe, exporte,
  # restaure, puis désinstalle sans perdre une donnée. Aucune étape ne tolère l'échec ; l'absence de systemd --user
  # est signalée en clair (annotation et résumé du job), et le Gateway est alors prouvé au premier plan.
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # uv est un prérequis de l'installateur, comme il le serait chez un utilisateur ; PyPI le publie.
      - name: "uv (prérequis de l'installateur)"
        run: python -m pip install --quiet uv && uv --version
      - name: "Installateur : scripts joués contre de fausses commandes"
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m pytest tests/test_installateur_scripts.py tests/test_installateur_powershell.py tests/test_instance.py tests/test_exportation.py -q --import-mode=importlib -p no:cacheprovider
      - name: Installateur avec le vrai core
        env:
          OPSYS_TRAVAIL: ${{ runner.temp }}/installateur
          OPSYS_SANS_SERVICE: ${{ inputs.sans_service || '0' }}
        run: bash tests/installateur/bout_en_bout.sh
      - name: "Journaux (en cas d'échec)"
        if: failure()
        shell: bash
        run: |
          for journal in "$RUNNER_TEMP"/installateur/*.log "$RUNNER_TEMP"/installateur/logiciel/journaux/*.log; do
            [ -f "$journal" ] || continue
            echo "::group::$journal"
            tail -n 300 "$journal" || true
            echo "::endgroup::"
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" journalctl --user --no-pager -n 200 2>/dev/null || true
