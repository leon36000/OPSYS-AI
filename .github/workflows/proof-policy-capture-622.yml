name: proof-policy-capture-622
# Temporary capture; removed before any merge. No production services involved.
on:
  push:
    branches: [chatgpt/issue-182-sonar-diagnostics]
    paths: [.github/workflows/proof-policy-capture-622.yml]
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'leon36000/OPSYS-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact executed pytest events
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_ADDOPTS: ''
        run: |
          set -eu
          test "$(git rev-parse origin/main)" = fcb65bcf20980a0b36847dbd41808527ba616d52
          python3 -m pip install --quiet pytest==9.1.1
          cat > /tmp/opsys-ci-capture.py <<'PY'
          """Temporary CI capture and narrow evidence publication; no source edits."""
          import base64
          import contextlib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import urllib.request
          import zlib

          ROOT = Path(os.environ['GITHUB_WORKSPACE'])
          os.chdir(ROOT)
          sys.path.insert(0, str(ROOT / 'core/scripts'))
          import proof_execution_receipts as policy
          import verify_proof_sealed as gate
          TASK = ROOT / 'evidence/tasks/SONAR-DIAGNOSTICS-182'
          REPO = 'leon36000/OPSYS-AI'
          BRANCH = 'chatgpt/issue-182-sonar-diagnostics'


          def inputs():
              return {p: hashlib.sha256((ROOT / p).read_bytes()).hexdigest() for p in policy.SUBJECT_FILES}


          class Events:
              def __init__(self):
                  self.events = []
                  self.errors = 0
                  self.deselected = 0

              def pytest_runtest_logreport(self, report):
                  outcome = report.outcome
                  if hasattr(report, 'wasxfail'):
                      outcome = 'xfailed' if report.skipped else 'xpassed'
                  self.events.append({'nodeid': report.nodeid, 'when': report.when, 'outcome': outcome})

              def pytest_collectreport(self, report):
                  if report.failed:
                      self.errors += 1

              def pytest_deselected(self, items):
                  self.deselected += len(items)


          def capture(label):
              import pytest
              target = policy.SUITES[label][0]
              argv = ['-q', '-p', 'no:cacheprovider', target]
              before = inputs()
              events = Events()
              stdout, stderr = io.StringIO(), io.StringIO()
              with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
                  rc = int(pytest.main(argv, plugins=[events]))
              if rc != 0 or inputs() != before or events.errors or events.deselected:
                  raise RuntimeError('EXECUTION_FAILED_OR_INPUT_CHANGED')
              receipt = {'schema_version': 1, 'code_diff_sha256': gate._diff_sha256_actuel(),
                         'input_files': before, 'argv': argv, 'returncode': rc,
                         'collection_errors': events.errors, 'deselected': events.deselected,
                         'environment': {'python': platform.python_version(), 'pytest': pytest.__version__},
                         'events': events.events}
              folder = TASK / 'execution'
              folder.mkdir(exist_ok=True)
              (folder / (label + '.json.zlib')).write_bytes(zlib.compress(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode(), 9))
              (folder / (label + '.stdout.txt')).write_text(stdout.getvalue())
              (folder / (label + '.stderr.txt')).write_text(stderr.getvalue())
              print('CAPTURE', label, rc, len(events.events) // 3)


          def collect_all():
              manifest = json.loads((TASK / 'evidence.json').read_text())
              if inputs() != manifest['execution']['input_files']:
                  raise RuntimeError('INPUT_MANIFEST_MISMATCH')
              if gate._diff_sha256_actuel() != manifest['code_diff_sha256']:
                  raise RuntimeError('DIFF_MANIFEST_MISMATCH')
              for label in policy.SUITES:
                  subprocess.run([sys.executable, __file__, label], check=True, timeout=120)
              manifest['execution']['artifacts'] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((TASK / 'execution').iterdir())}
              manifest['receipt_capture'] = {'origin': 'GitHub Actions', 'run_id': os.environ['GITHUB_RUN_ID'],
                  'source_commit': os.environ['GITHUB_SHA'], 'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'source_inputs_verified': True, 'signed_attestation': False, 'counts': {'exporter':112, 'policy':58, 'legacy':28}}
              (TASK / 'evidence.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
              subprocess.run([sys.executable, 'core/scripts/verify_proof_sealed.py', '--task', policy.TASK, '--min-vendors', '3'], check=True, timeout=60)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  fp.close()
                  raise RuntimeError('REDIRECT_REFUSED')


          def publish():
              # Only this branch and these evidence paths can be updated.
              sha = os.environ['GITHUB_SHA']
              if os.environ['GITHUB_REPOSITORY'] != REPO or os.environ['GITHUB_REF'] != 'refs/heads/' + BRANCH or not re.fullmatch('[0-9a-f]{40}', sha):
                  raise RuntimeError('WRONG_TARGET')
              opener = urllib.request.build_opener(NoRedirect())
              def api(method, path, data=None):
                  request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                      data=None if data is None else json.dumps(data).encode(), method=method,
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
                  with opener.open(request, timeout=20) as response:
                      return json.load(response)
              ref = 'git/refs/heads/' + BRANCH
              if api('GET', ref)['object']['sha'] != sha:
                  raise RuntimeError('BRANCH_MOVED')
              tree = api('GET', 'git/commits/' + sha)['tree']['sha']
              paths = ['evidence.json'] + ['execution/' + name for name in sorted(policy.ARTIFACTS)]
              entries = []
              for relative in paths:
                  raw = (TASK / relative).read_bytes()
                  blob = api('POST', 'git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})['sha']
                  expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  if blob != expected:
                      raise RuntimeError('BLOB_MISMATCH')
                  entries.append({'path': 'evidence/tasks/' + policy.TASK + '/' + relative, 'mode': '100644', 'type': 'blob', 'sha': blob})
              new_tree = api('POST', 'git/trees', {'base_tree': tree, 'tree': entries})['sha']
              commit = api('POST', 'git/commits', {'tree': new_tree, 'parents': [sha],
                  'message': 'proof: capture 198 executed tests in GitHub Actions for no-trio policy (#182)\n\nNo source edits or approvals. Actual stage receipts, stdout/stderr, exact input and diff hashes. Draft remains subject to independent CI/scanner checks.'})['sha']
              api('PATCH', ref, {'sha': commit, 'force': False})
              print('RECEIPTS_COMMIT=' + commit)


          if __name__ == '__main__':
              if sys.argv[1] == 'capture-all':
                  collect_all()
              elif sys.argv[1] == 'publish':
                  publish()
              elif sys.argv[1] in policy.SUITES:
                  capture(sys.argv[1])
              else:
                  raise RuntimeError('UNKNOWN_OPERATION')
          PY
          python3 /tmp/opsys-ci-capture.py capture-all
      - name: Publish only evidence to the current candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/opsys-ci-capture.py publish
      - name: Archive evidence for byte verification
        run: tar -cf /tmp/proof-receipts.tar evidence/tasks/SONAR-DIAGNOSTICS-182
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-receipts-622
          path: /tmp/proof-receipts.tar
          if-no-files-found: error
          retention-days: 1
