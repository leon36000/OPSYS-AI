name: proof-policy-capture-622
# Temporary evidence capture and diagnosis; remove before any merge.
on:
  push:
    branches: [chatgpt/issue-182-sonar-diagnostics]
    paths: [.github/workflows/proof-policy-capture-622.yml]
permissions:
  contents: write
  checks: read
jobs:
  capture:
    if: github.repository == 'leon36000/OPSYS-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare previously reviewed capture script
        run: |
          set -eu
          test "$(git rev-parse origin/main)" = fcb65bcf20980a0b36847dbd41808527ba616d52
          python3 -m pip install --quiet pytest==9.1.1 mypy==2.1.0 PyYAML==6.0.1
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, yaml
          previous = subprocess.check_output(['git','show','3183c625de5105047fab2953c2fbc337557a1539:.github/workflows/proof-policy-capture-622.yml'], text=True)
          shell = yaml.safe_load(previous)['jobs']['capture']['steps'][1]['run']
          source = shell.partition("<<'PY'\n")[2].partition('\nPY\n')[0] + '\n'
          assert hashlib.sha256(source.encode()).hexdigest() == '4b5e7817f2a18fe4d5930df53a1653efe350e728783d3caa213a74449f8febf8'
          source = source.replace('before = inputs()\n    events = Events()', 'before = inputs()\n    working_argv = list(argv)\n    events = Events()')
          source = source.replace('pytest.main(argv, plugins=[events])', 'pytest.main(working_argv, plugins=[events])')
          source = source.replace("print('CAPTURE', label, rc, len(events.events) // 3)", "print('CAPTURE', label, rc, len(events.events) // 3)\n    print('PYTEST_ARGUMENTS', json.dumps({'submitted': argv, 'after_pytest': working_argv}))")
          pathlib.Path('/tmp/opsys-ci-capture.py').write_text(source)
          compile(source, '/tmp/opsys-ci-capture.py', 'exec')
          PY
      - name: Read diagnostic findings without changing gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, runpy, subprocess, tomllib, urllib.request
          cfg = tomllib.load(open('core/quality-gates.toml','rb'))
          command = next(g['argv'] for g in cfg['gates'] if g['name'] == 'mypy-core')
          result = subprocess.run(command, capture_output=True, text=True, timeout=120)
          print('MYPY_DIAGNOSTIC_RC', result.returncode)
          print(result.stdout)
          print(result.stderr)
          helper = runpy.run_path('/tmp/opsys-ci-capture.py')
          opener = urllib.request.build_opener(helper['NoRedirect']())
          root = 'https://api.github.com/repos/leon36000/OPSYS-AI/check-runs/101700217667'
          def get(url):
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with opener.open(request, timeout=20) as response:
                  return json.load(response)
          info = get(root)
          assert info['head_sha'] == '3183c625de5105047fab2953c2fbc337557a1539' and info['app']['id'] == 12526
          rows = get(root + '/annotations?per_page=100')
          assert len(rows) == info['output']['annotations_count'] and len(rows) <= 100
          fields = ('path','start_line','end_line','annotation_level','title','message')
          print('SONAR_ANNOTATIONS', json.dumps([{k:r.get(k) for k in fields} for r in rows]))
          PY
      - name: Capture actual test execution
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_ADDOPTS: ''
        run: python3 /tmp/opsys-ci-capture.py capture-all
      - name: Publish only evidence to the current candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/opsys-ci-capture.py publish
      - name: Archive evidence for byte verification
        if: always()
        run: tar -cf /tmp/proof-receipts.tar evidence/tasks/SONAR-DIAGNOSTICS-182
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proof-receipts-622
          path: /tmp/proof-receipts.tar
          if-no-files-found: error
          retention-days: 1
