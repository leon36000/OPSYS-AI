name: core
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]

permissions:
  contents: read

# Un run commencé va à son terme : ce job dure plus de 30 min et chaque résultat complet sert de
# référence. GitHub ne garde qu'un run en attente par groupe, le plus récent.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: core

jobs:
  # Construit et teste OPSYS-CORE, fork dur d'OpenClaw v2026.9.6 (ADR-0008, core/PROVENANCE.md).
  # Le bac à sable de développement n'exécute pas ce code : cette CI est la seule preuve de
  # construction.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"
      - name: pnpm (version fixée par packageManager)
        run: corepack enable && pnpm --version
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Construction
        run: pnpm build
      - name: Tests unitaires rapides
        # Mêmes réglages que la CI amont (ci.yml) : la config unitaire partage ses workers
        # (isolate: false), elle tourne avec peu de workers et 8 Go de tas Node.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        run: pnpm test:fast
