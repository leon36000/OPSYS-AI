name: core
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]

permissions:
  contents: read

# Un run commencé va à son terme : chaque résultat complet sert de référence. GitHub ne garde
# qu'un run en attente par groupe, le plus récent.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: core

jobs:
  # Construit OPSYS-CORE, fork dur d'OpenClaw v2026.9.6 (ADR-0008, core/PROVENANCE.md).
  # Cette preuve CI complète les vérifications locales ciblées décrites dans core/AGENTS.md.
  construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"
      - name: pnpm (version fixée par packageManager)
        run: corepack enable && pnpm --version
      - name: Installation
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Construction
        run: pnpm build
      - name: Profil mémoire de l'extension vocale après construction
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: node --import tsx scripts/profile-extension-memory.mts --extension voice-call --skip-combined --concurrency 1

  # Tests unitaires rapides, découpés en six morceaux : sur un seul runner à 4 cœurs, la suite
  # dépasse une heure (la CI d'origine la découpe en 6 à 12 morceaux sur 16 cœurs). Le lanceur
  # construit lui-même les prérequis des rares tests qui lisent le dist.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        morceau: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"
      - name: pnpm (version fixée par packageManager)
        run: corepack enable && pnpm --version
      - name: Installation
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Tests unitaires rapides (morceau ${{ matrix.morceau }}/6)
        # Mêmes réglages que la CI d'origine : la config unitaire partage ses workers
        # (isolate: false), elle tourne avec peu de workers et 8 Go de tas Node.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_MAX_WORKERS: "2"
        shell: bash
        run: |
          set -o pipefail
          pnpm test:fast --shard=${{ matrix.morceau }}/6 2>&1 | tee "$RUNNER_TEMP/vitest.log"
      - name: Tests en échec (résumé en fin de journal)
        if: failure()
        shell: bash
        # La liste compacte finit le journal : on la lit sans télécharger le journal complet.
        run: |
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" > "$RUNNER_TEMP/vitest.txt"
          echo "== fichiers en échec"
          grep -E "^ *FAIL " "$RUNNER_TEMP/vitest.txt" | sed -E 's/ > .*//; s/ +\[.*//' | sort -u | head -150 || true
          echo "== tests en échec"
          grep -E "^ *(FAIL|×) .* > " "$RUNNER_TEMP/vitest.txt" | sed -E 's/ [0-9]+ms$//' | sort -u | head -150 || true
          echo "== erreurs hors test"
          grep -E "^(Error|TypeError|ReferenceError|SyntaxError): " "$RUNNER_TEMP/vitest.txt" | sort | uniq -c | sort -rn | head -20 || true
          echo "== détail des échecs (message d'assertion et ligne du test)"
          sed -n '/Failed Tests [0-9]/,/Test Files/p' "$RUNNER_TEMP/vitest.txt" | grep -vE "^ *$" | head -250 || true
          grep -E "Test Files|Tests  " "$RUNNER_TEMP/vitest.txt" | tail -4 || true

  # Tests des zones du core modifiées par OPSYS. `test:fast` exclut src/gateway, src/agents et
  # packages/gateway-protocol (d'autres projets vitest) : sans ce job, les tests de T1.4-c1, c2
  # et c4 ne tourneraient jamais. `pnpm test <fichiers>` route chaque fichier vers son projet et
  # échoue si une cible ne correspond à rien. Liste : core/test/opsys-tests-cibles.txt.
  tests-opsys:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: uv (version verrouillée du projet Python)
        working-directory: ${{ github.workspace }}
        run: python -m pip install --quiet uv==0.12.19 && uv --version
      - name: Dépendances OPSYS Python verrouillées pour le test d'interopérabilité
        working-directory: ${{ github.workspace }}
        run: |
          uv sync --project . --locked --group build --extra dev --no-build-isolation --no-install-project
          uv sync --project . --locked --group build --extra dev --no-build-isolation
      - name: pnpm (version fixée par packageManager)
        run: corepack enable && pnpm --version
      - name: Installation
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Tests ciblés OPSYS (projets gateway, agents, gateway-protocol)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_MAX_WORKERS: "2"
          OPSYS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        shell: bash
        run: |
          set -o pipefail
          mapfile -t cibles < <(grep -vE '^[[:space:]]*(#|$)' test/opsys-tests-cibles.txt)
          echo "${#cibles[@]} fichiers ciblés"
          pnpm test "${cibles[@]}" 2>&1 | tee "$RUNNER_TEMP/vitest.log"
      - name: Tests en échec (résumé en fin de journal)
        if: failure()
        shell: bash
        run: |
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" > "$RUNNER_TEMP/vitest.txt"
          echo "== fichiers en échec"
          grep -E "^ *FAIL " "$RUNNER_TEMP/vitest.txt" | sed -E 's/ > .*//; s/ +\[.*//' | sort -u | head -150 || true
          echo "== détail des échecs (message d'assertion et ligne du test)"
          sed -n '/Failed Tests [0-9]/,/Test Files/p' "$RUNNER_TEMP/vitest.txt" | grep -vE "^ *$" | head -250 || true
          echo "== fin du journal"
          tail -60 "$RUNNER_TEMP/vitest.txt"
