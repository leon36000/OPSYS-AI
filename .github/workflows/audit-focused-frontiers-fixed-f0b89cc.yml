# Audits ciblés externes; aucune correction produit et aucun rejeu des suites inconnues.
name: audit-focused-frontiers-fixed-f0b89cc
'on':
  push:
    branches:
    - codex/restructuration-2026-09-30
    paths:
    - .github/workflows/audit-focused-frontiers-fixed-f0b89cc.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: audit-focused-frontiers-fixed-f0b89cc
  cancel-in-progress: false
env:
  EXPECTED_HEAD: f0b89ccf86d6f6e50eb134de3257af91860e8091
  EXPECTED_TREE: 03dd91d0a6c749d06dbd502b3b9fe2cb8f576bdb
  EXPECTED_SOURCE_SHA: ce8def70e470baced49f09a849fa75eee295e7e0f9613a49135dc5637f079349
  EXPECTED_PACKAGE_MANAGER: pnpm@12.4.0+sha512.37536c26ed40ab4134b6511e09f6b27f3ebb45687468f2406ca3805279a4e5ca158c1931350ad9774d6ab2108d71b3dbaeb39943159294375e4d053e8e05685c
  NODE_OPTIONS: --max-old-space-size=4096
  AUDIT_NONCE: major-frontiers-5ed284f7e6ae44dbb5369e6c0863fd41
defaults:
  run:
    shell: bash
jobs:
  mobile-destination:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Destinations externes uniques
      env:
        ROOT_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        output="$ROOT_TEMP/audit-frontier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mobile"
        mkdir -p "$output"
        echo "AUDIT_OUTPUT=$output" >> "$GITHUB_ENV"
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        ref: f0b89ccf86d6f6e50eb134de3257af91860e8091
        fetch-depth: 1
        persist-credentials: false
        submodules: false
    - name: Identité complète avant acquisition
      id: identity
      env:
        IDENTITY_PHASE: before
      timeout-minutes: 5
      run: |
        python3 -I -B - <<'PY_IDENTITY'
        import hashlib, json, os, pathlib, re, subprocess
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        def git(*args):
            return subprocess.check_output(['git', '-C', str(root), *args])
        head = git('rev-parse', 'HEAD').decode().strip()
        tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
        assert head == os.environ['EXPECTED_HEAD'], 'HEAD_DIFFERENT'
        assert tree == os.environ['EXPECTED_TREE'], 'TREE_DIFFERENT'
        paths = sorted(p.decode('utf-8') for p in git('ls-files', '-z').split(bytes([0])) if p)
        assert len(paths) == 43996 and len(set(paths)) == 43996, 'TRACKED_FILE_COUNT'
        aggregate = hashlib.sha256()
        for name in paths:
            file = root / name
            assert file.is_file() and not file.is_symlink(), 'TRACKED_FILE_KIND'
            content = hashlib.sha256()
            with file.open('rb') as stream:
                for block in iter(lambda: stream.read(1024 * 1024), b''):
                    content.update(block)
            aggregate.update(name.encode('utf-8'))
            aggregate.update(bytes([0]))
            aggregate.update(content.digest())
        assert aggregate.hexdigest() == os.environ['EXPECTED_SOURCE_SHA'], 'SOURCE_BYTES_DIFFERENT'
        package = json.loads((root / 'core/package.json').read_text())
        assert package['packageManager'] == os.environ['EXPECTED_PACKAGE_MANAGER'], 'PACKAGE_MANAGER_DIFFERENT'
        shards = (root / 'core/test/vitest/vitest.test-shards.mjs').read_text().split('export const fullSuiteVitestShards = [', 1)[1]
        groups = re.findall('config: "([^"]+)",.*?name: "([^"]+)"', shards, re.S)
        assert len(groups) == 12 and len({g[0] for g in groups}) == 12, 'CANONICAL_GROUP_COUNT'
        receipt = {'head':head, 'tree':tree, 'tracked_files':len(paths), 'SourceSHA':aggregate.hexdigest(),
                   'packageManager':package['packageManager'], 'canonical_groups':[{'config':c,'name':n} for c,n in groups],
                   'scope':'identity and bytes only; not test/runtime qualification'}
        output = pathlib.Path(os.environ['AUDIT_OUTPUT'])
        output.mkdir(parents=True, exist_ok=True)
        (output / ('identity-' + os.environ['IDENTITY_PHASE'] + '.json')).write_text(json.dumps(receipt, indent=2) + chr(10))
        print(json.dumps(receipt))
        PY_IDENTITY
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.x
    - name: Versions et acquisition npm verrouillée, comme mobile.yml
      timeout-minutes: 8
      working-directory: mobile
      run: |-
        set -euo pipefail
        { node --version; npm --version; } | tee "$AUDIT_OUTPUT/toolchain.log"
        npm ci 2>&1 | tee "$AUDIT_OUTPUT/install.log"
    - name: Déposer le seul oracle externe, sans modifier les fichiers suivis
      run: |
        set -euo pipefail
        test ! -e mobile/src/outbox/audit-destination-instance.cmd001.test.ts
        cat > mobile/src/outbox/audit-destination-instance.cmd001.test.ts <<'AUDIT_FILE_e68185e48ca0416a9cd64e6b5e63c3ce'
        // External audit candidate. All data, tokens, hosts and keys below are fictitious.
        // Projected location in an admitted disposable snapshot ONLY:
        // mobile/src/outbox/audit-destination-instance.cmd001.test.ts
        /// <reference types="node" />

        import { Buffer } from "node:buffer";
        import { appairerAppareil } from "../appairage/client";
        import { creerIdentiteDepuisGraine } from "../appairage/identite";
        import type { SocketAppairageLike, TrameRequete } from "../appairage/types";
        import { lireIdentiteServeur } from "../identite/client";
        import { synchroniserPersonneConfirmee } from "../identite/sessionEnvoi";
        import { creerMutationNote } from "../m2/interaction";
        import { invoquerOutil } from "../protocole/client";
        import {
          capturerSessionLecture,
          definirConfigurationAppel,
          definirPersonneConfirmee,
          obtenirSessionEnvoi,
        } from "../protocole/configuration";
        import type { ConfigurationAppel } from "../protocole/configuration";
        import type { RequeteOutilsInvoke } from "../protocole/types";
        import { creerDeclencheurVidange } from "./declenchement";
        import { DepotOutboxMemoire } from "./depot";
        import { DESCRIPTEURS_MUTATION } from "./descripteurs";
        import { avecProprietaire } from "./proprietaire";
        import { creerVidangeur } from "./vidangeur";

        const FICTIF = {
          fictif: true,
          personne: "jdupont",
          leadA: "LEAD-A-FICTIF-NE-JAMAIS-TRANSFERER",
          noteA: "[fictif:true] Note privee de Gateway A : rappel chantier A seulement.",
          mutationId: "8d9ac875-6087-4fd0-a1a9-4eb115c845c2",
          jetonA: "jeton-fictif-gateway-A-avant-rotation",
          jetonB: "jeton-fictif-gateway-B-apres-appairage",
          jetonARenouvele: "jeton-fictif-gateway-A-apres-rotation",
        } as const;
        const GATEWAY_A = {
          ws: "wss://grs.exemple.ca:8787",
          http: "https://grs.exemple.ca:8787",
        } as const;
        const GATEWAY_B = {
          ws: "wss://autre-grs.exemple.ca:8787",
          http: "https://autre-grs.exemple.ca:8787",
        } as const;
        const HORLOGE = {
          maintenant: new Date("2026-09-29T12:00:00.000Z"),
          decalageMinutesUTC: -240,
        };
        // Same deterministic seed and port as appairage/client.test.ts; real Ed25519 code runs.
        const IDENTITE = creerIdentiteDepuisGraine(Uint8Array.from({ length: 32 }, (_, i) => i + 1));
        const CLIENT_INFO = { id: "opsys-mobile", version: "0.1.0", platform: "ios", mode: "ui" };

        function reponseHttp(status: number, corps: unknown): Response {
          // Same minimal Response seam as outbox/suiviDuJeton.test.ts.
          return { ok: status >= 200 && status < 300, status, json: async () => corps } as unknown as Response;
        }

        interface AppelObserve {
          readonly url: string;
          readonly methode: string | undefined;
          readonly autorisation: string | undefined;
          readonly corps: RequeteOutilsInvoke;
        }

        /** Real pairing client and signer; only the WebSocket wire peer is scripted.
         * The microtask challenge/reply pattern is reused from appairage/client.test.ts.
         * No network socket is opened and no destination decision is replaced. */
        async function appairerEtConfirmer(
          gateway: { readonly ws: string; readonly http: string },
          jeton: string,
          avantConfirmation?: () => Promise<void>,
        ): Promise<ConfigurationAppel> {
          const trames: TrameRequete[] = [];
          const urlsSocket: string[] = [];
          let fermee = false;
          const creerSocket = (url: string): SocketAppairageLike => {
            urlsSocket.push(url);
            const socket: SocketAppairageLike = {
              onopen: null, onmessage: null, onerror: null, onclose: null,
              send(donnees: string) {
                const requete = JSON.parse(donnees) as TrameRequete;
                trames.push(requete);
                if (requete.type === "req" && requete.method === "connect") {
                  queueMicrotask(() => socket.onmessage?.({ data: JSON.stringify({
                    type: "res", id: requete.id, ok: true,
                    payload: { type: "hello-ok", auth: {
                      deviceToken: jeton, role: "operator", scopes: ["operator.read", "operator.write"],
                    } },
                  }) }));
                }
              },
              close() { fermee = true; },
            };
            queueMicrotask(() => socket.onmessage?.({ data: JSON.stringify({
              type: "event", event: "connect.challenge",
              payload: { nonce: "nonce-fictif-neuf-" + jeton, ts: 1_000 },
            }) }));
            return socket;
          };
          const code = "oc-pair://" + Buffer.from(JSON.stringify({
            url: gateway.ws, bootstrapToken: "amorce-fictive-" + jeton,
          })).toString("base64url");
          let tempsAppairage = 1_000_000;
          const resultat = await appairerAppareil({
            code, identite: IDENTITE, clientInfo: CLIENT_INFO, creerSocket,
            // Existing test seam: queued wire microtasks win against a next-macrotask expiry.
            attendre: () => new Promise<void>((resolve) => setTimeout(resolve, 0)),
            // Advancing injected clock also bounds a malformed scripted handshake's retries.
            maintenant: () => new Date(tempsAppairage++), budgetMs: 100,
            genererId: () => "requete-fictive-" + jeton,
          });
          expect(resultat).toMatchObject({ ok: true, urlBase: gateway.http, jeton, appareilId: IDENTITE.deviceId });
          if (!resultat.ok) throw new Error("SETUP_APPAIRAGE_FICTIF_REFUSE: " + resultat.motif);
          expect(urlsSocket).toEqual([gateway.ws]);
          expect(fermee).toBe(true);
          expect(trames).toHaveLength(1);
          expect(trames[0]).toMatchObject({ type: "req", method: "connect", params: {
            auth: { bootstrapToken: "amorce-fictive-" + jeton },
            device: { id: IDENTITE.deviceId, nonce: "nonce-fictif-neuf-" + jeton, signature: expect.any(String) },
          } });

          const configuration: ConfigurationAppel = {
            urlBase: resultat.urlBase, jeton: resultat.jeton, appareilId: resultat.appareilId,
          };
          // Same production transitions as app/pairing/index.tsx and identity/sessionEnvoi.ts.
          definirConfigurationAppel(configuration);
          synchroniserPersonneConfirmee({ genre: "en_lecture" }, configuration);
          expect(obtenirSessionEnvoi()).toBeNull();
          if (avantConfirmation) await avantConfirmation();

          const appelsIdentite: { url: string; autorisation: string | undefined }[] = [];
          const fetchIdentite: typeof fetch = async (input, init) => {
            const headers = init?.headers as Record<string, string> | undefined;
            appelsIdentite.push({ url: String(input), autorisation: headers?.authorization });
            return reponseHttp(200, { ok: true, identite: {
              appareilId: IDENTITE.deviceId, personne: FICTIF.personne, role: "seller",
            } });
          };
          // Actual HTTP identity reader and response validation, not an invented confirmed session.
          const lecture = await lireIdentiteServeur({ ...configuration, fetchImpl: fetchIdentite });
          expect(appelsIdentite).toEqual([{ url: gateway.http + "/opsys/identite", autorisation: "Bearer " + jeton }]);
          expect(lecture.genre).toBe("confirmee");
          if (lecture.genre !== "confirmee") throw new Error("SETUP_IDENTITE_FICTIVE_NON_CONFIRMEE");
          synchroniserPersonneConfirmee(lecture, configuration);
          expect(obtenirSessionEnvoi()).toEqual({ ...configuration, personne: FICTIF.personne });
          return configuration;
        }

        function creerBanc() {
          const base = new DepotOutboxMemoire();
          const depot = avecProprietaire(base, () => obtenirSessionEnvoi()?.personne ?? null);
          const appelsRpc: AppelObserve[] = [];
          let horsLigne = true;
          let maintenant = HORLOGE.maintenant;
          const fetchRpc: typeof fetch = async (input, init) => {
            if (typeof init?.body !== "string") throw new Error("SETUP_CORPS_RPC_NON_JSON");
            const headers = init.headers as Record<string, string> | undefined;
            appelsRpc.push({
              url: String(input), methode: init.method, autorisation: headers?.authorization,
              corps: JSON.parse(init.body) as RequeteOutilsInvoke,
            });
            if (horsLigne) throw new TypeError("Network request failed (fictif)");
            // Independent valid business ACK fixture. The oracle concerns the outbound request,
            // not whether a real second server would accept the data.
            return reponseHttp(200, { ok: true, result: {
              ok: true, resultat: { accepte: true, resultat: {
                lead_id: FICTIF.leadA, ligne_id: "INTERACTION-FICTIVE", horodatage: "2026-09-29T12:01:00Z",
              } }, rejoue: false,
            } });
          };
          const vidangeur = creerVidangeur({
            depot, descripteurs: DESCRIPTEURS_MUTATION,
            appelerOutil: invoquerOutil, fetchImpl: fetchRpc, session: obtenirSessionEnvoi,
            capturerGardeSession: () => capturerSessionLecture().courante,
            maintenant: () => maintenant,
          });
          const declencher = creerDeclencheurVidange({
            sessionDisponible: () => obtenirSessionEnvoi() !== null,
            obtenirVidangeur: async () => vidangeur,
          });
          return {
            base, depot, appelsRpc, declencher,
            revenirEnLigne() {
              horsLigne = false;
              maintenant = new Date(HORLOGE.maintenant.getTime() + 60_000);
            },
          };
        }

        async function creerNoteAEtRendreLaReprisePossible(
          destination: { readonly ws: string; readonly http: string },
          nouveauJeton: string,
        ) {
          // One drainer survives BOTH pairings, like the production singleton in service.ts.
          const banc = creerBanc();
          await appairerEtConfirmer(GATEWAY_A, FICTIF.jetonA);
          const intention = await banc.depot.inserer(creerMutationNote(
            FICTIF.leadA, FICTIF.noteA, () => FICTIF.mutationId, HORLOGE,
          ));
          expect(intention.proprietaire).toBe(FICTIF.personne);
          const offline = await banc.declencher();
          expect(offline?.remisesEnAttente).toEqual([FICTIF.mutationId]);
          expect(banc.appelsRpc).toHaveLength(1);
          expect(banc.appelsRpc[0]).toMatchObject({
            url: GATEWAY_A.http + "/tools/invoke", autorisation: "Bearer " + FICTIF.jetonA,
            corps: { tool: "m2_enregistrer_interaction", idempotencyKey: FICTIF.mutationId,
              args: { lead_id: FICTIF.leadA, resume: FICTIF.noteA } },
          });
          const avant = await banc.base.obtenir(FICTIF.mutationId);
          expect(avant?.statut).toBe("en_attente");
          expect(avant?.payload).toMatchObject({ lead_id: FICTIF.leadA, resume: FICTIF.noteA });
          banc.revenirEnLigne();
          await appairerEtConfirmer(destination, nouveauJeton, async () => {
            // A mere replacement of config is insufficient: the new token is not yet confirmed.
            await expect(banc.declencher()).resolves.toBeNull();
            expect(banc.appelsRpc).toHaveLength(1);
          });
          const debutReprise = banc.appelsRpc.length;
          const rapport = await banc.declencher();
          return { ...banc, avant, rapport, appelsReprise: banc.appelsRpc.slice(debutReprise) };
        }

        beforeEach(() => {
          definirConfigurationAppel(null);
          definirPersonneConfirmee(null);
        });
        afterEach(() => {
          definirConfigurationAppel(null);
          definirPersonneConfirmee(null);
        });

        describe("CMD-001 — destination durable d’une intention mobile (fictif)", () => {
          test("une note de A ne quitte pas l’app vers B après appairage complet de la même personne", async () => {
            const resultat = await creerNoteAEtRendreLaReprisePossible(GATEWAY_B, FICTIF.jetonB);
            // Independent requirement: re-pairing does not transfer authority to send A's data to B.
            // A RED diff here exposes the actual URL + authorization + original business data.
            const fuiteVersB = resultat.appelsReprise.filter((appel) =>
              appel.url === GATEWAY_B.http + "/tools/invoke" &&
              (appel.corps.idempotencyKey === FICTIF.mutationId ||
               appel.corps.args?.resume === FICTIF.noteA || appel.corps.args?.lead_id === FICTIF.leadA),
            );
            expect(fuiteVersB).toEqual([]); // Expected RED on the audited HEAD; never invert this oracle.
            expect(resultat.rapport?.envoyees).not.toContain(FICTIF.mutationId);
            const conservee = await resultat.base.obtenir(FICTIF.mutationId);
            expect(conservee?.payload).toEqual(resultat.avant?.payload);
            expect(conservee?.proprietaire).toBe(FICTIF.personne);
            expect(conservee?.statut).not.toBe("envoyee");
          }, 10_000);

          test("la rotation du jeton sur A reprend la même note une seule fois sur A", async () => {
            const resultat = await creerNoteAEtRendreLaReprisePossible(GATEWAY_A, FICTIF.jetonARenouvele);
            expect(resultat.appelsReprise).toHaveLength(1);
            expect(resultat.appelsReprise[0]).toMatchObject({
              url: GATEWAY_A.http + "/tools/invoke", methode: "POST",
              autorisation: "Bearer " + FICTIF.jetonARenouvele,
              corps: { tool: "m2_enregistrer_interaction", idempotencyKey: FICTIF.mutationId,
                deviceId: IDENTITE.deviceId, args: { lead_id: FICTIF.leadA, resume: FICTIF.noteA } },
            });
            expect(resultat.rapport?.envoyees).toEqual([FICTIF.mutationId]);
            expect(resultat.rapport?.echecsPermanents).toEqual([]);
            expect((await resultat.base.obtenir(FICTIF.mutationId))?.statut).toBe("envoyee");
          }, 10_000);
        });
        AUDIT_FILE_e68185e48ca0416a9cd64e6b5e63c3ce
        printf '%s  %s\n' '17444b4545ccd2d3f6f6956740af0273724076fec5614563a1d3871af5414bce' mobile/src/outbox/audit-destination-instance.cmd001.test.ts | sha256sum -c -
        cp mobile/src/outbox/audit-destination-instance.cmd001.test.ts "$AUDIT_OUTPUT/oracle.ts"
    - name: Deux cas comportementaux ciblés, rouge conservé
      timeout-minutes: 3
      working-directory: mobile
      run: |-
        set -euo pipefail
        npm test -- --ci --runInBand --runTestsByPath src/outbox/audit-destination-instance.cmd001.test.ts --json --outputFile="$AUDIT_OUTPUT/cmd001-jest.json" 2>&1 | tee "$AUDIT_OUTPUT/jest.log"
