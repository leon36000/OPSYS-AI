        """External PG17 oracle: real decisions, real SQL, scheduling only at the SQL boundary.

        All business fixtures are fictitious. Not executed during authoring. No production fix.
        Run only with the explicit PG17 opt-in and an exact, separately attested f0 snapshot.
        """
        from __future__ import annotations

        import hashlib
        import json
        import os
        import sys
        import threading
        from pathlib import Path
        from typing import Any

        import pytest

        HERE = Path(__file__).resolve().parent
        SOURCE_VALUE = os.environ.get("OPSYS_APPROVAL_ORACLE_SOURCE")
        if not SOURCE_VALUE:
            raise pytest.UsageError("OPSYS_APPROVAL_ORACLE_SOURCE must name the exact f0 snapshot")
        SOURCE = Path(SOURCE_VALUE).resolve(strict=True)
        CONTRACT = json.loads((HERE / "SOURCE-CONTRACT.json").read_text(encoding="utf-8"))
        for _relative, _expected in CONTRACT["source_sha256"].items():
            _path = SOURCE / _relative
            if not _path.is_file() or hashlib.sha256(_path.read_bytes()).hexdigest() != _expected:
                raise pytest.UsageError(f"Source fingerprint mismatch: {_relative}")

        # External tests do not inherit tests/conftest.py. Reuse its real fixture package explicitly.
        sys.path.insert(0, str(SOURCE / "tests" / "fixtures"))
        sys.path.insert(0, str(SOURCE / "src"))

        import memoire.doubles as pg_helpers  # noqa: E402
        import opsys  # noqa: E402
        from sqlalchemy import event, select, text  # noqa: E402

        from opsys import approbations, identite, stockage  # noqa: E402
        from opsys.outils import Autonomie, Niveau, Outil  # noqa: E402
        from opsys.stockage.schema import APPROBATIONS, JOURNAL  # noqa: E402

        if not Path(opsys.__file__).resolve().is_relative_to(SOURCE / "src"):
            raise pytest.UsageError("opsys was imported from a different source tree")
        if not Path(pg_helpers.__file__).resolve().is_relative_to(SOURCE / "tests" / "fixtures"):
            raise pytest.UsageError("memoire.doubles was imported from a different fixture tree")

        pytestmark = pytest.mark.skipif(
            os.environ.get("OPSYS_QUALIFIER_M9_PG17") != "1",
            reason="PG17 real-container execution requires the existing explicit CI opt-in",
        )
        FICTIF = True
        WAIT_SECONDS = 15
        JOIN_SECONDS = 20


        @pytest.fixture
        def pg_case(tmp_path, monkeypatch):
            """Existing real PG17 helper, isolated home and URL, same migrations as current tests."""
            monkeypatch.setenv("OPSYS_HOME", str(tmp_path / "opsys-home-fictif"))
            monkeypatch.delenv(stockage.ENV_URL, raising=False)
            with pg_helpers.postgres_ephemere(stockage_en_memoire=True) as url_pg:
                monkeypatch.setenv(
                    stockage.ENV_URL, url_pg.replace("postgresql://", "postgresql+psycopg://", 1)
                )
                try:
                    stockage.migrer()
                    engine = stockage.moteur()
                    with stockage.transaction() as cnx:
                        server_version = int(cnx.execute(text("SHOW server_version_num")).scalar_one())
                        vector_version = cnx.execute(text(
                            "SELECT default_version FROM pg_available_extensions WHERE name = 'vector'"
                        )).scalar_one()
                        assert 170000 <= server_version < 180000, "real PostgreSQL 17 is required"
                        assert vector_version == "0.8.7", "run the existing preparer_pgvector.py first"
                        for person in ("winner-fictif", "loser-fictif"):
                            identite.creer_personne(
                                cnx, person, person, "mot-de-passe-fictif-pg-oracle-1234", ["nathan_owner"]
                            )
                    yield {"engine": engine, "server_version_num": server_version,
                           "pgvector_default_version": vector_version}
                finally:
                    stockage.liberer()


        def _statement(context):
            compiled = getattr(context, "compiled", None)
            return getattr(compiled, "statement", None)


        def _is_approval_update(statement) -> bool:
            return bool(
                statement is not None
                and getattr(statement, "is_update", False)
                and getattr(getattr(statement, "table", None), "name", None) == APPROBATIONS.name
            )


        def _is_approval_select(statement) -> bool:
            return bool(
                statement is not None
                and getattr(statement, "is_select", False)
                and any(getattr(table, "name", None) == APPROBATIONS.name
                        for table in statement.get_final_froms())
            )


        def _metadata(cnx) -> dict[str, Any]:
            # No URL, Docker password, environment dump, or credentials in observations.
            cnx.execute(text("SET LOCAL statement_timeout = '5s'"))
            cnx.execute(text("SET LOCAL lock_timeout = '5s'"))
            isolation = cnx.get_isolation_level()
            assert isolation == "READ COMMITTED", "different isolation is not this oracle"
            assert getattr(cnx.connection.dbapi_connection, "autocommit", None) is False
            return {"backend_pid": cnx.execute(text("SELECT pg_backend_pid()")).scalar_one(),
                    "isolation": isolation, "autocommit": False}


        def _exercise(pg_case, loser_approves: bool, observation: dict[str, Any]) -> None:
            engine = pg_case["engine"]
            observation.update({
                "schema": 1, "fictif": True, "source_head_contract": CONTRACT["head"],
                "server_version_num": pg_case["server_version_num"],
                "pgvector_default_version": pg_case["pgvector_default_version"],
                "loser_approves": loser_approves, "trace": [],
                "loser": {"update_rowcounts": [], "response": None, "error": None},
                "winner": {"update_rowcounts": []},
            })
            ready = threading.Event()
            release = threading.Event()
            trace_lock = threading.Lock()

            def trace(stage):
                with trace_lock:
                    observation["trace"].append({"sequence": len(observation["trace"]), "stage": stage})

            def deterministic_tool(valeur: int):
                stockage.maillons("m09-oracle-fictif", "sentinelles-fictives").append(
                    {"fictif": True, "valeur": valeur}
                )
                return {"fictif": True, "valeur": valeur}

            tool = Outil(
                "m9_sentinelle_pg_fictive", "Outil déterministe fictif pour oracle PG17.",
                {"type": "object", "properties": {"valeur": {"type": "integer"}},
                 "required": ["valeur"], "additionalProperties": False},
                deterministic_tool, Autonomie.T2,
            )
            tools = {tool.nom: tool}
            # Same unmodified default N4/nathan_owner policy as test_approbations_journal.py.
            departments = {}
            with stockage.transaction() as cnx:
                request_id = approbations.creer_demande(
                    cnx, "m09-oracle-fictif", tool.nom, {"valeur": 7}, niveau=Niveau.N4
                )
                initial = cnx.execute(select(APPROBATIONS).where(
                    APPROBATIONS.c.id == request_id
                )).mappings().one()
                assert initial["statut"] == "en_attente" and initial["ticket_cible_hash"] is None
            observation["request_id"] = request_id
            observation["initial_ticket_cible_hash"] = None

            def decide_loser():
                try:
                    with stockage.transaction() as cnx:
                        observation["loser"]["connection"] = _metadata(cnx)
                        result = approbations.decider(
                            cnx, request_id, loser_approves, "loser-fictif", tools, departments,
                            "décision perdante fictive",
                        )
                        observation["loser"]["response_before_exit"] = result
                    observation["loser"].update(response=result, committed=True)
                    trace("loser_transaction_committed")
                except Exception as exc:
                    # ValueError messages are product decision text and fictitious IDs only.
                    observation["loser"]["error"] = {
                        "type": type(exc).__name__,
                        "message": str(exc) if isinstance(exc, ValueError) else "details not captured",
                    }
                    observation["loser"]["committed"] = False
                    trace("loser_transaction_exception")

            loser = threading.Thread(target=decide_loser, name="approval-pg-loser-fictif", daemon=True)
            main_thread = threading.current_thread()

            def before_cursor_execute(cnx, cursor, sql, parameters, context, executemany):
                del cnx, cursor, sql, parameters, executemany
                statement = _statement(context)
                if threading.current_thread() is loser and _is_approval_update(statement):
                    assert observation["loser"].get("request_select_observed") is True
                    assert not ready.is_set(), "unexpected second loser UPDATE before boundary completion"
                    values = context.compiled_parameters[0]
                    expected = "en_cours" if loser_approves else "refusee"
                    assert values.get("statut") == expected, "wrong real UPDATE intercepted"
                    observation["loser"]["requested_status"] = values["statut"]
                    trace("loser_real_update_paused_after_real_select")
                    ready.set()
                    if not release.wait(WAIT_SECONDS):
                        raise AssertionError("winner commit did not release the real loser UPDATE")
                    assert observation["winner"].get("committed") is True
                    trace("loser_real_update_released_after_winner_commit")

            def after_cursor_execute(cnx, cursor, sql, parameters, context, executemany):
                del cnx, sql, parameters, executemany
                statement = _statement(context)
                current = threading.current_thread()
                if current is loser and _is_approval_select(statement):
                    observation["loser"]["request_select_observed"] = True
                    observation["loser"]["request_select_rowcount"] = cursor.rowcount
                    trace("loser_real_request_select_executed")
                if _is_approval_update(statement):
                    if current is loser:
                        observation["loser"]["update_rowcounts"].append(cursor.rowcount)
                        trace("loser_real_update_completed")
                    elif current is main_thread:
                        observation["winner"]["update_rowcounts"].append(cursor.rowcount)

            event.listen(engine, "before_cursor_execute", before_cursor_execute)
            event.listen(engine, "after_cursor_execute", after_cursor_execute)
            try:
                loser.start()
                assert ready.wait(WAIT_SECONDS), "loser never reached the post-SELECT/pre-UPDATE boundary"
                with stockage.transaction() as cnx:
                    observation["winner"]["connection"] = _metadata(cnx)
                    observation["winner"]["response_before_exit"] = approbations.decider(
                        cnx, request_id, True, "winner-fictif", tools, departments,
                        "approbation gagnante fictive",
                    )
                # This line is after Engine.begin().__exit__: not merely after Python return from decider.
                observation["winner"]["committed"] = True
                trace("winner_transaction_committed")
                release.set()
                loser.join(JOIN_SECONDS)
                assert not loser.is_alive(), "loser transaction has not closed"
                with stockage.transaction() as cnx:
                    observation["final_request"] = dict(cnx.execute(select(APPROBATIONS).where(
                        APPROBATIONS.c.id == request_id
                    )).mappings().one())
                    observation["journal"] = [dict(row) for row in cnx.execute(select(
                        JOURNAL.c.par, JOURNAL.c.action, JOURNAL.c.cible, JOURNAL.c.details
                    ).where(JOURNAL.c.cible == request_id).order_by(JOURNAL.c.id)).mappings()]
                    observation["sentinels"] = list(
                        stockage.maillons("m09-oracle-fictif", "sentinelles-fictives")
                    )
            finally:
                release.set()
                if loser.ident is not None:
                    loser.join(JOIN_SECONDS)
                observation["loser_thread_closed"] = not loser.is_alive()
                event.remove(engine, "before_cursor_execute", before_cursor_execute)
                event.remove(engine, "after_cursor_execute", after_cursor_execute)
            assert observation["loser_thread_closed"], "thread still active; execution is unqualified"


        def _persist(request, tmp_path, observation, record_property):
            value = os.environ.get("OPSYS_APPROVAL_ORACLE_EVIDENCE_DIR")
            destination = Path(value).resolve() if value else tmp_path / "external-oracle-evidence"
            if destination.is_relative_to(SOURCE):
                raise AssertionError("evidence directory must be outside Source")
            destination.mkdir(parents=True, exist_ok=True)
            case = "two-approvals-control" if observation.get("loser_approves") else "approval-vs-refusal"
            payload = json.dumps(observation, ensure_ascii=False, indent=2, sort_keys=True)
            # A fresh execution directory is mandatory: never erase an earlier, possibly red receipt.
            with (destination / f"{case}.json").open("x", encoding="utf-8") as stream:
                stream.write(payload + "\n")
            record_property("oracle_case", request.node.name)
            record_property("oracle_observation", payload)


        @pytest.mark.parametrize("loser_approves", [False, True],
                                 ids=["refusal-loses-to-approval", "two-approvals-positive-control"])
        def test_losing_decision_conflicts_without_false_refusal_audit(
            pg_case, loser_approves, request, tmp_path, record_property
        ):
            observation: dict[str, Any] = {}
            try:
                _exercise(pg_case, loser_approves, observation)
                assert observation["loser"]["request_select_rowcount"] == 1
                assert observation["loser"]["update_rowcounts"] == [0], "not the discriminating SQL interleaving"
                assert observation["winner"]["update_rowcounts"] == [1, 1]
                assert observation["loser"]["connection"]["backend_pid"] != observation["winner"]["connection"]["backend_pid"]
                assert observation["winner"]["response_before_exit"]["statut"] == "executee"
                assert observation["final_request"]["statut"] == "executee"
                assert observation["final_request"]["decide_par"] == "winner-fictif"
                assert observation["sentinels"] == [{"fictif": True, "valeur": 7}]
                approval_audit = [row for row in observation["journal"] if row["action"] == "approbation.approuver"]
                refusal_audit = [row for row in observation["journal"] if row["action"] == "approbation.refuser"]
                assert len(approval_audit) == 1 and approval_audit[0]["par"] == "winner-fictif"
                error = observation["loser"]["error"]
                violations = []
                if error is None or error["type"] != "ValueError":
                    violations.append("losing decision did not report the established ValueError conflict")
                if observation["loser"]["response"] is not None:
                    violations.append("losing decision returned a successful response")
                if observation["loser"].get("committed") is not False:
                    violations.append("losing decision committed instead of conflicting")
                if refusal_audit:
                    violations.append("a refusal audit survived although its UPDATE changed zero rows")
                assert not violations, json.dumps({"violations": violations, "observation": observation},
                                                 ensure_ascii=False, sort_keys=True)
            finally:
                _persist(request, tmp_path, observation, record_property)
