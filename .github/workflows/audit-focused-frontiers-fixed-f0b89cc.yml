        assert len(groups) == 12 and len({g[0] for g in groups}) == 12, 'CANONICAL_GROUP_COUNT'
        receipt = {'head':head, 'tree':tree, 'tracked_files':len(paths), 'SourceSHA':aggregate.hexdigest(),
                   'packageManager':package['packageManager'], 'canonical_groups':[{'config':c,'name':n} for c,n in groups],
                   'scope':'identity and bytes only; not test/runtime qualification'}
        output = pathlib.Path(os.environ['AUDIT_OUTPUT'])
        output.mkdir(parents=True, exist_ok=True)
        (output / ('identity-' + os.environ['IDENTITY_PHASE'] + '.json')).write_text(json.dumps(receipt, indent=2) + chr(10))
        print(json.dumps(receipt))
