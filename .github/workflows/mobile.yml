name: mobile
on:
  workflow_call:

permissions:
  contents: read

# Les appels automatiques sont sérialisés par ci.yml.

defaults:
  run:
    working-directory: mobile

jobs:
  # Squelette Expo Router de l'app mobile OPSYS (PLAN T1.4-a, docs/research/R12-app-mobile.md
  # §3). Le bac à sable de développement n'exécute pas le core (core.yml s'en charge) ; ce job
  # est la preuve de construction/tests côté mobile.
  mobile-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Audit npm des dépendances verrouillées
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Installation
        run: npm ci
      - name: Régressions des dépendances adaptées (résolution et sécurité)
        run: npm run test:dependencies
      - name: Vérification des types (TypeScript strict)
        run: npm run typecheck
      - name: Tests unitaires (Jest, preset jest-expo)
        run: npm test -- --ci
      - name: Compilation Metro Android (JavaScript, sans publication)
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOTENV: "1"
          EXPO_NO_CLIENT_ENV_VARS: "1"
          EXPO_OFFLINE: "1"
        run: npx --no-install expo export --platform android --no-bytecode --max-workers 2 --output-dir "$RUNNER_TEMP/opsys-mobile-android"
