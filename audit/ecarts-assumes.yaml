# ÉCARTS ASSUMÉS — dérogations déjà documentées par le dépôt.
#
# Un écart inscrit ici n'est PAS un constat : il a été décidé, documenté, et sa raison est
# vérifiable. Le rôle de ce fichier est d'empêcher l'audit de recompter une décision prise —
# ce qui le ferait tomber au premier contre-exemple.
#
# Le champ `limite` fait le travail décisif : il dit ce que la dérogation NE couvre PAS.
# Sans lui, une décision légitime sur un sujet absoudrait un défaut voisin par contagion.
#
# Quatre contrôles avant qu'une entrée soit recevable :
#   - `doc` existe dans le dépôt ;
#   - `ancre` est présente dans ce document ;
#   - `portee_fichiers` est une liste CLOSE, énumérée, jamais un motif ouvert ;
#   - `limite` est renseignée et nomme ce qui reste hors dérogation.

- id: DUP-SOCLE
  constat: >
    Les utilitaires de socle sont recopiés dans chaque module plutôt que partagés :
    encodage, horodatage, verdicts, registre, adaptateurs, fixtures_garde.
    Mesuré : 7 copies d'encodage.py, 9 de registre.py, aucune identique à l'octet près.
  doc: .sonarcloud.properties
  ancre: "DÉCISION D'ARCHITECTURE RATIFIÉE"
  raison: >
    Chaque module porte une identité de paquet isolée et n'importe jamais depuis un module
    voisin. Un import croisé recréerait la collision d'identités éliminée par le chore #109 —
    21 tests exerçaient alors le mauvais arbre, mesuré. Chaque copie est revue et mutée dans
    son propre module.
  portee_fichiers:
    - Modules M/**/encodage.py
    - Modules M/**/horodatage.py
    - Modules M/**/verdicts.py
    - Modules M/**/registre.py
    - Modules M/**/adaptateurs.py
    - Modules M/**/fixtures_garde.py
  limite: >
    La dérogation couvre la DUPLICATION de ces six fichiers, et rien d'autre. Elle ne couvre
    PAS :
    (a) la DIVERGENCE SÉMANTIQUE entre copies — deux copies qui rendent des choses de nature
        différente sont un défaut, et le constat AUD-A4-001 en établit un : M2 renvoie un
        digest là où six autres renvoient une chaîne ;
    (b) les fichiers hors de la liste ci-dessus. Cinq fichiers sont dupliqués à trois copies
        ou plus sans y figurer : contrats.py (9), validation.py (7), digest.py (6),
        conformite.py (6), frontieres.py (3). Leur duplication n'est couverte par aucune
        décision documentée à ce jour.
    Un constat qui porterait sur (a) ou (b) ne peut pas se réclamer de cette dérogation.
