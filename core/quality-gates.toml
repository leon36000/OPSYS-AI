# Matrice qualité statique et typage — Core OPSYS-AI (C02-004).
#
# mypy sur l'arbre complet (Modules M/ inclus) ne peut même pas ACHEVER un
# passage : collisions de noms de modules dupliqués entre M-modules
# (ex. verif_coherence.py présent dans plusieurs Modules M/*/docs/bmad/),
# un défaut STRUCTUREL hors périmètre de cette tâche (aucune modification
# M1-M10 autorisée). Ce gate reste donc scopé à core/ ; étendre la
# couverture à Modules M/ exigerait une restructuration en paquets Python
# propres (__init__.py / --explicit-package-bases cohérent), à traiter
# dans une tâche dédiée et tracée, jamais en silence ici.
#
# La dette mypy de ce périmètre est désormais nulle : les deux causes
# réellement mesurées ont été corrigées, sans suppression. totp importe
# explicitement binascii et AdminGate refuse fail-closed un succès TOTP sans
# timestep consommable.

[[gates]]
name = "mypy-core"
argv = ["mypy", "--ignore-missing-imports", "core/"]
required = true
scope = ["core/"]
