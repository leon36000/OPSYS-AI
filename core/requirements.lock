# requirements.lock — dépendances RUNTIME du Core OPSYS-AI, verrouillées.
#
# Généré manuellement pour C02-002 (pas de pip-compile disponible hors
# ligne) ; chaque entrée est une version EXACTE (==) avec son hash sha256
# réel (téléchargé via `pip download <pkg>==<version> --no-deps
# --only-binary=:all:` puis `sha256sum` sur le wheel obtenu, reproductible
# par quiconque rejoue la même commande — jamais un hash inventé).
# Régénérer à chaque ajout de dépendance runtime — vérifié par
# core/scripts/verify_dependencies.py.
#
# Installation CI (core-ci.yml, job `tests`) : `pip install --require-hashes
# -r core/requirements.lock` (fix C05-001 tour 2, Kimi-K3 — cf. note RÉSOLU
# plus bas). Ce mode EXIGE un hash pour TOUTE dépendance installée dans la
# même commande, y compris transitive (cf. typing-extensions plus bas) —
# aucun paquet hors lock (ex. pytest, dépendance dev) ne doit jamais
# partager cette commande : pip refuse tout le step sinon (« Hashes are
# required in --require-hashes mode... », mesuré directement). pytest est
# donc installé par un step CI séparé, sans --require-hashes.
#
# core/scripts/bootstrap_toolchain.py et core/scripts/verify_dependencies.py
# (C02-001/C02-002) sont stdlib-only. PyYAML est requise par
# core/src/config/settings.py (story P0-5d antérieure, code M1-M10 non
# modifié par C02-002 — seule sa dépendance réelle est déclarée ici).
