#
# RÉSOLU par ce commit (suivi de la revue scellée C05-001 tour 2,
# Kimi-K3) — historique conservé plutôt qu'effacé en silence
# (« objection mineure ignorée revient en critique ») :
#
# LIMITATION CONNUE [HISTORIQUE, close depuis ce commit] (revue scellée
# C05-001 tour 1, objection mineure Kimi-K3 confirmée vraie) : ces hash
# étaient vérifiés STRUCTURELLEMENT par verify_dependencies.verify_lock()
# (présence + format sha256 valide) mais PAS appliqués
# CRYPTOGRAPHIQUEMENT à l'installation — core-ci.yml installait via `pip
# install psycopg==3.2.3 ...` (versions en dur sur la ligne de commande,
# requirements.lock jamais lu par pip) SANS `--require-hashes`, donc un
# hash erroné ici serait resté indétecté. Mesuré directement avant ce
# commit : un hash PyYAML volontairement corrompu passe `pip install
# PyYAML==6.0.1` sans la moindre erreur (la commande CI d'alors ne
# consultait même pas ce fichier). Gap HÉRITÉ du patron pré-existant
# (PyYAML ci-dessus avait exactement la même limitation depuis C02-002).
#
# Fix : core-ci.yml utilise maintenant `pip install --require-hashes -r
# core/requirements.lock`. Le même hash PyYAML corrompu fait désormais
# échouer l'installation — mesuré directement : « THESE PACKAGES DO NOT
# MATCH THE HASHES FROM THE REQUIREMENTS FILE ... someone may have
# tampered with them », rc=1. --require-hashes exige aussi un hash pour
# TOUTE dépendance transitive résolue dans la même commande (cf.
# typing-extensions ci-dessous, requise par psycopg) — jamais un paquet
# hors lock (ex. pytest) dans cette même commande, pip échouerait
# (mesuré ; cf. step CI séparé pour pytest).
