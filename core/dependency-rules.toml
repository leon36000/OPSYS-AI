# Règles de dépendances architecturales — Core OPSYS-AI (C04-001).
#
# ÉCART SOURCÉ AU SPEC DE TÂCHE, DOCUMENTÉ EN CLAIR (même patron que
# core/quality-gates.toml, C02-004) : tasks/C04-001.md (« Implémentation
# strictement bornée ») cite « encoder règles import-linter ». Recherche
# exhaustive (subagent architecte, revue AVANT code) : le paquet PyPI réel
# import-linter a ZÉRO occurrence dans les 4 sources citées par la tâche
# (69-CORE-ARCHITECTURE-DESIGN-v1.0.0.md, 33-RF01-W7-FRAMEWORK-BRICK-
# FABRIC-RESEARCH-MAP-v5.0.md, 59-RF01-W11-INTERMODULE-CONTRACTS-RESEARCH-
# MAP-v5.5.0.md, ANALYSE-FORENSIQUE-CORRIGEE-SQUELETTE-FIRST-v2.md) et
# ZÉRO mécanisme décrit — la mention est un raccourci de langage du spec,
# pas une dépendance imposée. L'ajouter violerait
# RF01-W7-ANTI-FRANKENSTACK-RULES.csv AF-22 (« engineering tools are not
# product runtime ») et tirerait des transitives (grimp, networkx) sans
# justification sourcée, alors que core/pyproject.toml n'a qu'UNE
# dépendance runtime (PyYAML), discipline « stdlib d'abord ». Ce fichier
# est donc consommé par un scanner AST en stdlib pur
# (core/tests/architecture/test_dependency_rules.py — ast + tomllib),
# jamais par le paquet import-linter.
#
# Enforcement RÉEL et vérifié mécaniquement aujourd'hui (C04-001) :
#   - ports -> adapters : INTERDIT (cas RED #2 de tasks/C04-001.md)
#   - kernel/domain -> SDK tiers (hors stdlib) : INTERDIT (cas RED #3)
#   - opsys_core -> Modules M : INTERDIT (cas RED #1, hérité de C03-001)
# Le reste de la matrice [[rules.allowed]] ci-dessous est DÉCLARATIF —
# document de référence pour la composition future (C04-004 et
# suivantes), pas encore mécaniquement gardé par un test. Ne jamais lire
# une entrée non listée dans les 3 cas RED ci-dessus comme « vérifiée ».

[meta]
enforcement = "ast_scan_stdlib_only"
enforcement_tool = "core/tests/architecture/test_dependency_rules.py"
scope = "core/src/"
note_import_linter = "voir en-tête de fichier — écart assumé, réimplémenté en stdlib (ast + tomllib), paquet PyPI import-linter jamais installé"

[layers.kernel]
paths = [
    "opsys_core/kernel.py",
    "opsys_core/planes.py",
    "opsys_core/errors.py",
    "opsys_core/result.py",
]
note = "coeur constitutionnel (C03-001, C03-004) — ne dépend d'aucune autre couche"

[layers.domain]
paths = [
    "opsys_core/authority/",
    "opsys_core/status/",
]
note = "règles métier du Core (C03-002, C03-003) — peut dépendre de kernel"

[layers.ports]
paths = [
    "opsys_core/ports/",
]
note = "contrats provider-neutral (C04-001) — ne dépend d'aucune autre couche (surtout pas adapters, cas RED #2)"

[layers.application]
paths = []
note = "VIDE au 2026-08-11 (C04-001) — peuplée par C04-004 (composition.py, provider_registry.py) ; déclarée vide explicitement avec cette raison pour ne jamais devenir une bijection silencieuse sur deux ensembles vides (cf. audit SKELETON-54-ISSUES-RECLASSEES-SKELETON-FIRST.csv, CAND-CA05-0004)"

[layers.adapters]
paths = [
    "auth/",
    "authz/",
    "config/",
]
note = "implémentations concrètes des ports pour un fournisseur donné"
exception = "legacy_pre_core"
exception_reason = "auth/, authz/, config/ pré-existent AVANT la phase C03 (hors périmètre de C03-001..004) et ne sont pas encore encapsulés derrière les ports définis ici. tasks/C04-001.md demande explicitement de « documenter exceptions existantes authz/config » — auth/ est une extension assumée (non nommée littéralement par le spec) ajoutée pour l'exhaustivité de ce fichier sur tout core/src/ (revue d'architecture AVANT code)."
exception_resorption = "C04-003 (Encapsuler authz et config existants par compatibilité — core/src/opsys_core/compat/{authz,config}.py)"
exception_anomalie_mesuree = "auth/admin_gate.py fait `import totp` (import absolu sans package) et auth/ n'a pas de __init__.py, contrairement à authz/ et config/ — lien non résolvable par un raisonnement en noms de paquets, documenté ici plutôt que corrigé en silence (hors périmètre C04-001)."

[[rules.allowed]]
from = "domain"
to = "kernel"

[[rules.allowed]]
from = "ports"
to = "kernel"

[[rules.allowed]]
from = "adapters"
to = "kernel"

[[rules.allowed]]
from = "adapters"
to = "ports"

[[rules.allowed]]
from = "application"
to = "kernel"

[[rules.allowed]]
from = "application"
to = "domain"

[[rules.allowed]]
from = "application"
to = "ports"

[[rules.allowed]]
from = "application"
to = "adapters"

[[rules.forbidden]]
from = "ports"
to = "adapters"
reason = "cas RED #2 de tasks/C04-001.md — vérifié mécaniquement"

[[rules.forbidden]]
from = "kernel"
to = "adapters"
reason = "le coeur constitutionnel ne dépend d'aucune implémentation concrète"

[[rules.forbidden]]
from = "domain"
to = "adapters"
reason = "découplage domaine/implémentation — inversion de dépendance"

[[rules.forbidden]]
from = "opsys_core"
to = "modules_m"
reason = "cas RED #1 de tasks/C04-001.md, hérité du mécanisme de C03-001 — vérifié mécaniquement"
