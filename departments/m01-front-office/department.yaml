schema: opsys.departement/v1
id: m01-front-office
code: M1
nom: Front Office
mission: >-
  Recevoir chaque demande entrante (téléphone, courriel, formulaire, texte), la filtrer
  contre toute tentative d'injection, la qualifier par règles déterministes (zéro LLM) et
  la router vers le bon module aval — sans jamais produire de prix, de date de chantier,
  d'engagement ferme ni d'aveu de responsabilité, et sans jamais perdre un signal : chaque
  demande laisse exactement une ligne dans le registre anti-perte.
# Avatar du département (docs/architecture/AVATARS.md) : identité par défaut, personnalisable par client dans
# `entreprise.yaml` (clé `avatars` : nom, voix, visage). `voix` et `visage` sont des identifiants logiques : le registre
# de fournisseurs les résoudra. Seule la messagerie (chat avec l'agent dans l'interface du core) existe aujourd'hui.
avatar:
  nom: Léa
  role: "Réceptionniste et adjointe, accueil omnicanal"
  voix: voix.lea.defaut
  visage: visage.lea.defaut
  canaux:
    messagerie: disponible
    voix: prevu
    audiovisuel: prevu
outils: m1_front_office.outils
mode: ombre
dependances: []
modeles:
  defaut: standard
  redaction: rapide
skills:
  - traiter-une-demande-entrante
  - mener-un-appel-vocal
  - recevoir-un-message-de-canal
  - transferer-a-un-humain
  - repondre-a-un-courriel
# PLAN T2.1-a : M1 reçoit le public par le canal SMS du core (extension `sms`). Le socle en tire la configuration
# d'OPSYS-CORE (`opsys-metier openclaw configurer`) : canal désactivé tant que ses identifiants et la validation écrite des
# politiques ne sont pas fournis, une session par client, aucune réponse automatique, outils fermés. Conception :
# docs/departements/M1-canaux.md. Outil d'accueil exigé : m1_recevoir_message_canal (N2 au plus).
canaux: [sms]
# M1 publie le lead qualifié ; M2 le consomme (`evenements.consomme` de M2, PLAN T2.1-b : ingestion complète, un refus
# lève et le répartiteur réessaie puis met en quarantaine).
# PLAN T4.17-c : M1 publie aussi le STOP d'un correspondant (`m1.retrait_consentement`), par le `lead_id` des leads déjà
# ouverts pour lui, jamais un contact ; M7 le consomme (registre `retraits_consentement_marketing`).
# CABLAGE-CONNECTEURS : M1 publie aussi le fil du courriel (message reçu d'un connecteur, brouillon de réponse prêt,
# approbation d'envoi demandée) et, par le planificateur (acteur système, approbation consommée), l'envoi fait ou non
# abouti. Aucun contact ni texte dans ces événements.
evenements:
  publie: [m1.lead_qualifie, m1.retrait_consentement, m1.courriel_recu, m1.brouillon_courriel_pret,
           m1.approbation_envoi_demandee, m1.courriel_envoye, m1.envoi_courriel_echoue]
planifications:
  - nom: digest-front-office
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes le registre anti-perte de la veille : signaux reçus par canal,
      qualifications réussies vs rejetées, tentatives d'injection neutralisées, appels
      manqués ou sans consentement. Aucun nouveau traitement, aucune donnée inventée.
budget:
  tokens_jour: 200000
  tokens_mois: 2500000
  alerte_pct: 80
memoire:
  lecture: [signaux]
  ecriture: [signaux]
kpis:
  - id: taux_signaux_qualifies_pct
    description: Part des signaux entrants aboutissant à un lead qualifié transmis à M2.
  - id: taux_interdits_bloques_pct
    description: >-
      Part des tentatives de violation des interdits absolus (prix, date, engagement,
      aveu) bloquées avant toute sortie — doit rester à 100 %.
