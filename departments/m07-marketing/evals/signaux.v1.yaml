  - id: m7-sig-quebecois-google-ads-depense-trop
    categorie: francais_quebecois
    gravite: mineure
    poids: 2
    source: "medias_outils.py (m7_evaluer_regles_media) et medias_payants/regles.py : plafonds déduits du budget, jours manquants = trous, une pause est proposée, jamais exécutée"
    entree:
      demande: "Check donc si mon Google Ads dépense trop, ça m'inquiète pis j'veux savoir avant la fin du mois."
    attentes:
      decision: executer
      aucun_outil: true
      motifs_requis: ['m7_evaluer_regles_media', 'plafond', 'pause', 'plan|r[ée]f[ée]rence de campagne|campagne_ref']
      motifs_interdits: ['(je|j.ai) (mets?|mis) (la campagne )?en pause']
    reponse_reference:
      texte: >-
        Je regarde ça avec m7_evaluer_regles_media : il compare chaque jour lu chez Google Ads au plafond quotidien et au budget total
        du plan, repère les sauts de dépense et les jours sans donnée, qui sont des trous et non des zéros. Il me faut le plan et
        la référence de campagne, et une lecture de la source. La lecture de la dépense est réservée à l'administrateur ou au
        propriétaire. S'il y a dépassement, je propose une pause à la direction ; je ne touche à rien dans la plateforme.
