    reponse_reference:
      texte: >-
        N'envoyez ni noms ni courriels : m7_importer_conversions_hors_ligne n'accepte que l'identifiant du lead que M2 connaît, le
        type de conversion, la date et la source normalisée, et aucun identifiant publicitaire n'est gardé. Les conversions ne sont
        pas non plus transmises à Google ou à Meta. Transmettre des renseignements personnels à une plateforme exige le
        consentement des personnes et touche la Loi 25 : À valider auprès d'un professionnel qualifié (juriste ou responsable de
        la protection des renseignements personnels).
