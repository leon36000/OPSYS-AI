schema: opsys.departement/v1
id: m02-revenue-crm
code: M2
nom: Revenue CRM
mission: >-
  Ingérer chaque lead qualifié transmis par M1 (source/utm/campagne compris, s'ils sont
  fournis) dans un registre append-only vérifiable, le rattacher à un client stable (Client
  360 — un client, plusieurs opportunités dans le temps), détecter et signaler les doublons
  probables sans jamais les fusionner, faire progresser chaque dossier selon une machine à
  états où toute transition exige une décision humaine explicite, et n'annoncer un lead prêt
  pour M3 que lorsque la readiness gate — owner, type de travaux, ville, interaction
  post-qualification — est réellement satisfaite. Après l'acceptation, suit le reste du cycle
  de vie (cédule, chantier, facture, paiement, avis) et marque le chantier terminé — activité
  et prochaine action, suggérée par une table de règles déterministe — quand M4 y met fin, y
  compris pour une affaire répétée d'un client déjà connu. Quand un devis M3 reste sans réponse
  au-delà du délai de relance, en propose la suite (M2.7) — jamais appliquée seule. Quand M3
  annonce un devis accepté, le lead qualifié devient converti (référence du devis, prochaine
  action « planifier le chantier », activité au Client 360) sans promettre de date au client.
outils: m2_revenue_crm.outils
mode: ombre
# m04-field-ops : M2 consomme le signal de fin de chantier de M4 (DEFINITION-PRODUIT §6,
# cascade « travaux terminés », ligne M2) via m2_marquer_chantier_termine (PLAN T1.1-a).
# m03-estimation : M2 consomme le signal de devis sans réponse de M3 (M2.7 Relances). Ce n'est
# pas un ordre de construction strict — §6 « Boucles de rétroaction » documente déjà des
# dépendances de retour de ce type (ex. M4→M3) dans ce système à événements, pas un DAG pur.
dependances: [m01-front-office, m03-estimation, m04-field-ops]
modeles:
  defaut: standard
skills: [ingerer-un-lead, faire-progresser-vers-m3, arbitrer-un-doublon, lister-les-leads]
planifications:
  - nom: digest-commercial
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes le pipeline commercial de la veille : leads en attente par statut,
      leads orphelins sans owner depuis plus de 48 heures, doublons signalés en attente
      d'arbitrage humain. Aucune transition, aucun arbitrage, aucune donnée inventée.
budget:
  tokens_jour: 220000
  tokens_mois: 3000000
  alerte_pct: 80
memoire:
  lecture: [leads, doublons, clients]
  ecriture: [leads, doublons, clients]
kpis:
  - id: taux_doublons_confirmes_distincts_pct
    description: Part des signalements de doublons arbitrés comme distincts (jamais fusionnés).
  - id: delai_moyen_premiere_action_heures
    description: >-
      Délai moyen entre l'ingestion d'un lead nouveau et l'assignation d'un owner
      (transition vers qualifie).
# PLAN T1.2-c : M2 consomme la fin de travaux de M4 par le bus d'événements du socle (ADR-0009
# §3), en plus de l'outil m2_marquer_chantier_termine qu'elle appelle (voir consommateurs() dans
# outils.py). Catalogue : src/opsys/evenements/catalogue/m4.travaux_termines.json.
# M2.7 (Relances) : M2 consomme m3.devis_sans_reponse (ADR-0009 §3) et en tire une relance
# PROPOSÉE (suggestions.suggerer_relance_devis_sans_reponse), jamais appliquée seule — voir
# consommateurs() dans outils.py. Catalogue :
# src/opsys/evenements/catalogue/m3.devis_sans_reponse.json.
# PLAN T2.2 : M2 publie m2.client_associe à chaque ingestion de lead (Client 360) — catalogue
# src/opsys/evenements/catalogue/m2.client_associe.json. M5 le consomme déjà (facturation avec le
# vrai client_id, repli sur lead_id sinon — departments/m05-financecore). M7 (attribution des
# sources, M2.10) peut s'y abonner aussi.
# PLAN T1.4-k2 : M2 publie aussi m2.lead_assigne à chaque qualification (le propriétaire du lead, dans la
# même transaction) — catalogue src/opsys/evenements/catalogue/m2.lead_assigne.json. M3 le relit à la
# source du bus pour ne rendre à un vendeur que les devis de SES leads (sans importer M2, #109).
# PLAN T2.1-b : M2 consomme m1.lead_qualifie, le lead que M1 qualifie à partir d'un message de canal du core (SMS) — voir
# _recevoir_lead_qualifie dans outils.py : ingestion complète, idempotente, un refus lève (réessais, puis quarantaine).
# Catalogue : src/opsys/evenements/catalogue/m1.lead_qualifie.json.
# PLAN T4.10-a : M2 consomme m3.devis_accepte (DEFINITION-PRODUIT §6, « soumission acceptée -> M4 planifie ») — voir
# _recevoir_devis_accepte dans outils.py : qualifie -> converti avec reference_devis_m3, prochaine action « planifier le
# chantier » (règle citée) et activité au Client 360 ; lead perdu : gardé sans conversion (lead_clos) ; lead inconnu,
# jamais qualifié ou déjà converti par un autre devis : erreur nommée (réessais, puis quarantaine). Catalogue :
# src/opsys/evenements/catalogue/m3.devis_accepte.json.
evenements:
  consomme: [m4.travaux_termines, m3.devis_sans_reponse, m1.lead_qualifie, m3.devis_accepte]
  publie: [m2.client_associe, m2.lead_assigne]
configuration:
  # Seuils de segmentation des leads (PLAN T4.6 ; DEFINITION-PRODUIT.md §7 M2.11 ; §13 point 11 « seuils non
  # chiffrés : chaque département doit les définir »). VIDES à dessein : aucun seuil n'est inventé. Tant qu'un
  # seuil est absent ou invalide, le segment qui en dépend est « non calculable, manque le seuil » (seuil à
  # configurer), jamais évalué avec une valeur devinée, et `m2_lister_leads` refuse un filtre sur lui. Même
  # patron que M8 (`seuils_alerte`) et M6 (`reapprovisionnement`). Relu à chaque appel : aucun redémarrage.
  # Les deux clés sont un entier de jours, au moins 1 :
  #   jours_inactivite_dormant: <jours sans activité humaine d'un lead ouvert (nouveau ou qualifie) pour dormant_lead>
  #   jours_soumission_perimee: <jours depuis l'envoi d'un devis resté sans réponse pour quote_stale>
  # Exemple (à recopier sous `segments:`, avec de vraies valeurs, décidées par Nathan) :
  #   segments:
  #     jours_inactivite_dormant: 30
  #     jours_soumission_perimee: 14
  segments: {}
