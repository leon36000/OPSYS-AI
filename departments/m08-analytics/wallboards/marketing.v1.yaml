# Wallboard « marketing » (M8.8) : ce que les contenus de M7 amènent (leads de M1, devis de M3). Impressions et clics :
# aucune source aujourd'hui, la tuile dit « non calculable » et ne montre jamais un zéro. Depuis l'entrepôt interdépartements :
# la somme des relevés publicitaires de M7 (jamais « la dépense » : c'est la somme des relevés reçus), les conversions hors ligne,
# les anomalies critiques, l'ÉCART nommé entre relevés et dépense comptabilisée (non calculable tant que M5 ne publie pas la
# dépense comptabilisée) et l'écart entre les demandes qualifiées par M1 et les leads reçus par M2.
schema: opsys.m8.wallboard/v1
id: marketing
version: 1
titre: "Contenus et demandes"
description: "Contenus exportés par M7 et ce qu'ils ont amené."
roles: [admin]
rafraichissement: {intervalle_s: 60, flux_max: 60}
rotation: {actif: false, intervalle_s: 20}
tuiles:
  - {id: contenus, mesure: m8_contenus_exportes, titre: "Contenus exportés"}
  - {id: leads-contenu, mesure: m8_leads_par_contenu, titre: "Leads amenés"}
  - {id: devis-envoyes, mesure: m8_devis_envoyes_par_contenu, titre: "Devis envoyés"}
  - {id: devis-acceptes, mesure: m8_devis_acceptes_par_contenu, titre: "Devis acceptés"}
  - {id: impressions, mesure: m8_impressions_par_contenu, titre: "Impressions"}
  - {id: clics, mesure: m8_clics_par_contenu, titre: "Clics"}
  - {id: releves-pub, mesure: m8_releves_depense_pub_cad, titre: "Relevés de dépense publicitaire"}
  - {id: conversions, mesure: m8_conversions_hors_ligne, titre: "Conversions hors ligne"}
  - {id: anomalies, mesure: m8_anomalies_depense_critiques, titre: "Anomalies de dépense critiques"}
  - {id: ecart-depense, mesure: m8_ecart_depense_pub_comptabilisee_cad, titre: "Écart relevés / comptabilisé"}
  - {id: demandes-m1, mesure: m8_demandes_qualifiees_m1, titre: "Demandes qualifiées (front office)"}
  - {id: demandes-sans-lead, mesure: m8_demandes_m1_sans_lead_m2, titre: "Demandes sans lead dans le CRM"}
