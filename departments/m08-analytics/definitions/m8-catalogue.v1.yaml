# CATALOGUE FERMÉ des mesures d'entreprise de M8 (M8.2 entrepôt, M8.8 wallboards, M8.11 score de santé, M8.12 copilote,
# M8.14 pont BI). C'est LA liste de ce que les couches de lecture peuvent montrer ou exporter : une mesure hors de cette liste
# n'existe pas pour elles (pas de SQL libre, pas de colonne choisie par l'appelant). Chaque entrée RÉFÉRENCE une métrique
# gouvernée (définition, unité, propriétaire, version) d'un des registres `m8-entonnoir`, `m8-contenus`, `m8-synthese` : elle
# n'en redéfinit rien. `m8_analytics.catalogue_mesures` refuse un catalogue dont une entrée est inconnue, en double, ou porte
# une clé de plus (faute de frappe à dire, jamais à ignorer).
#
#   domaine         ventes | marketing | operations | qualite | finance | clientele
#   sens            plus_est_mieux | moins_est_mieux | neutre (sert au score de santé et à la couleur des wallboards ; jamais à
#                   décider à la place du propriétaire)
#   sensibilite     agregat (compte ou durée d'entreprise) | financier (montant : admin seulement). AUCUNE mesure du catalogue
#                   n'est personnelle : ni technicien, ni client, ni contact.
#   fraicheur       fenetre_s : fenêtre (secondes) dans laquelle le propriétaire attend le dernier fait (décision d'architecte r1
#                   « fraîcheur M8 » : vue exécutive 24 h) ; OU terminale : true (mesure cumulée de chantiers TERMINÉS, « non
#                   applicable une fois le chantier terminé » : l'âge du dernier chantier ne la rend pas périmée). Le propriétaire
#                   peut resserrer ou fixer une fenêtre par mesure : department.yaml, configuration.fraicheur_mesures_s.
#   synonymes       formulations du français que le copilote reconnaît (accents et casse sans importance). Aucune ne sert à
#                   exécuter quoi que ce soit : elles désignent une entrée de CE catalogue.
schema: opsys.m8.catalogue_mesures/v1
version: 1
mesures:
