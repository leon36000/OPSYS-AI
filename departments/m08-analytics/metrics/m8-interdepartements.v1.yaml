# metrics-as-code v1 : les mesures INTERDÉPARTEMENTS de M8 (entrepôt alimenté par M1, M3, M4, M5, M6 et M7 ; décision
# d'architecte « chaque département autonome ET interconnecté, de même profondeur »). Même patron que `m8-synthese.v1.yaml` :
# compilé par `m8_analytics.dictionnaire.compiler_fichier` (garde de devise CAD comprise) ; `mesures_interdepartements` refuse de
# calculer une métrique absente d'ici. Chaque métrique a un calcul déterministe dans le code : le LLM ne calcule jamais. Une entrée
# absente donne « non calculable, manque X », jamais une valeur inventée ; une entrée présente en partie donne une valeur dont la
# COUVERTURE est dite (« n chantiers sur N »), jamais une valeur présentée comme complète.
#
# Ce sont des métriques d'ENTREPRISE (aucune personne, aucun technicien, aucun client, aucun fournisseur) qui reprennent les
# constats que les départements propriétaires ont publiés sur le bus. M8 ne refait aucun constat : il compte, il additionne les
# montants arrêtés par le propriétaire de la donnée, et il DIT ce que sa mesure ne couvre pas. Les montants de M5 sont repris
# tels quels (créances, comptes à payer) ou cumulés par chantier (marge) ; aucun n'est recalculé.
#
# `proprietaires` : le département qui tient la vérité de la donnée source (DEFINITION-PRODUIT.md §8).
schema_version: 1
module: m08-analytics
owner_calcul: "M8 (le LLM ne calcule jamais)"
proprietaires:
  m8_chantiers_marge_reelle: m05-financecore
  m8_marge_reelle_cumulee_cad: m05-financecore
  m8_chantiers_en_perte: m05-financecore
