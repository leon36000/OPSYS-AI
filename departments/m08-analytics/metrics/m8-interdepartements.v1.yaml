metrics:
  - id: m8_chantiers_marge_reelle
    nom: "Chantiers à marge réelle chiffrée"
    definition: "Nombre de chantiers terminés (M4, wct_id distincts) dont M5 a chiffré la marge réelle : verdict CALCULÉE, coût réel complet ET facture au prix définitif (envoyée ou payée), l'état courant de M5 étant son fait de plus grand `sequence`. La couverture (n sur N chantiers terminés) est dite. Aucun chantier chiffré : non calculable, jamais un zéro."
    unite: "chantiers"
    source_donnees: "M5 m5.rentabilite_chantier (verdict, prix_definitif, cout_reel_complet, marge_reelle_cad, sequence) ; M4 m4.travaux_termines (wct_id)"
    frequence: "à chaque nouvelle trace de rentabilité de M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_marge_reelle_cumulee_cad
    nom: "Marge réelle cumulée des chantiers chiffrés"
    definition: "Somme, en dollars canadiens avant taxes, des marges réelles que M5 a chiffrées (prix facturé définitif moins coût réel complet) pour les chantiers terminés dont la marge est chiffrée. Ce n'est PAS la marge de l'entreprise : les chantiers sans marge chiffrée n'y sont pas, et la couverture (n sur N) est dite. Aucun chantier chiffré : non calculable. Analyse préparatoire : À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.rentabilite_chantier (marge_reelle_cad) ; M4 m4.travaux_termines (wct_id)"
    frequence: "à chaque nouvelle trace de rentabilité de M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_chantiers_en_perte
    nom: "Chantiers en perte"
    definition: "Nombre de chantiers dont la marge réelle chiffrée par M5 est strictement négative, parmi les chantiers à marge réelle chiffrée (m8_chantiers_marge_reelle). Un chantier sans marge chiffrée n'est ni en perte ni rentable : il n'est pas compté. Aucun chantier chiffré : non calculable."
    unite: "chantiers"
    source_donnees: "M5 m5.rentabilite_chantier (marge_reelle_cad) ; M4 m4.travaux_termines (wct_id)"
    frequence: "à chaque nouvelle trace de rentabilité de M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_ecart_marge_cumule_cad
    nom: "Écart cumulé de marge (réelle moins prévue)"
    definition: "ÉCART DE DÉFINITION entre deux départements : somme, en dollars canadiens, de la marge réelle de M5 moins la marge prévue du devis accepté de M3 (prix moins coût arrêtés par M3), pour les chantiers terminés qui portent les deux. Négatif = la réalité rapporte moins que la promesse. Les chantiers qui ne portent qu'un des deux côtés sont comptés à part, jamais ignorés en silence. Aucun chantier mesurable : non calculable."
    unite: "CAD"
    source_donnees: "M5 m5.rentabilite_chantier (marge_reelle_cad) ; M3 m3.devis_accepte (prix_total, cout_total) ; M4 m4.travaux_termines (wct_id, devis_id)"
    frequence: "à chaque nouvelle trace de rentabilité de M5 ou devis accepté"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_creances_ouvertes_cad
    nom: "Créances ouvertes"
    definition: "Le total des créances ouvertes que M5 a constaté en dernier (m5.mesures_comptables_constatees : le constat de plus grande date de référence), tel que M5 l'a publié : aucun calcul, aucun arrondi. Un constat dont le total ne correspond pas à la somme de ses tranches d'âge est refusé comme incohérent. Aucun constat reçu : non calculable. Analyse préparatoire : À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.mesures_comptables_constatees (creances.total, creances.par_tranche, date_reference)"
    frequence: "à chaque constat des mesures comptables demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_creances_90_jours_plus_cad
    nom: "Créances de quatre-vingt-dix jours et plus"
    definition: "La tranche « 90+ » des créances ouvertes du dernier constat de M5 (m5.mesures_comptables_constatees), telle que M5 l'a publiée. Même règle de cohérence et même absence de calcul que m8_creances_ouvertes_cad. Aucun constat reçu : non calculable. À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.mesures_comptables_constatees (creances.par_tranche, date_reference)"
    frequence: "à chaque constat des mesures comptables demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_ecritures_en_attente
    nom: "Écritures comptables en attente de validation"
    definition: "Nombre de brouillons d'écriture que M5 a préparés et qu'aucune personne n'a encore validés, tel que le dernier constat des mesures comptables de M5 (m5.mesures_comptables_constatees : plus grande date de référence) le compte. C'est un retard de validation humaine (N4), pas une erreur ni un solde. Aucun constat reçu : non calculable. À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "écritures"
    source_donnees: "M5 m5.mesures_comptables_constatees (brouillons_en_attente, date_reference)"
    frequence: "à chaque constat des mesures comptables demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_comptes_a_payer_cad
    nom: "Comptes à payer"
    definition: "La composante « comptes à payer » du dernier constat du cash libre de M5 (m5.cash_libre_constate : le constat de plus grand `sequence`), telle que M5 l'a publiée. Si M5 n'a pas pu la chiffrer, la mesure est non calculable et nomme le code de M5 ; le plancher que M5 connaît est dit, jamais pris pour le total. Aucun constat reçu : non calculable. À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.cash_libre_constate (composantes.comptes_a_payer, manque, sequence, date_reference)"
    frequence: "à chaque constat du cash libre demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_solde_tresorerie_cad
    nom: "Solde de trésorerie"
    definition: "Le solde que M5 a constaté en dernier (composante « solde » de m5.cash_libre_constate : le constat de plus grand `sequence`), tel que M5 l'a publié : aucun calcul. Ce n'est PAS de l'argent disponible : le cash libre (m8_cash_libre_cad) retranche les obligations. Si M5 n'a pas pu le chiffrer, non calculable avec le code de M5 ; le plancher connu est dit, jamais pris pour le solde. Aucun constat reçu : non calculable. À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.cash_libre_constate (solde, manque, sequence, date_reference)"
    frequence: "à chaque constat du cash libre demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_taxes_a_remettre_cad
    nom: "Taxes à remettre"
    definition: "La composante « TPS/TVQ à remettre » du dernier constat du cash libre de M5 (m5.cash_libre_constate : le constat de plus grand `sequence`), telle que M5 l'a publiée : aucun calcul, aucun taux de M8. Si M5 n'a pas pu la chiffrer, non calculable avec le code de M5 ; le plancher connu est dit, jamais pris pour le total. Aucun constat reçu : non calculable. À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.cash_libre_constate (composantes.taxes_a_remettre, manque, sequence, date_reference)"
    frequence: "à chaque constat du cash libre demandé à M5"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_releves_depense_pub_cad
    nom: "Somme des relevés de dépense publicitaire reçus"
    definition: "Somme, en dollars canadiens, des DERNIÈRES révisions des relevés de dépense publicitaire (Google Ads, Meta) que M7 a reçus des plateformes, sur les jours que ces relevés couvrent. Ce n'est PAS la dépense réelle de l'entreprise : un jour sans relevé n'est pas un zéro, et la dépense comptabilisée par M5 est une autre définition (voir m8_ecart_depense_pub_comptabilisee_cad). Refusée (non calculable) quand les bases de taxes des relevés diffèrent ou quand deux relevés d'un même canal se chevauchent. Les jours sans relevé à l'intérieur de la période couverte rendent la couverture partielle, dite. Fraîcheur : la plus stricte de la fenêtre de M8 et de celle que M7 déclare pour ses sources publicitaires."
    unite: "CAD"
    source_donnees: "M7 m7.depenses_marketing_constatees (releve_id, revision, canal, periode, montant_cad, base_taxes, releve_le) ; M7 m7.signaux_marketing_constates (fraicheur_fenetre_h des sources publicitaires)"
    frequence: "à chaque relevé de dépense lu par M7"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_conversions_hors_ligne
    nom: "Conversions hors ligne importées"
    definition: "Nombre de conversions hors ligne (appel, rendez-vous, soumission signée, vente) que M7 a importées et rattachées à un lead de M2 (conversion_id distincts). Une conversion compte une issue : elle n'explique pas son origine, et celles dont la source n'est pas normalisée sont comptées à part. Aucune conversion reçue : non calculable, M8 ne peut pas distinguer « aucune issue » de « rien livré »."
    unite: "conversions"
    source_donnees: "M7 m7.conversion_hors_ligne_importee (conversion_id, type, source_normalisee, importee_le)"
    frequence: "à chaque import de conversions hors ligne"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_anomalies_depense_critiques
    nom: "Anomalies de dépense critiques"
    definition: "Nombre d'anomalies de sévérité « critique » que les règles transparentes de M7 ont détectées sur les dépenses publicitaires (anomalie_id distincts, comptes de démonstration exclus et comptés à part). Aucune anomalie réelle reçue : non calculable, M8 ne peut pas distinguer « aucune anomalie » de « rien livré »."
    unite: "anomalies"
    source_donnees: "M7 m7.anomalie_depense_detectee (anomalie_id, severite, fictif, detectee_le)"
    frequence: "à chaque anomalie détectée par M7"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_ecart_depense_pub_comptabilisee_cad
    nom: "Écart entre relevés publicitaires et dépense comptabilisée"
    definition: "ÉCART DE DÉFINITION, en dollars canadiens hors taxes, entre M7 (somme des dernières révisions des relevés reçus des plateformes) et M5 (dépense publicitaire que le grand livre a comptabilisée), sur la période du dernier constat de M5. Positif : les relevés dépassent ce qui est comptabilisé. Seuls les relevés HORS_TAXES dont la période tient entière dans celle du constat sont comparés ; les relevés à cheval sur ses bornes et les relevés TAXES_INCLUSES (que M5 ne comptabilise pas) sont écartés, et les brouillons de charge qui attendent la validation d'une personne expliquent une partie de l'écart : la couverture dit tout cela. Ce n'est pas une erreur : ce sont deux définitions de deux départements, jamais moyennées. Non calculable sans constat de M5, sans relevé comparable ou si un relevé est illisible. Analyse préparatoire : À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.depense_publicitaire_constatee (periode, comptabilise_cad, brouillons_en_attente) ; M7 m7.depenses_marketing_constatees (releve_id, revision, canal, periode, montant_cad, base_taxes)"
    frequence: "à chaque constat de M5 ou relevé de dépense de M7"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_heures_sur_site_chantiers
    nom: "Heures sur site des chantiers terminés"
    definition: "Somme, en heures, des durées réelles sur site (pauses déduites) que M4 a déclarées pour les chantiers terminés (wct_id distincts). C'est la durée écoulée sur site de chaque chantier, pas des heures-personnes. Un chantier dont la durée est illisible est compté à part, jamais ignoré en silence. Aucun chantier terminé : non calculable."
    unite: "heures"
    source_donnees: "M4 m4.travaux_termines (wct_id, duree_reelle_minutes)"
    frequence: "à chaque chantier terminé"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_receptions_materiaux
    nom: "Réceptions de matériaux"
    definition: "Nombre de livraisons de matériaux que M6 a enregistrées contre un bon de commande (une réception par bon de commande et mouvement de stock). Ni le fournisseur, ni les lignes, ni les prix ne sont gardés. Aucune réception reçue : non calculable."
    unite: "réceptions"
    source_donnees: "M6 m6.reception_enregistree (po_id, hash_maillon, horodatage_reception, verdict_reception)"
    frequence: "à chaque réception enregistrée par M6"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_receptions_avec_ecart
    nom: "Réceptions avec écart"
    definition: "Nombre de réceptions de matériaux dont le verdict de M6 n'est pas « conforme » (réception inférieure, supérieure ou mixte), repris sans le recalculer. Aucune réception reçue : non calculable."
    unite: "réceptions"
    source_donnees: "M6 m6.reception_enregistree (po_id, hash_maillon, verdict_reception)"
    frequence: "à chaque réception enregistrée par M6"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_demandes_qualifiees_m1
    nom: "Demandes qualifiées par le front office"
    definition: "Nombre de demandes (lead_id distincts) que M1 a qualifiées et transmises à M2 (m1.lead_qualifie). Autre définition que m8_leads_qualifies (leads que M2 a qualifiés et assignés) : l'écart entre les deux est montré, jamais fondu. Aucune demande reçue de M1 : non calculable."
    unite: "demandes"
    source_donnees: "M1 m1.lead_qualifie (lead_id, horodatage)"
    frequence: "à chaque demande qualifiée par M1"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_demandes_m1_sans_lead_m2
    nom: "Demandes du front office sans lead dans le CRM"
    definition: "ÉCART DE DÉFINITION entre M1 et M2 : nombre de demandes que M1 a qualifiées (lead_id) pour lesquelles M2 n'a pas encore reçu de lead (m2.client_associe). Une demande en route, perdue ou ingérée sans client associé y figure ; les leads de M2 que M1 n'a pas qualifiés (autre canal, opportunité rouverte) sont comptés à part. Non calculable sans demande de M1, ou sans aucun lead reçu de M2 (M8 ne peut pas dire si M2 n'a rien reçu ou si le bus n'a rien livré)."
    unite: "demandes"
    source_donnees: "M1 m1.lead_qualifie (lead_id) ; M2 m2.client_associe (lead_id)"
    frequence: "à chaque demande qualifiée par M1 ou lead reçu par M2"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_commandes_envoyees
    nom: "Commandes de matériaux envoyées"
    definition: "Nombre de bons de commande de M6 dont le courriel est parti, après l'approbation humaine du sas d'envoi de M1 (bon de commande distincts ; m1.commande_courriel_envoyee). M1 est le canal, M6 reste la source de vérité du bon de commande : M8 ne garde ni le brouillon, ni l'adresse, ni le fournisseur. Une commande créée mais non envoyée n'est pas comptée. Aucune commande envoyée reçue : non calculable."
    unite: "commandes"
    source_donnees: "M1 m1.commande_courriel_envoyee (po_id, envoye_le)"
    frequence: "à chaque commande envoyée"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_depense_pub_comptabilisee_cad
    nom: "Dépense publicitaire comptabilisée"
    definition: "Dernier constat que M5 a publié de la dépense publicitaire COMPTABILISÉE sur une période : le solde net (débits moins crédits), en dollars canadiens hors taxes, des écritures DÉFINITIVES du grand livre qui viennent d'un relevé de M7 ou qui le contre-passent, à leur date d'effet. M8 le reprend tel quel (le plus grand `sequence` de M5 fait foi) et ne lit pas le grand livre. Les brouillons de charge qui attendent la validation d'une personne ne sont PAS comptabilisés : leur nombre et leur montant sont dits, et la couverture est partielle tant qu'il en reste. Ce n'est PAS la dépense réelle de l'entreprise (seules les dépenses de M7 y sont, hors taxes). Aucun constat reçu : non calculable. Analyse préparatoire : À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.depense_publicitaire_constatee (sequence, periode, comptabilise_cad, brouillons_en_attente, brouillons_en_attente_cad, base_taxes)"
    frequence: "à chaque constat de M5 (m5_constater_depense_publicitaire)"
    consommateur: "wallboard marketing, copilote analytique, entrepôt"
  - id: m8_factures_emises
    nom: "Factures clients émises"
    definition: "Nombre de factures clients (facture_id distincts) qu'une personne a envoyées (N4) et que M5 a constatées, sans celles annulées après l'envoi ; l'état le plus avancé de chaque facture fait foi (payée ou annulée après envoyée), quel que soit l'ordre de livraison. Une facture en brouillon n'est pas émise. M8 ne garde ni client, ni chantier, ni ligne. Aucune facture émise reçue : non calculable, M8 ne peut pas distinguer « aucune facture » de « rien livré »."
    unite: "factures"
    source_donnees: "M5 m5.facture_emise_constatee (facture_id, statut, emise_le)"
    frequence: "à chaque facture envoyée, payée ou annulée après envoi"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_facturation_emise_cad
    nom: "Facturation émise avant taxes"
    definition: "Somme, en dollars canadiens AVANT taxes, des montants des factures émises que M5 a arrêtés (factures non annulées, état courant de chacune). Les taxes et le montant après taxes sont dits dans les entrées, jamais recalculés par M8. Ce n'est PAS le chiffre d'affaires de l'entreprise ni un revenu comptable : c'est ce que M5 a facturé aux clients. Aucune facture émise reçue, ou toutes annulées : non calculable. Analyse préparatoire : À valider auprès d'un comptable (CPA) / professionnel qualifié."
    unite: "CAD"
    source_donnees: "M5 m5.facture_emise_constatee (montant_avant_taxes_cad, total_taxes_cad, montant_apres_taxes_cad, statut)"
    frequence: "à chaque facture envoyée, payée ou annulée après envoi"
    consommateur: "wallboard finance et opérations, copilote analytique, entrepôt"
  - id: m8_constats_preaudit
    nom: "Constats du pré-audit"
