schema: opsys.departement/v1
id: m08-analytics
code: M8
nom: Analytics
mission: >-
  Produire la vérité chiffrée unique de l'entreprise à partir des snapshots que chaque module
  lui rapporte : compiler le dictionnaire canonique de métriques, dériver leur valeur avec
  provenance complète (version, fraîcheur, n), détecter les signaux XmR hors limites
  naturelles et assembler des rapports filtrés par rôle — sans jamais calculer un chiffre par
  LLM, ni inventer une métrique pour un module qui n'en déclare aucune. À « travaux terminés »,
  mesure le chantier (temps réel contre prévu, marge prévue contre réelle, écart de matériaux,
  écart de temps par technicien pour l'admin) avec des métriques gouvernées : une donnée absente
  donne « non calculable, manque X », jamais une valeur inventée ; un seuil franchi propose une
  alerte à M9, qui lit sans décider. Mesure aussi l'entonnoir commercial (leads, devis envoyés,
  acceptés et sans réponse, taux d'acceptation, délai, carnet signé) d'après les faits de M2 et de
  M3, et remet au propriétaire une vue exécutive : entonnoir, marge réelle que M5 a publiée, stock
  à commander que M6 publie, cash libre que M5 a constaté (le dernier constat, tel quel, avec son âge) ou ce qui
  en manque — sans jamais recalculer un montant de M5.
  Mesure enfin, par contenu exporté par M7 (clé utm_content), les leads de M1 puis les devis de M3 qu'il a amenés ;
  impressions et clics : aucune source aujourd'hui, « non calculable », jamais un zéro.
# Avatar du département (docs/architecture/AVATARS.md) : identité par défaut, personnalisable par client dans
# `entreprise.yaml` (clé `avatars` : nom, voix, visage). `voix` et `visage` sont des identifiants logiques : le registre
# de fournisseurs les résoudra. Seule la messagerie (chat avec l'agent dans l'interface du core) existe aujourd'hui.
avatar:
  nom: Olivier
  role: "Analyste de données et tableaux de bord"
  voix: voix.olivier.defaut
  visage: visage.olivier.defaut
  canaux:
    messagerie: disponible
    voix: prevu
    audiovisuel: prevu
outils: m8_analytics.outils
mode: ombre
dependances: [m01-front-office, m02-revenue-crm, m03-estimation, m04-field-ops, m05-financecore, m06-material-control, m07-marketing]
modeles:
  defaut: standard
  digest: rapide
skills: [rapport-analytique-quotidien, lecture-analytique-fermee]
planifications:
  - nom: entrepot-et-memoire
    cron: "30 6 * * 1-5"
    consigne: >-
      Reconstruis l'entrepôt dérivé puis publie les faits consolidés vers la mémoire : appelle m8_construire_entrepot, puis
      m8_publier_faits_consolides, puis m8_enregistrer_sante_entreprise, chacun avec maintenant = l'instant courant (RFC 3339
      avec fuseau). Ne calcule aucun chiffre ; rapporte seulement les statuts rendus (construit ou inchangé, nouvelle ou
      rejouée, enregistré ou non). Si un outil refuse, dis le code et arrête.
  - nom: digest-analytics
    cron: "0 7 * * 1-5"
    consigne: >-
      Assemble le digest quotidien à partir des signaux XmR et des alertes de qualité déjà
      calculés la veille : nombre de signaux actifs, liste des signaux hors limites, alertes
      proposées sourcées (une journée sans alerte le dit explicitement). N'ingère aucun nouveau
      snapshot, ne calcule aucun chiffre de tête.
budget:
  tokens_jour: 300000
  tokens_mois: 4000000
  alerte_pct: 80
memoire:
  lecture: [dictionnaire_metriques, snapshots_modules, definitions_metriques, faits_chantier, faits_entonnoir, faits_contenus, faits_cash_libre, faits_operations, historique_sante, publications_memoire]
  ecriture: [snapshots_modules, definitions_metriques, faits_chantier, faits_entonnoir, faits_contenus, faits_cash_libre, faits_operations, historique_sante, publications_memoire]
evenements:
  # PLAN T1.5-d : le WCT (durée réelle, technicien), le devis accepté (prix, coût, durée estimée si
  # M3 la fournit), la variance de matériaux de M6 (verdict repris sans recalcul) et la marge réelle de
  # M5 (reprise sans recalcul ; absente tant que le coût réel de M5 est partiel). Catalogue :
  # src/opsys/evenements/catalogue/*.json.
  # PLAN T4.19 : l'entonnoir commercial. M2 publie le lead reçu (`m2.client_associe`) et qualifié
  # (`m2.lead_assigne`) ; M3 le devis envoyé (`m3.devis_envoye`, approuvé par le propriétaire), accepté
  # (`m3.devis_accepte`, déjà consommé ci-dessus pour la mesure d'un chantier) et sans réponse
  # (`m3.devis_sans_reponse`). Identifiants et instants seulement, plus le prix total d'un devis accepté :
  # jamais un contact, le propriétaire d'un lead, ni un coût (Loi 25).
  # PLAN T4.17-e : la mesure par contenu. M7 publie le contenu exporté (`m7.contenu_exporte` : clé utm_content, chantier, canal)
  # et M1 le lead qualifié (`m1.lead_qualifie`, dont M8 ne garde que le lead_id, la clé utm_content et l'instant : ni le contact,
  # ni la ville, ni le service). Les devis par contenu se lisent dans les faits de l'entonnoir ci-dessus.
  # PLAN T4.19-b : le cash libre que M5 a constaté (`m5.cash_libre_constate`, à la demande de l'admin) : les montants
  # tels que le calcul de M5 les rend, chaque composante avec sa source et sa fraîcheur, ou « non calculable, manque X ».
  # M8 range chaque constat (`faits_cash_libre`, un fait par événement) et la vue exécutive montre le dernier, tel quel,
  # avec son âge ; il ne recalcule rien.
  # Interconnexion (docs/architecture/INTERCONNEXION.md) : M8 reçoit aussi les constats de M7 (signaux, relevés de dépense,
  # anomalies, conversions hors ligne), de M5 (mesures comptables) et de M3 (mesures de vision validées). Registre
  # `faits_operations` (un fait par clé de contenu, jamais un nom ni un contact) ; la vue exécutive en tire la section
  # `operations_recues` (absente tant que rien n'est reçu). M8 ne refait aucun constat.
  # Entrepôt interdépartements (docs/architecture/M8-ENTREPOT-SOURCES.md) : les mêmes constats alimentent aussi 16 mesures du
  # catalogue fermé (métriques `m8-interdepartements`) ; M8 reçoit en plus les réceptions de matériaux de M6
  # (`m6.reception_enregistree` : bon de commande, verdict, instant ; ni fournisseur, ni ligne, ni prix) et les commandes
  envoyées par le canal de M1 (`m1.commande_courriel_envoyee` : bon de commande et instant ; ni brouillon, ni adresse).
  consomme:
    - m4.travaux_termines
    - m3.devis_accepte
    - m6.variance_chantier
    - m5.rentabilite_chantier
    - m2.client_associe
    - m2.lead_assigne
    - m3.devis_envoye
    - m3.devis_sans_reponse
    - m7.contenu_exporte
    - m1.lead_qualifie
    - m5.cash_libre_constate
    - m7.signaux_marketing_constates
    - m7.depenses_marketing_constatees
    - m7.anomalie_depense_detectee
    - m7.conversion_hors_ligne_importee
    - m5.mesures_comptables_constatees
    - m3.mesure_vision_validee
    - m6.reception_enregistree
    - m1.commande_courriel_envoyee
    # Phase 2 (D1 à D3, docs/architecture/M8-ENTREPOT-SOURCES.md) : aucune lecture croisée ni droit d'appareil de plus. Les
    # départements PUBLIENT un résumé agrégé et minimisé sur le bus, M8 le consomme (registre `faits_operations`, version
    # la plus récemment publiée) : dépense publicitaire comptabilisée et factures émises de M5, valeurs de signaux de M7,
    # capacité des équipes de M4, pipeline de M2, disponibilité du matériel de M6, plaintes de M1.
    - m5.depense_publicitaire_constatee
    - m5.facture_emise_constatee
    - m7.performance_signaux_constatee
    - m4.capacite_equipe_constatee
    - m2.pipeline_constate
    - m6.disponibilite_constatee
    - m1.plaintes_constatees
  publie: [m8.alerte_proposee, m8.snapshot_chantier, m8.fait_consolide]
configuration:
  # Seuils d'alerte des mesures d'un chantier terminé (PLAN T1.5-d ; DEFINITION-PRODUIT.md §13 point 11
  # « seuils non chiffrés : chaque département doit les définir »). VIDES à dessein : aucun seuil
  # n'est inventé. Tant qu'une métrique n'a pas de seuil valide, M8 ne l'alerte pas et publie le
  # signal « seuil à configurer » (MESURE-SEUIL-A-CONFIGURER, visible dans le briefing de M9).
  # Forme, par métrique surveillée (m8_ecart_duree_pct, m8_ecart_marge_pct,
  # m8_ecart_materiaux_max_pct) :
  #   m8_ecart_duree_pct: {sens: au_dessus, valeur: <nombre, en %>}   # atteint ou dépasse
  #   m8_ecart_marge_pct: {sens: au_dessous, valeur: <nombre, en %>}  # atteint ou passe sous
  # La valeur est dans l'unité de la métrique (pourcentage). Sens : au_dessus ou au_dessous.
  seuils_alerte: {}
  # Écart de temps par technicien (m8_performance_equipe) : nombre minimal de chantiers mesurés
  # pour que l'écart d'un technicien soit dit suffisant. Absent : `suffisant` reste nul. Jamais une
  # alerte ni un classement, quel que soit ce nombre.
  performance_equipe: {}
  # Seuils de l'entonnoir commercial (PLAN T4.19, GATE NATHAN : DEFINITION-PRODUIT.md §13 point 11). VIDES à
  # dessein : aucun seuil n'est inventé. Tant qu'une métrique surveillée n'a pas de seuil valide, la vue exécutive
  # (m8_lire_vue_executive) la dit « seuil à configurer » et ne signale aucun franchissement. Même forme que
  # `seuils_alerte`, pour les quatre métriques surveillées :
  #   m8_taux_acceptation_pct: {sens: au_dessous, valeur: <nombre, en %>}          # atteint ou passe sous
  #   m8_delai_lead_acceptation_jours: {sens: au_dessus, valeur: <nombre, en jours>}
  #   m8_devis_sans_reponse: {sens: au_dessus, valeur: <nombre de devis>}
  #   m8_carnet_signe_cad: {sens: au_dessous, valeur: <nombre, en CAD avant taxes>}
  # Les comptages cumulés (leads, devis envoyés ou acceptés) ne se surveillent pas : ils ne font que croître. Une
  # clé qui n'est pas l'une de ces quatre métriques est dite `ignores` dans la vue, jamais ignorée en silence.
  seuils_entonnoir: {}
  # Fraîcheur attendue d'une LECTURE (fenêtre en secondes dans laquelle le propriétaire attend le dernier fait que la
  # lecture porte), fournie au consommateur (M9) qui la compare à l'âge qu'il calcule. VIDE à dessein : aucune fenêtre
  # n'est inventée ni dérivée ; sans déclaration, la lecture ne porte aucune clé de plus et M9 laisse la fraîcheur
  # « non évaluée ». Forme : {<outil de lecture>: <entier de secondes, 1 à 315360000 (3650 jours)>}, outils déclarables :
  # m8_lire_vue_executive, m8_lire_mesures_chantier. Valeur invalide (zéro, négatif, décimal, texte, booléen, trop
  # grande) : refusée et dite dans la lecture (`fraicheur_attendue_refusee`), jamais corrigée. Clé inconnue : dite
  # (`fraicheur_attendue_ignorees`). Contrat : docs/FRAICHEUR-ATTENDUE-LECTURES.md.
  fraicheur_lectures_s: {}
  # Fraîcheur attendue d'une MESURE du catalogue fermé (M8.5/M8.8, décision d'architecte r1 « fraîcheur M8 ») : en secondes,
  # par mesure, pour resserrer ou fixer la fenêtre que le catalogue déclare (`definitions/m8-catalogue.v1.yaml` : 24 h pour la
  # vue exécutive ; mesures cumulées de chantiers terminés : non applicable). VIDE à dessein. Précédence : la plus stricte
  # des fenêtres (propriétaire, appelant). Forme : {<metric_id>: <entier de secondes, 1 à 315360000>}. Valeur invalide
  # (zéro, négatif, décimal, texte, booléen) : refusée et dite (`fraicheur_mesures_refusees`) ; clé hors catalogue : dite
  # (`fraicheur_mesures_ignorees`). Jamais corrigée en silence.
  fraicheur_mesures_s: {}
  # Cadence de la SOURCE d'une mesure (D7, M8-ENTREPOT-SOURCES.md) : en secondes, par mesure, le rythme auquel le
  # département source publie ses faits. La fenêtre du producteur devient max(24 h, cadence) : une source qui publie une fois par
  # semaine n'est pas « périmée » au bout de 24 h. VIDE à dessein : le catalogue déclare une cadence là où la nature de la
  # source la fixe (la capacité d'équipe est constatée par semaine : 604800) et `null` ailleurs (source sporadique, cadence non
  # déclarée) ; aucune cadence n'est inventée. Forme : {<metric_id>: <entier de secondes, 1 à 315360000>}, elle remplace celle du
  # catalogue. Valeur invalide : refusée et dite (`cadences_mesures_refusees`) ; clé hors catalogue : dite
  # (`cadences_mesures_ignorees`). Une fenêtre fixée dans `fraicheur_mesures_s` l'emporte sur toute cadence.
  cadences_mesures_s: {}
  # Score de santé de l'entreprise (M8.11). VIDE à dessein (GATE propriétaire : DEFINITION-PRODUIT.md §13 point 11) : les
  # bornes sont des seuils d'affaires que M8 n'invente jamais. Forme :
  #   sante:
  #     bornes:                                  # par indicateur de definitions/m8-sante.v1.yaml
  #       m8_taux_acceptation_pct: {pire: <nombre>, cible: <nombre>}   # pire = 0 point, cible = 100 points
  #     ponderations_validees_par: <texte>       # qui a validé les pondérations proposées (facultatif)
  # « pire » et « cible » vont dans le sens du « mieux » du catalogue (plus_est_mieux : pire < cible). Sans bornes valides,
  # le score est INDÉTERMINÉ et dit lesquelles configurer.
  sante: {}
kpis:
  - id: taux_snapshots_rejetes
    description: Part des snapshots reçus rejetés par la validation d'entrée (structure, devise, valeurs non texte).
  - id: nb_signaux_actifs_digest
    description: Nombre de signaux XmR actifs (hors DONNEES_INSUFFISANTES) dans le dernier digest quotidien.
  - id: fraicheur_moyenne_metriques
    description: Âge moyen, en jours, des métriques dérivées et citées dans les rapports du jour.
  - id: nb_alertes_qualite_proposees
    description: >-
      Nombre d'alertes de qualité (donnée absente, périmée, hors plage, doublon d'observation ou
      incohérence entre séries) proposées par m8_evaluer_qualite_metrique sur la période —
      jamais exécutées, seulement proposées.
  - id: taux_metriques_chantier_non_calculables
    description: >-
      Part des mesures de chantier terminé rendues « non calculable » (durée estimée, marge réelle
      ou variance de matériaux absentes) sur la période : mesure la complétude des sources, jamais
      remplie par une valeur inventée.
  - id: nb_alertes_mesure_proposees
    description: >-
      Nombre d'alertes de mesure de chantier proposées à M9 (seuil franchi, ou seuil à configurer)
      sur la période — jamais exécutées, seulement proposées.
  - id: nb_metriques_entonnoir_non_calculables
    description: >-
      Nombre de métriques de l'entonnoir rendues « non calculable » (aucun fait reçu de M2 ou de M3, rapport sans
      dénominateur, prix illisible) dans la dernière vue exécutive : mesure la complétude des sources, jamais
      remplie par une valeur inventée.
  - id: nb_metriques_contenus_non_calculables
    description: >-
      Nombre de métriques par contenu rendues « non calculable » dans la dernière lecture (aucun contenu exporté reçu de M7,
      aucun lead reçu de M1, source des impressions et des clics absente) : mesure la complétude des sources, jamais remplie
      par une valeur inventée.
