# Corpus d'évaluation du COPILOTE analytique (M8.12) — rédigé à la main AVANT exécution, depuis les règles du module
# `m8_analytics.copilote` (catalogue fermé, refus typés, lecture seule). Il mesure le copilote lui-même (reconnaissance des
# mesures, refus, résistance à l'injection), sans modèle de langage : c'est la couche déterministe. Le comportement d'un
# AGENT qui appelle l'outil `m8_repondre_question` se mesure, lui, avec le gabarit commun (`evals/gabarit.v1.yaml`).
# Données fictives. Chaque cas : `q` (la question), `attendu` (statut, et selon le cas `mesures`, `code`, `intention`).
schema: opsys.m8.copilote.corpus/v1
fictif: true
