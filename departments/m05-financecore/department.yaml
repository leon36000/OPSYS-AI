schema: opsys.departement/v1
id: m05-financecore
code: M5
nom: FinanceCore
mission: >-
  Tenir le registre financier de l'entreprise — mouvements, solde, cash libre réel,
  taxes TPS/TVQ et leurs échéances, approbations F0-F7 — sans jamais engager, payer ou approuver de
  lui-même : toute écriture financière et toute décision d'approbation restent une
  proposition tant qu'un humain ne les a pas validées sur pièces.
outils: m5_financecore.outils
mode: ombre
dependances: [m02-revenue-crm, m03-estimation, m04-field-ops, m06-material-control]
evenements:                                          # ADR-0009 §3, PLAN T1.2-d/T1.3-c/T2.2
  # client réel + brouillon + signal M6 ; PLAN T4.15 : m6.reception_enregistree, ce qui est arrivé d'un PO (l'« à payer
  # attendu » des comptes à payer). M5 ne publie rien de plus : les comptes à payer se lisent (m5_lister_comptes_a_payer).
  consomme: [m2.client_associe, m3.devis_accepte, m4.travaux_termines, m6.variance_chantier, m6.reception_enregistree]
  # PLAN T1.5-d : la marge réelle du chantier (ou ce qui manque pour la chiffrer) atteint M8 et M10. Jamais
  # un prix unitaire, un taux ni une donnée de client ; jamais une marge pour un coût partiel.
  publie: [m5.rentabilite_chantier]
approbations:                                         # ADR-0009 §5, PLAN T1.3-c point 5
  n3: [finance, nathan_owner]
  n4: [finance, nathan_owner]                        # envoi de facture (m5_envoyer_facture), correction et annulation d'une
                                                     # facture fournisseur (m5_corriger_..., m5_annuler_..., T4.15-c)
  # N5 (paiement, m5_enregistrer_paiement_facture) ne se déclare pas : nathan_owner seul, fixé par
  # le socle (ADR-0009 §5).
# PLAN T1.5-d : coût réel d'un chantier. Le taux horaire de la main-d'oeuvre est un chiffre de l'entreprise,
# que M5 ne devine pas : il est donc ABSENT ici, et le coût réel dit « taux horaire à configurer »
# (REJ-COUT-TAUX-HORAIRE-A-CONFIGURER) tant que Nathan ne l'a pas écrit. Pour l'activer, ajouter ce bloc (dollars
# CAD par heure sur site, entre guillemets pour garder les décimales exactes ; le WCT ne porte pas l'effectif :
# c'est le taux de l'ÉQUIPE intervenante, par heure de durée pointée) :
#
#   configuration:
#     taux_horaire_main_d_oeuvre: "0.00"
#
# PLAN T4.16 : cash libre réel et calendrier fiscal. Les DÉCISIONS et les FAITS du propriétaire que M5 ne devine
# jamais sont ABSENTS ici (GATE NATHAN) ; chacun, absent, est « à déclarer » : le cash libre dit « non calculable, manque
# X » et le calendrier fiscal refuse de nommer une échéance. Relu à chaque appel : pas de redémarrage. Forme, sous la
# même clé `configuration` (dates entre guillemets : une date sans guillemets est refusée, jamais réinterprétée) :
#
#   configuration:
#     fiscal:
#       frequence_tps_tvq: "trimestrielle"     # mensuelle, trimestrielle ou annuelle : celle de la confirmation d'inscription
#       mois_fin_exercice: 12                  # 1 à 12 ; exigé pour trimestrielle et annuelle
#       particulier_en_affaires: false         # exigé seulement pour annuelle avec exercice au 31 décembre (30 avril / 15 juin)
#       taxes_remises_jusqu_au: "2026-06-30"   # fin de la dernière période de TPS/TVQ REMISE (fait établi avec le CPA) ;
#                                              # à avancer après chaque remise ; doit être la fin d'une période du calendrier
#     obligations_declarees:                   # ce que rien ne calcule encore (paie, DAS et dettes : M5.4 est absent)
#       paies:    {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       das:      {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       dettes:   {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       reserves: {montant: "0.00", source: "décision de Nathan", au: "2026-09-25"}   # seulement si aucune PROVISION n'est posée
#
# Un « 0.00 » déclaré est un zéro CONNU (avec sa source et sa date) ; une composante absente n'est jamais zéro. Le calendrier
# fiscal lui-même est dans contracts/calendrier_fiscal.v1.yaml (sources officielles citées, à valider par le CPA).
#
# PLAN T4.15-c : factures fournisseur SANS PO (carburant, outils : une dépense que M6 n'a pas commandée). La catégorie de dépense
# est une liste FERMÉE que le propriétaire décide (GATE NATHAN) : ABSENTE ici, la saisie d'une facture sans PO dit « catégories à
# configurer » (REJ-AP-CATEGORIES-A-CONFIGURER) et n'en suppose aucune. Relue à chaque appel. Forme, sous la même clé
# `configuration` (des noms en minuscules, sans espace, de 2 à 32 caractères ; lettres, chiffres et _ ; pas de répétition) :
#
#   configuration:
#     categories_depense_sans_po: [carburant, outils]   # ce sont des EXEMPLES de forme : la liste est celle de Nathan
#
modeles:
  defaut: standard
  extraction: rapide
skills: [tenir-le-registre-financier, gerer-les-approbations-f0-f7]
planifications:
  - nom: digest-financier
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes l'état financier de la veille : solde, cash libre réel (avec ce
      qui manque pour le calculer), demandes d'approbation en attente par palier. Ne
      présente jamais l'argent disponible sans le cash libre. Aucune écriture nouvelle,
      aucune approbation.
budget:
  tokens_jour: 200000
  tokens_mois: 3000000
  alerte_pct: 80
memoire:
  lecture: [mouvements, approbations, taux_fiscaux, calendrier_fiscal]
  ecriture: [mouvements, approbations]
kpis:
  - id: delai_moyen_approbation_f6_f7
    description: Délai moyen entre la création d'une demande F6/F7 et sa décision (approuvée ou refusée).
  - id: taux_mouvements_rejetes
    description: Part des mouvements soumis rejetés par la validation structurelle ou de signe avant écriture.
