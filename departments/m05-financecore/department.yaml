schema: opsys.departement/v1
id: m05-financecore
code: M5
nom: FinanceCore
mission: >-
  Tenir le registre financier de l'entreprise — mouvements, solde, argent disponible,
  taxes TPS/TVQ, approbations F0-F7 — sans jamais engager, payer ou approuver de
  lui-même : toute écriture financière et toute décision d'approbation restent une
  proposition tant qu'un humain ne les a pas validées sur pièces.
outils: m5_financecore.outils
mode: ombre
dependances: [m02-revenue-crm, m03-estimation, m04-field-ops, m06-material-control]
evenements:                                          # ADR-0009 §3, PLAN T1.2-d/T1.3-c/T2.2
  # client réel + brouillon + signal M6 ; PLAN T4.15 : m6.reception_enregistree, ce qui est arrivé d'un PO (l'« à payer
  # attendu » des comptes à payer). M5 ne publie rien de plus : les comptes à payer se lisent (m5_lister_comptes_a_payer).
  consomme: [m2.client_associe, m3.devis_accepte, m4.travaux_termines, m6.variance_chantier, m6.reception_enregistree]
  # PLAN T1.5-d : la marge réelle du chantier (ou ce qui manque pour la chiffrer) atteint M8 et M10. Jamais
  # un prix unitaire, un taux ni une donnée de client ; jamais une marge pour un coût partiel.
  publie: [m5.rentabilite_chantier]
approbations:                                         # ADR-0009 §5, PLAN T1.3-c point 5
  n3: [finance, nathan_owner]
  n4: [finance, nathan_owner]                        # envoi de facture (m5_envoyer_facture)
  # N5 (paiement, m5_enregistrer_paiement_facture) ne se déclare pas : nathan_owner seul, fixé par
  # le socle (ADR-0009 §5).
# PLAN T1.5-d : coût réel d'un chantier. Le taux horaire de la main-d'oeuvre est un chiffre de l'entreprise,
# que M5 ne devine pas : il est donc ABSENT ici, et le coût réel dit « taux horaire à configurer »
# (REJ-COUT-TAUX-HORAIRE-A-CONFIGURER) tant que Nathan ne l'a pas écrit. Pour l'activer, ajouter ce bloc (dollars
# CAD par heure sur site, entre guillemets pour garder les décimales exactes ; le WCT ne porte pas l'effectif :
# c'est le taux de l'ÉQUIPE intervenante, par heure de durée pointée) :
#
#   configuration:
#     taux_horaire_main_d_oeuvre: "0.00"
#
modeles:
  defaut: standard
  extraction: rapide
skills: [tenir-le-registre-financier, gerer-les-approbations-f0-f7]
planifications:
  - nom: digest-financier
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes l'état financier de la veille : solde, argent disponible,
      demandes d'approbation en attente par palier. Aucune écriture nouvelle,
      aucune approbation.
budget:
  tokens_jour: 200000
  tokens_mois: 3000000
  alerte_pct: 80
memoire:
  lecture: [mouvements, approbations, taux_fiscaux]
  ecriture: [mouvements, approbations]
kpis:
  - id: delai_moyen_approbation_f6_f7
    description: Délai moyen entre la création d'une demande F6/F7 et sa décision (approuvée ou refusée).
  - id: taux_mouvements_rejetes
    description: Part des mouvements soumis rejetés par la validation structurelle ou de signe avant écriture.
