schema: opsys.departement/v1
id: m05-financecore
code: M5
nom: FinanceCore
mission: >-
  Tenir le registre financier de l'entreprise — mouvements, solde, cash libre réel (constaté au bus, pour M8, à la
  demande de l'admin), prévision de trésorerie des flux connus et datés, taxes TPS/TVQ et leurs échéances,
  approbations F0-F7 — sans jamais engager, payer ou approuver de lui-même : toute écriture financière et toute
  décision d'approbation restent une proposition tant qu'un humain ne les a pas validées sur pièces.
# Avatar du département (docs/architecture/AVATARS.md) : identité par défaut, personnalisable par client dans
# `entreprise.yaml` (clé `avatars` : nom, voix, visage). `voix` et `visage` sont des identifiants logiques : le registre
# de fournisseurs les résoudra. Seule la messagerie (chat avec l'agent dans l'interface du core) existe aujourd'hui.
avatar:
  nom: Sophie
  role: "Contrôleuse, comptable, fiscaliste et CFO"
  voix: voix.sophie.defaut
  visage: visage.sophie.defaut
  canaux:
    messagerie: disponible
    voix: prevu
    audiovisuel: prevu
outils: m5_financecore.outils
mode: ombre
dependances: [m02-revenue-crm, m03-estimation, m04-field-ops, m06-material-control]
evenements:                                          # ADR-0009 §3, PLAN T1.2-d/T1.3-c/T2.2
  # client réel + brouillon + signal M6 ; PLAN T4.15 : m6.reception_enregistree, ce qui est arrivé d'un PO (l'« à payer
  # attendu » des comptes à payer). Les comptes à payer se lisent (m5_lister_comptes_a_payer).
  # M1.6 / M6.16 : m1.courriel_aiguille (facture de fournisseur reçue par courriel) devient une attente « à saisir », jamais
  # une écriture ; aucun montant n'est lu du courriel.
  # Interconnexion M7 -> M5 (docs/architecture/INTERCONNEXION.md) : m7.depenses_marketing_constatees devient un BROUILLON
  # d'écriture de charge (compte « marketing » du plan, contrepartie Comptes fournisseurs), jamais validé (N4 humain). Les
  # relevés TAXES_INCLUSES et les révisions ultérieures ne créent aucun brouillon : ils sont rangés « à compléter / à revoir ».
  consomme: [m2.client_associe, m3.devis_accepte, m4.travaux_termines, m6.variance_chantier, m6.reception_enregistree,
             m1.courriel_aiguille, m7.depenses_marketing_constatees]
  # PLAN T1.5-d : la marge réelle du chantier (ou ce qui manque pour la chiffrer) atteint M8 et M10. Jamais
  # un prix unitaire, un taux ni une donnée de client ; jamais une marge pour un coût partiel.
  # PLAN T4.19-b : le cash libre constaté (m5.cash_libre_constate) atteint M8, qui l'affiche dans la vue exécutive. Les
  # montants tels que le calcul de M5 les rend, chaque composante avec sa source et sa fraîcheur, ou « non calculable,
  # manque X » avec des codes ; jamais un texte saisi par le propriétaire ni une donnée de client. Il part quand l'admin
  # fait constater le cash libre (m5_constater_cash_libre, T1), pas à chaque lecture de m5_etat_tresorerie.
  # Opérations comptables (docs/architecture/M5-SOPHIE.md, catalogue src/opsys/evenements/catalogue/) : m5.creance_relance_preparee
  # (brouillon de relance, pour M2 ; rien n'est envoyé), m5.mesures_comptables_constatees (nombres et montants comptés par le
  # code, pour M8), m5.rapprochement_po_constate (facture fournisseur contre la commande réceptionnée, pour M6),
  # m5.dossier_cpa_scelle (dossier de période scellé, pour M10). Aucun ne porte de nom, de libellé ni de texte libre ; les
  # consommateurs (M2, M8, M6, M10) les déclarent dans leur propre `evenements.consomme`.
  publie: [m5.rentabilite_chantier, m5.cash_libre_constate, m5.creance_relance_preparee, m5.mesures_comptables_constatees,
           m5.rapprochement_po_constate, m5.dossier_cpa_scelle,
           m5.depense_publicitaire_constatee, m5.facture_emise_constatee]
approbations:                                         # ADR-0009 §5, PLAN T1.3-c point 5
  n3: [finance, nathan_owner]
  n4: [finance, nathan_owner]                        # envoi de facture (m5_envoyer_facture), correction et annulation d'une
                                                     # facture fournisseur (m5_corriger_..., m5_annuler_..., T4.15-c)
  # N5 (paiement, m5_enregistrer_paiement_facture) ne se déclare pas : nathan_owner seul, fixé par
  # le socle (ADR-0009 §5).
# PLAN T1.5-d : coût réel d'un chantier. Le taux horaire de la main-d'oeuvre est un chiffre de l'entreprise,
# que M5 ne devine pas : il est donc ABSENT ici, et le coût réel dit « taux horaire à configurer »
# (REJ-COUT-TAUX-HORAIRE-A-CONFIGURER) tant que Nathan ne l'a pas écrit. Pour l'activer, ajouter ce bloc (dollars
# CAD par heure sur site, entre guillemets pour garder les décimales exactes ; le WCT ne porte pas l'effectif :
# c'est le taux de l'ÉQUIPE intervenante, par heure de durée pointée) :
#
#   configuration:
#     taux_horaire_main_d_oeuvre: "0.00"
#
# PLAN T4.16 : cash libre réel et calendrier fiscal. Les DÉCISIONS et les FAITS du propriétaire que M5 ne devine
# jamais sont ABSENTS ici (GATE NATHAN) ; chacun, absent, est « à déclarer » : le cash libre dit « non calculable, manque
# X » et le calendrier fiscal refuse de nommer une échéance. Relu à chaque appel : pas de redémarrage. Forme, sous la
# même clé `configuration` (dates entre guillemets : une date sans guillemets est refusée, jamais réinterprétée) :
#
#   configuration:
#     fiscal:
#       frequence_tps_tvq: "trimestrielle"     # mensuelle, trimestrielle ou annuelle : celle de la confirmation d'inscription
#       mois_fin_exercice: 12                  # 1 à 12 ; exigé pour trimestrielle et annuelle
#       particulier_en_affaires: false         # exigé seulement pour annuelle avec exercice au 31 décembre (30 avril / 15 juin)
#       taxes_remises_jusqu_au: "2026-06-30"   # fin de la dernière période de TPS/TVQ REMISE (fait établi avec le CPA) ;
#                                              # à avancer après chaque remise ; doit être la fin d'une période du calendrier
#     obligations_declarees:                   # ce que rien ne calcule encore (paie, DAS et dettes : M5.4 est absent)
#       paies:    {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       das:      {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       dettes:   {montant: "0.00", source: "d'où vient le chiffre", au: "2026-09-25"}
#       reserves: {montant: "0.00", source: "décision de Nathan", au: "2026-09-25"}   # seulement si aucune PROVISION n'est posée
#     calendrier_obligations:                   # exemple de forme fictif, à remplacer; absent, l'outil dit ce qui manque
#       paies:                                  # idem das / dettes; compléter depuis la source propre à la période
#         autorite: "autorité émettrice de la règle ou de l'avis"
#         periode_debut: "2026-09-01"
#         periode_fin: "2026-09-30"
#         echeance_source: "référence/URL/document qui établit l'échéance"
#         source_consultee_le: "2026-09-30"
#         source_applicable_du: "2026-01-01"
#         source_applicable_jusqu_au: "2026-12-31"
#         annee: 2026
#         version: "version réellement indiquée par la source"
#       # l'échéance elle-même reste dans prevision.echeances_obligations.<id> (date explicite, déjà consommée par la prévision)
#       # elle ne prouve ni paiement ni production; une période passée est « à vérifier ».
#
# Un « 0.00 » déclaré est un zéro CONNU (avec sa source et sa date) ; une composante absente n'est jamais zéro. Le calendrier
# fiscal lui-même est dans contracts/calendrier_fiscal.v1.yaml (sources officielles citées, à valider par le CPA).
#
# PLAN T4.15-c : factures fournisseur SANS PO (carburant, outils : une dépense que M6 n'a pas commandée). La catégorie de dépense
# est une liste FERMÉE que le propriétaire décide (GATE NATHAN) : ABSENTE ici, la saisie d'une facture sans PO dit « catégories à
# configurer » (REJ-AP-CATEGORIES-A-CONFIGURER) et n'en suppose aucune. Relue à chaque appel. Forme, sous la même clé
# `configuration` (des noms en minuscules, sans espace, de 2 à 32 caractères ; lettres, chiffres et _ ; pas de répétition) :
#
#   configuration:
#     categories_depense_sans_po: [carburant, outils]   # ce sont des EXEMPLES de forme : la liste est celle de Nathan
#
# PLAN T4.16-d : prévision de trésorerie (M5.7). Aucune échéance de paiement n'est enregistrée sur les factures (clients ni
# fournisseurs) : la date d'un encaissement ou d'un décaissement est la date de la pièce PLUS un délai que le propriétaire
# décide (GATE NATHAN). Tout ce qui suit est ABSENT ici, et chaque absence est dite : sans horizon, la prévision est refusée
# (REJ-PREVISION-HORIZON-A-CONFIGURER) ; sans délai ou sans date de sortie, les flux concernés sont « non calculables à
# partir de la semaine X, manque Y » ; sans seuil, « seuil à configurer » et aucune alerte. Relu à chaque appel. Forme, sous
# la même clé `configuration` (dates entre guillemets ; ce sont des EXEMPLES de forme, jamais des valeurs à recopier) :
#
#   configuration:
#     prevision:
#       horizon_semaines: 13                     # 1 à 26 : la durée de la prévision, décidée par le propriétaire
#       seuil_alerte: {montant: "0.00", source: "décision de Nathan", au: "2026-09-25"}   # alerte si le solde de fin de semaine passe SOUS
#       delai_encaissement_clients_jours: 30     # 0 à 365 : jours entre l'envoi d'une facture client et son encaissement
#       delai_paiement_fournisseurs_jours: 30    # 0 à 365 : jours entre la date d'une facture (ou la première réception d'un PO non
#                                                # facturé) et son paiement
#       echeances_obligations:                   # quand sort l'argent des obligations déclarées (obligations_declarees, plus haut)
#         paies: "2026-10-09"
#         das: "2026-10-15"
#         dettes: "2026-10-31"
#
# La prévision ne projette rien : ni vente à venir, ni retard de client, ni moyenne. Ce qui n'est pas connu n'y est pas.
#
# Grand livre (tranche 1, docs/grand-livre.md) : le plan comptable par défaut est contracts/plan_comptable_pme_qc.v1.yaml.
# Le client l'ÉTEND sous la même clé `configuration` (relu à chaque appel ; un compte désactivé reste lisible, mais
# aucune nouvelle écriture ne le mouvemente ; une extension invalide est refusée en entier, REJ-GL-PLAN-INVALIDE). Forme
# (EXEMPLES fictifs ; numéros à quatre chiffres : 1xxx actif, 2xxx passif, 3xxx capitaux, 4xxx produits, 5-9xxx charges) :
#
#   configuration:
#     grand_livre:
#       comptes_ajoutes:
#         - {numero: "5450", nom: "Location d'équipement", type: charges}
#       comptes_desactives: ["5600"]
#       correspondance_charges:                  # compte de charge des factures fournisseurs (défaut : le plan versionné)
#         categories_depense: {location: "5450"} # ajoute ou redirige une catégorie de categories_depense_sans_po
#       categories_depense_retirees: [marketing] # ses factures n'auront plus de brouillon (REJ-GL-CATEGORIE-SANS-COMPTE)
#
# Opérations comptables (outils_operations.py, outils_bancaire.py) : ce que le PROPRIÉTAIRE décide, jamais supposé (GATE NATHAN).
# Absent, l'outil concerné dit quoi déclarer (REJ-OPS-CONFIGURATION-A-DECLARER, REJ-OPS-COMPTE-A-DECLARER) ; relu à chaque appel.
# Forme, sous la même clé `configuration` (EXEMPLES de forme fictifs, jamais des valeurs à recopier) :
#
#   configuration:
#     operations:
#       relances:                                    # m5_preparer_relances_clients
#         delai_echeance_jours: 30                   # 0 à 365 : jours entre l'envoi d'une facture et son échéance
#         paliers_jours_apres_echeance: [7, 21, 45]  # 1 à 4 entiers croissants : jours de retard de chaque relance
#       compte_remboursement_employes: "2200"        # un compte de PASSIF du plan : ce que l'entreprise doit aux employés
#       rapprochement:                               # m5_preparer_rapprochement_bancaire
#         motifs_frais: ["frais mensuels"]           # libellés bancaires reconnus comme frais (jamais supposés)
#         compte_frais_bancaires: "5800"             # exigé dès que des motifs sont déclarés
#
# Rien de tout cela n'est un taux ni une règle fiscale : ce sont des décisions d'exploitation de l'entreprise.
modeles:
  defaut: standard
  extraction: rapide
skills: [tenir-le-registre-financier, gerer-les-approbations-f0-f7]
planifications:
  - nom: digest-financier
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes l'état financier de la veille : solde, cash libre réel (avec ce
      qui manque pour le calculer), demandes d'approbation en attente par palier. Ne
      présente jamais l'argent disponible sans le cash libre. Aucune écriture nouvelle,
      aucune approbation.
budget:
  tokens_jour: 200000
  tokens_mois: 3000000
  alerte_pct: 80
memoire:
  lecture: [mouvements, approbations, taux_fiscaux, calendrier_fiscal]
  ecriture: [mouvements, approbations]
kpis:
  - id: delai_moyen_approbation_f6_f7
    description: Délai moyen entre la création d'une demande F6/F7 et sa décision (approuvée ou refusée).
  - id: taux_mouvements_rejetes
    description: Part des mouvements soumis rejetés par la validation structurelle ou de signe avant écriture.
