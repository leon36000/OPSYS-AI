# Base de règles fiscales versionnée par date d'effet (M5, docs/architecture/BASE-FISCALE.md).
#
# STATUT HONNÊTE : toutes les valeurs ci-dessous sont des BROUILLONS migrés des constantes du dépôt (taux_fiscaux.v1.yaml,
# cotisations_rrq_regulieres.py, cotisations_rqap_ae_2026.py, impot_quebec_regulier.py, impot_federal_qc_2026.py), sans
# aucun réviseur : « 0 valeur approuvée ». Le mode « officiel » les refuse toutes ; le mode « essai » les sert en se
# marquant. Les paramètres `non_renseigne` n'ont PAS de valeur : une source officielle est requise (CPA).
#
# GOUVERNANCE : `approuve` = deux réviseurs DISTINCTS (≠ de l'auteur de la saisie), dont la revue porte l'empreinte
# COURANTE du paramètre. Modifier une valeur, une date ou une source change l'empreinte et fait tomber les revues.
# Empreintes attendues : python -m m5_financecore.base_fiscale empreintes <fichier> ; contrôle : ... verifier <fichier>.
# Ne pas éditer à la main sans recalculer l'empreinte ET refaire les revues (le chargeur refuse sinon).
