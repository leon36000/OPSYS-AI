# Calendrier fiscal versionné et sourcé : échéances de production et de paiement de la TPS et de la TVQ
# (PLAN T4.16, M5.5 « calendrier fiscal vivant »). Même patron que taux_fiscaux.v1.yaml : une année déclarée,
# ses sources officielles citées (organisme, adresse, date de consultation), une version.
#
# RÈGLES DE LECTURE (calendrier_fiscal.py) :
# - Une année absente de ce fichier est REFUSÉE (REJ-CALENDRIER-ANNEE-NON-DECLAREE), jamais complétée par une
#   date calculée ou supposée. L'année d'un tableau est celle de la FIN de la période de déclaration : les
#   périodes qui se terminent en 2026 (échéances de 2026 et du début de 2027) sont dans l'année 2026.
# - Les dates sont TRANSCRITES des tableaux de Revenu Québec, jamais calculées ici : les jours fériés et la
#   période des Fêtes déplacent l'échéance (ex. novembre 2026 : 2027-01-05), et la règle de report est celle de
#   l'administration fiscale, pas la nôtre. `limite_production` est la même date que `limite_paiement`, sauf pour
#   un particulier en affaires à période annuelle et exercice au 31 décembre (paiement le 30 avril, production
#   le 15 juin : Revenu Québec, « Périodes de déclaration »), où les deux dates sont écrites.
# - La FRÉQUENCE de production de l'entreprise (mensuelle, trimestrielle ou annuelle), son mois de fin d'exercice
#   et son statut de particulier ne sont PAS ici : ce sont des décisions du propriétaire (GATE NATHAN), lues dans
#   department.yaml (configuration.fiscal). Sans elles, aucune échéance n'est nommée.
# - Hors de ce fichier, faute de donnée : acomptes provisionnels de TPS/TVQ d'un inscrit à période annuelle
#   (quatre versements, montants et dates propres à l'entreprise), acomptes provisionnels d'impôt, DAS, T4 et
#   RL-1, CNESST. Aucune de ces dates n'est supposée ; le CPA les fournit.
#
# STATUT : source_officielle_consultee, A VALIDER PAR LE CPA (T3). Aucune date n'est confirmée par un
# professionnel ; le calendrier propose, il ne dépose rien, ne paie rien et ne remet rien.
