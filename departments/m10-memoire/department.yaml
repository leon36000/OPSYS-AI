schema: opsys.departement/v1
id: m10-memoire
code: M10
nom: Mémoire
mission: >-
  Ne rien oublier de ce qui compte et ne jamais écraser une vérité en silence : consommer les
  Work Completion Trigger de M4 sans jamais recalculer leur preuve, journaliser toute décision
  avec sa raison obligatoire (statut toujours calculé par relecture de la chaîne), signaler les
  révisions sans jamais fusionner ni muter un maillon existant, et vérifier avant toute action
  qu'un dossier de contexte est suffisant (PREFLIGHT) — en traçant le refus plutôt qu'en
  interrompant l'appelant.
# Avatar du département (docs/architecture/AVATARS.md) : identité par défaut, personnalisable par client dans
# `entreprise.yaml` (clé `avatars` : nom, voix, visage). `voix` et `visage` sont des identifiants logiques : le registre
# de fournisseurs les résoudra. Seule la messagerie (chat avec l'agent dans l'interface du core) existe aujourd'hui.
avatar:
  nom: Mnémo
  role: "Mémoire, connaissances et apprentissage"
  voix: voix.mnemo.defaut
  visage: visage.mnemo.defaut
  canaux:
    messagerie: disponible
    voix: prevu
    audiovisuel: prevu
outils: m10_memoire.outils
mode: ombre
dependances: []
modeles:
  defaut: standard
skills: [journaliser-une-decision, preflight-contexte-suffisant, traiter-un-signal-critique, gerer-les-connaissances,
  gerer-le-soi-et-le-graphe]
planifications:
  - nom: digest-memoire
    cron: "0 7 * * 1-5"
    consigne: >-
      Résume en 5 lignes l'activité de la veille des deux registres : décisions journalisées
      (par statut), révisions signalées vs arbitrées, refus de préflight tracés. Ne journalise
      aucune décision, ne signale aucune révision.
  - nom: consolidation-nocturne
    cron: "0 3 * * *"
    consigne: >-
      Pour chaque affaire (lead_id) ayant reçu au moins un événement (lead qualifié, client
      associé, devis accepté ou sans réponse, WCT, variance matériaux ou rentabilité) la veille,
      appelle m10_consolider_affaire(affaire_id, jour=<veille AAAA-MM-JJ>,
      horodatage=<maintenant>) — jamais de résumé calculé par toi-même, l'outil condense
      déterministiquement et cite ses sources. Idempotente : un jour déjà consolidé pour une
      affaire ne crée rien de plus, relance sans crainte celles qui restent incertaines.
  - nom: mnemo-quotidien
    cron: "17 4 * * *"
    consigne: >-
      Mnémo, travail interne seulement (N0 à N2) : appelle m10_construire_soi, puis m10_synchroniser_graphe, puis
      m10_extraire_lecons, puis m10_surveiller_lecons. Ne confirme rien, ne rejette rien, ne promeus aucune leçon : ce sont des
      décisions humaines. Rapporte seulement ce que les outils rendent (énoncés proposés, révisions à trancher, arêtes en attente de
      confirmation, leçons proposées, leçons promues qui régressent) pour que la direction les voie ; un chiffre vient de l'outil,
      jamais de toi. Si un outil refuse, dis son code et arrête.
budget:
  tokens_jour: 200000
  tokens_mois: 2500000
  alerte_pct: 80
memoire:
  lecture: [registre_evenements, registre_affaires, registre_faits_analytiques, registre_soi, registre_lecons]
  ecriture: [registre_evenements, registre_affaires, registre_references_configuration, registre_faits_analytiques,
    registre_soi, registre_lecons]
kpis:
  - id: taux_revisions_arbitrees
    description: Part des révisions signalées ayant reçu au moins un arbitrage humain consigné.
  - id: taux_preflight_insuffisant
    description: Part des dossiers de contexte soumis au préflight jugés insuffisants (refus tracés).
  - id: nb_references_forgees_detectees
    description: Nombre de ReferenceMemoireM10 rejetées par m10_verifier_reference (registre, ligne_id ou hash_tete incohérents).
  - id: nb_affaires_consolidees_jour
    description: Nombre d'affaires distinctes ayant reçu un nouveau fait consolidé (ecrit=true) lors du dernier cycle de consolidation nocturne.
  - id: nb_oublis_detectes_audit
    description: Nombre de faits attendus (WCT, variance, rentabilité, amont de l'affaire) sans trace trouvée au registre Événements lors du dernier audit non-oubli.
# PLAN T1.2-c : M10 consomme la fin de travaux de M4 par le bus d'événements du socle (ADR-0009
# §3) et mémorise le WCT au registre Événements (voir consommateurs() dans outils.py, logique
# existante memoriser_wct). Catalogue : src/opsys/evenements/catalogue/m4.travaux_termines.json.
# PLAN T3.3 : M10 consomme aussi la variance matériaux de M6 (catalogue existant, stable :
# src/opsys/evenements/catalogue/m6.variance_chantier.json), mémorisée au même registre Événements
# (variance.py, distinguée du WCT à la lecture par classification.py) — alimente les paquets de
# contexte en couches (paquets.py), la consolidation nocturne (consolidation.py) et l'audit
# « non-oubli » (audit.py).
# PLAN T1.5-d : M10 consomme aussi la rentabilité d'un chantier de M5 (catalogue socle :
# src/opsys/evenements/catalogue/m5.rentabilite_chantier.json), mémorisée au même registre Événements
# (rentabilite.py) au niveau FINANCIAL : la leçon « marge réelle contre marge prévue » se lit ici et chez M5,
# et ne sort dans aucun paquet de contexte (confidentialite.py).
# PLAN T4.18 : M10 consomme aussi l'AMONT d'une affaire (catalogue socle : m1.lead_qualifie, m2.client_associe,
# m3.devis_accepte, m3.devis_sans_reponse), mémorisé au même registre Événements (etapes.py, amont.py) : des
# identifiants et des faits d'étape, jamais le contact du lead ni un texte de client (Loi 25) ; le client associé
# est CLIENT_PRIVATE (M1 et M2 seulement) ; le prix et le coût d'un devis accepté sont FINANCIAL, hors de tout
# paquet. `m3.devis_envoye` (T4.7) : l'envoi approuvé par le propriétaire, sans montant.
# M8.18 : M10 consomme aussi les faits analytiques consolidés de M8 (`m8.fait_consolide`, catalogue socle) : les mesures
# d'entreprise avec leur provenance, mémorisées au registre `faits_analytiques` (FINANCIAL, hors de tout paquet de contexte),
# avec les changements de définition et les anomalies. Rien de personnel n'y voyage.
# Mnémo (docs/architecture/M10-SOI-GRAPHE.md) : après avoir mémorisé WCT, variance matériaux et client associé, M10 nourrit aussi
# le graphe de connaissances d'entités (brouillon d'arête ; une arête SENSIBLE attend la confirmation d'une personne).
# `m2.profil_propriete_confirme` (client_id, propriete_id : des pseudonymes, jamais l'adresse) ne nourrit QUE le graphe.
# M10 publie : la révision proposée d'un énoncé confirmé du modèle de soi, la décision humaine sur une leçon apprise, et
# l'arête sensible en attente de confirmation. Aucune donnée personnelle ni contenu d'énoncé n'y voyage.
evenements:
  publie: [m10.soi_revision_proposee, m10.lecon_decidee, m10.arete_en_attente]
  consomme:
    - m8.fait_consolide
    - m3.catalogue_reference
    - m6.catalogue_reference
    - m4.travaux_termines
    - m6.variance_chantier
    - m5.rentabilite_chantier
    - m1.lead_qualifie
    - m2.client_associe
    - m2.contact_corrige
    - m6.note_commande_referencee
    - m3.devis_envoye
    - m3.devis_accepte
    - m3.devis_sans_reponse
    - m2.profil_propriete_confirme
