# Corpus de mesure de Mnémo (graphe de connaissances et leçons) — opsys.mnemo.corpus/v1.
# Rédigé à la main AVANT exécution. Données FICTIVES : entreprise inventée, aucun nom de personne, aucune coordonnée.
# Les clients et les propriétés s'écrivent ici par un nom court (c1, p1) ; le banc en tire un pseudonyme hexadécimal stable.
#
# CE QUE CE CORPUS MESURE : l'exactitude du MOTEUR de requête (parcours, validité dans le temps, états des arêtes, schéma) sur
# des questions dont le PLAN est écrit à la main. Il ne mesure PAS la compréhension du langage naturel : aucun modèle n'y
# intervient, la colonne `question` n'est lue que par des humains. Un score élevé prouve la plomberie, pas la qualité d'un agent.
