schema: opsys.departement/v1
id: m09-strategic-intelligence
code: M9
nom: Strategic Intelligence
mission: >-
  Tenir l'état consolidé factuel de l'entreprise (Business State Graph) à partir des
  snapshots que les autres modules lui rapportent : le dernier fait connu par module, calculé
  par relecture chronologique pure de la chaîne (jamais une comparaison alphabétique des
  horodatages), et toute contradiction interne signalée nommément — sans jamais inventer un
  chiffre, sans jamais recommander ni décider (v1 est un harnais pur, zéro contenu
  délibératif). Assemble aussi, pour un instant de référence fourni, le briefing du matin
  (décisions en attente de la file du propriétaire, alertes proposées par M8 reçues du bus,
  faits de la veille, manques) : un gabarit déterministe et sourcé, jamais une rédaction, borné
  sous la limite de sortie du socle (« N autres éléments non affichés », et comment les lire).
  Lit les alertes de mesure de chantier de M8 et en donne une lecture qui cite ses preuves
  (identifiants des métriques) sans jamais décider : la décision revient au propriétaire.
outils: m9_strategic_intelligence.outils
mode: ombre
dependances: [m08-analytics, m10-memoire]
modeles:
  defaut: standard
skills: [etat-consolide-et-contradictions, briefing-du-matin]
planifications:
  - nom: briefing-du-matin
    cron: "0 7 * * 1-5"
    consigne: >-
      Assemble le briefing du matin (m9_produire_briefing_matin, maintenant = l'heure réelle de
      déclenchement de la planification) : décisions en attente, alertes M8 du jour, faits de la
      veille, manques. N'ingère aucun nouveau snapshot, ne rédige aucun diagnostic ni
      recommandation — présente les quatre sections telles quelles, une section vide reste vide.
budget:
  tokens_jour: 200000
  tokens_mois: 2500000
  alerte_pct: 80
memoire:
  lecture: [snapshots_modules, memoire_m10]
  ecriture: [snapshots_modules, etat_consolide]
evenements:
  consomme: [m8.alerte_proposee]
configuration:
  # Jours d'alertes M8 relus par le briefing du matin, jour du briefing compris (PLAN T1.5-d). Une alerte
  # de mesure de chantier porte l'instant du chantier : fini le vendredi à 15 h, il doit encore paraître le
  # lundi à 7 h (3 jours couvrent la fin de semaine). 0 : le jour même seulement. Réglage d'affichage, pas
  # un seuil d'affaires ; absent ou invalide, le briefing retombe sur 0.
  fenetre_alertes_jours: 3
kpis:
  - id: taux_contradictions_non_arbitrees
    description: Part des contradictions internes détectées sans arbitrage humain consigné dans M10.
  - id: taux_rejet_structurel_rapport
    description: Part des rapports stratégiques soumis rejetés pour clé manquante ou en trop.
  - id: nb_modules_a_jour
    description: Nombre de module_source ayant un fait dans l'état consolidé (couverture de la vérité factuelle).
  - id: taux_sections_briefing_vides
    description: >-
      Part des quatre sections du dernier briefing du matin produites vides (aucune décision en
      attente, aucune alerte M8 du jour, aucun fait de la veille) — jamais remplies par défaut.
