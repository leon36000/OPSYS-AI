schema: opsys.departement/v1
id: m09-strategic-intelligence
code: M9
nom: Strategic Intelligence
mission: >-
  Tenir l'état consolidé factuel de l'entreprise (Business State Graph) à partir des
  snapshots que les autres modules lui rapportent : le dernier fait connu par module, calculé
  par relecture chronologique pure de la chaîne (jamais une comparaison alphabétique des
  horodatages), et toute contradiction interne signalée nommément — sans jamais inventer un
  chiffre, sans jamais recommander ni décider (v1 est un harnais pur, zéro contenu
  délibératif). Assemble aussi, pour un instant de référence fourni, le briefing du matin
  (décisions en attente de la file du propriétaire, alertes proposées par M8 reçues du bus,
  faits de la veille, manques) : un gabarit déterministe et sourcé, jamais une rédaction, borné
  sous la limite de sortie du socle (« N autres éléments non affichés », et comment les lire).
  Lit les alertes de mesure de chantier de M8 et en donne une lecture qui cite ses preuves
  (identifiants des métriques) sans jamais décider : la décision revient au propriétaire.
# Avatar du département (docs/architecture/AVATARS.md) : identité par défaut, personnalisable par client dans
# `entreprise.yaml` (clé `avatars` : nom, voix, visage). `voix` et `visage` sont des identifiants logiques : le registre
# de fournisseurs les résoudra. Seule la messagerie (chat avec l'agent dans l'interface du core) existe aujourd'hui.
avatar:
  nom: Athéna
  role: "Direction stratégique et conseil"
  voix: voix.athena.defaut
  visage: visage.athena.defaut
  canaux:
    messagerie: disponible
    voix: prevu
    audiovisuel: prevu
outils: m9_strategic_intelligence.outils
mode: ombre
dependances: [m08-analytics, m10-memoire]
modeles:
  defaut: standard
skills: [etat-consolide-et-contradictions, briefing-du-matin, lecture-direction, conseil-gouverne, memoire-strategique]
planifications:
  - nom: briefing-du-matin
    cron: "0 7 * * 1-5"
    consigne: >-
      Assemble le briefing du matin (m9_produire_briefing_matin, maintenant = l'heure réelle de
      déclenchement de la planification) : décisions en attente, alertes M8 du jour, faits de la
      veille, manques. N'ingère aucun nouveau snapshot, ne rédige aucun diagnostic ni
      recommandation — présente les quatre sections telles quelles, une section vide reste vide.
budget:
  tokens_jour: 200000
  tokens_mois: 2500000
  alerte_pct: 80
memoire:
  lecture: [snapshots_modules, memoire_m10]
  ecriture: [snapshots_modules, etat_consolide]
evenements:
  # Interconnexion (docs/architecture/INTERCONNEXION.md) : m7.anomalie_depense_detectee (règle transparente de dépense
  # publicitaire déclenchée) et m8.fait_consolide (RÉSUMÉ de la consolidation des mesures : comptes et identifiants, aucune
  # valeur) alimentent la section `signaux_de_gestion` du briefing du matin. M9 lit, ne décide pas.
  consomme: [m8.alerte_proposee, m8.snapshot_chantier, m7.anomalie_depense_detectee, m8.fait_consolide]
  # Athéna : chaque entrée de la boucle « décision → résultat mesuré → leçon » est publiée pour la mémoire de M10
  # (`m9.fait_strategique`, un maillon = un événement, FINANCIAL côté M10). Aucune leçon n'y est une cause.
  publie: [m9.fait_strategique]
configuration:
  # Jours d'alertes M8 relus par le briefing du matin, jour du briefing compris (PLAN T1.5-d). Une alerte
  # de mesure de chantier porte l'instant du chantier : fini le vendredi à 15 h, il doit encore paraître le
  # lundi à 7 h (3 jours couvrent la fin de semaine). 0 : le jour même seulement. Réglage d'affichage, pas
  # un seuil d'affaires ; absent ou invalide, le briefing retombe sur 0.
  fenetre_alertes_jours: 3
  # Seuils du radar de risques (M9.12) : VIDES à dessein — aucune valeur n'est inventée. La direction les déclare depuis
  # l'écran « Réglages de direction » (bloc `reglages:` ci-dessous) ; tant qu'un seuil manque, la règle correspondante
  # est « non évaluée » et le dit (jamais « aucun risque »).
  radar: {}
# Réglages de direction (CFG-1, docs/architecture/REGLAGES-DIRECTION.md) : les seuils que le radar de risques de M9 lit par la
# couche unique `opsys.reglages.lecture.superposer`. Aucune proposition : aucune source écrite ne fournit de valeur.
reglages:
  - cle: m9.plaintes_seuil_nombre
    libelle: "Nombre de plaintes déclarées dans la période lue qui déclenche un risque"
    chemin: configuration.radar.plaintes_seuil_nombre
    type: entier
    unite: "plaintes"
    min: 1
    max: 1000
    niveau: N3
    debloque: >-
      Débloque la règle « plaintes_afflux » du radar de risques (m9_radar_risques) : sans ce seuil, les plaintes de M1 ne sont pas évaluées.
  - cle: m9.capacite_utilisation_seuil_pct
    libelle: "Part des heures de quart déclarées d'une équipe déjà planifiée qui déclenche un risque de surcharge"
    chemin: configuration.radar.capacite_utilisation_seuil_pct
    type: decimal
    unite: "%"
    min: "1"
    max: "300"
    niveau: N3
    debloque: >-
      Débloque la règle « capacite_surcharge_cedule » du radar : heures planifiées d'une équipe face à ses heures de quart déclarées (M4).
  - cle: m9.depense_marketing_plafond_cad
    libelle: "Plafond de dépense marketing pour la période lue de M7"
    chemin: configuration.radar.depense_marketing_plafond_cad
    type: decimal
    unite: "CAD"
    min: "1"
    max: "10000000"
    niveau: N3
    debloque: >-
      Débloque la règle « depense_marketing_plafond » du radar : dépense marketing établie par M7 pour la période lue.
  - cle: m9.leads_plancher_par_semaine
    libelle: "Nombre de leads par semaine sous lequel la borne haute de la prévision de M2 signale une baisse"
    chemin: configuration.radar.leads_plancher_par_semaine
    type: entier
    unite: "leads/semaine"
    min: 1
    max: 100000
    niveau: N3
    debloque: >-
      Débloque la règle « leads_sous_plancher » du radar : borne haute de la prévision par intervalle de M2 face à ce plancher.
  - cle: m9.estimation_ecart_relatif_max
    libelle: "Dépassement relatif de la durée estimée (0,25 = 25 %) qui signale une erreur d'estimation"
    chemin: configuration.radar.estimation_ecart_relatif_max
    type: decimal
    unite: "fraction"
    min: "0.01"
    max: "10"
    niveau: N3
    debloque: >-
      Débloque la règle « estimation_ecart_main_doeuvre » du radar : durée réelle contre durée estimée de M3 (0.25 = 25 %).
  - cle: m9.retard_chantier_jours
    libelle: "Nombre de jours de report d'un chantier qui en fait un retard prolongé"
    chemin: configuration.radar.retard_chantier_jours
    type: entier
    unite: "jours"
    min: 1
    max: 365
    niveau: N3
    debloque: >-
      Débloque la règle « chantier_retard_prolonge » du radar : ancienneté d'un report d'intervention chez M4.
  - cle: m9.donnees_perimees_jours
    libelle: "Âge, en jours, au-delà duquel une lecture n'est plus considérée à jour"
    chemin: configuration.radar.donnees_perimees_jours
    type: entier
    unite: "jours"
    min: 1
    max: 365
    niveau: N3
    debloque: >-
      Débloque la règle « donnees_perimees » du radar : âge maximal d'une lecture de producteur avant d'être dite périmée.
  - cle: m9.cash_libre_plancher_cad
    libelle: "Cash libre minimal toléré (en dessous, un risque est signalé)"
    chemin: configuration.radar.cash_libre_plancher_cad
    type: decimal
    unite: "CAD"
    min: "1"
    max: "100000000"
    niveau: N3
    debloque: >-
      Débloque la règle « cash_libre_sous_plancher » du radar : cash libre constaté par M5 sous ce plancher (un déficit est signalé sans réglage).
  - cle: m9.multiple_seuil_critique
    libelle: "Multiple d'un seuil à partir duquel un dépassement est dit critique (escalade interne)"
    chemin: configuration.radar.multiple_seuil_critique
    type: decimal
    unite: "× le seuil"
    min: "1.1"
    max: "10"
    niveau: N3
    debloque: >-
      Débloque l'escalade interne : un dépassement n'est dit critique (avis, tâche, mémoire) qu'à ce multiple du seuil déclaré. Sans lui, aucune escalade par dépassement.
kpis:
  - id: taux_contradictions_non_arbitrees
    description: Part des contradictions internes détectées sans arbitrage humain consigné dans M10.
  - id: taux_rejet_structurel_rapport
    description: Part des rapports stratégiques soumis rejetés pour clé manquante ou en trop.
  - id: nb_modules_a_jour
    description: Nombre de module_source ayant un fait dans l'état consolidé (couverture de la vérité factuelle).
  - id: taux_sections_briefing_vides
    description: >-
      Part des quatre sections du dernier briefing du matin produites vides (aucune décision en
      attente, aucune alerte M8 du jour, aucun fait de la veille) — jamais remplies par défaut.
