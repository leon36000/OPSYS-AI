# Configuration SonarCloud (Automatic Analysis).
#
# sonar.cpd.exclusions : la détection de COPIE (CPD) est désactivée sur les
# SEULS utilitaires de socle des modules — encodage, horodatage, verdicts,
# registre, adaptateurs, fixtures_garde. POURQUOI : leur duplication entre
# modules est une DÉCISION D'ARCHITECTURE RATIFIÉE (architecture M4 §copié-
# adapté, chore #109) : chaque module porte une identité de paquet isolée et
# n'importe JAMAIS depuis un module voisin — un import croisé recréerait la
# collision d'identités que #109 a éliminée (21 tests exerçant le mauvais
# arbre, mesuré). Chaque copie est revue et mutée dans SON module.
# Sans cette exclusion, le gate Sonar échouait mécaniquement à chaque nouveau
# module (14 % de duplication sur M4-S001, PR #136) : un check rouge en
# permanence détruit le signal (leçon issue #110). La détection de duplication
# reste ACTIVE partout ailleurs — dans la logique métier, une copie reste un
# défaut à signaler.
# Motifs en ** (revue r1) : indépendants de la profondeur d'arborescence — l'exclusion
# est par NOM DE FICHIER de socle sous « Modules M », ce qui ne peut couvrir aucune
# logique métier (les fichiers métier portent d'autres noms). L'espace dans « Modules M »
# est littéral (le séparateur de motifs est la virgule). Vérification EMPIRIQUE actée :
# la condition duplication du prochain PR de socle M4 (S002, registre copié-adapté) doit
# passer — sinon cette exclusion sera corrigée sur mesure, pas sur hypothèse.
sonar.cpd.exclusions=Modules M/**/encodage.py,Modules M/**/horodatage.py,Modules M/**/verdicts.py,Modules M/**/registre.py,Modules M/**/adaptateurs.py,Modules M/**/fixtures_garde.py
