# Premier pack sectoriel : rénovation extérieure au Québec (Gouttières et Revêtements Synergy, premier client).
# C'est ce qui était écrit en dur dans le cœur (SOUL.md, catalogue de services de `opsys.taxonomie`, météo par service,
# calendrier saisonnier de M7) : ici, il a un nom, une version et une empreinte. Les données sont FICTIVES ou à fournir
# par l'entreprise ; aucune valeur de barème n'est inventée (docs/architecture/PACKS-SECTORIELS.md).
# Après toute modification : `opsys-metier pack empreinte renovation-exterieure-qc --ecrire`, puis revue du diff.
schema: opsys.pack/v1
id: renovation-exterieure-qc
version: 1.0.0
nom: Rénovation extérieure (Québec)
langue: fr-CA
description: >-
  Entreprise de rénovation extérieure au Québec : gouttières et descentes, revêtement extérieur, soffite et fascia,
  réparation. Services, vocabulaire et blocs de prompt du premier client ; les barèmes sont à fournir par l'entreprise.
sectoriel: true
fictif: true

vocabulaire:
  secteur: rénovation extérieure au Québec
  qualificatif_secteur: de rénovation extérieure

appellations:
  client: client (propriétaire de la maison ou du bâtiment)
  chantier: chantier (l'adresse des travaux et leur durée)
  soumission: soumission (devis) remise avant les travaux
  equipe: équipe de pose (techniciens terrain)
  materiaux: matériaux de pose (gouttières, revêtement, soffite, fascia et accessoires)

# Identique au catalogue de référence de `opsys.taxonomie` (tests/test_packs_sectoriels.py épingle l'égalité).
services:
  - code: gouttieres
    libelle: Gouttières et descentes
    mots_cles: [gouttière, descente pluviale, descente de gouttière]
  - code: revetement
    libelle: Revêtement extérieur
    mots_cles: [revêtement, siding]
  - code: soffite_fascia
    libelle: Soffite et fascia
    mots_cles: [soffite, fascia]
  - code: reparation
    libelle: Réparation
    mots_cles: [réparation, réparer]

glossaire:
  - terme: gouttière
    definition: Canal fixé au bord du toit qui recueille l'eau de pluie ou de fonte et la dirige vers les descentes.
  - terme: descente pluviale
    definition: Tuyau vertical (descente de gouttière) qui conduit l'eau de la gouttière jusqu'au sol ou au drain.
  - terme: soffite
    definition: Panneau, souvent ajouré pour la ventilation, qui ferme le dessous du débord de toit.
  - terme: fascia
    definition: Planche ou bande qui couvre l'extrémité des chevrons, le long du bord du toit, et sur laquelle se fixe la gouttière.
  - terme: revêtement extérieur
    definition: Matériau qui recouvre les murs extérieurs d'un bâtiment (vinyle, aluminium, bois, etc.) pour les protéger des intempéries.
  - terme: siding
    definition: Anglicisme courant pour le revêtement extérieur de murs posé en bandes.
  - terme: bardeau
    definition: Élément de couverture posé en rangées qui se chevauchent sur une toiture (bardeau d'asphalte, par exemple).
  - terme: ravalement
    definition: Remise à neuf de la surface extérieure d'un mur ou d'une façade.

gabarits:
  - id: soumission-sections
    document: soumission
    fichier: gabarits/soumission-sections.md
    statut: exemple
  - id: demande-photos
    document: demande de photos
    fichier: gabarits/demande-photos.md
    statut: exemple

# Aucune valeur : le cœur ne choisit jamais un prix, une marge ou un seuil à la place de l'entreprise (AGENTS.md, fail-closed).
baremes:
  - id: cout-unitaire-service
    libelle: Coût unitaire par service
    unite: $ par unité de mesure du service
    statut: a_fournir_par_entreprise
    valeur: null
    ou_fournir: le propriétaire le déclare à M3 (paramètre de l'estimation)
  - id: taux-marge
    libelle: Taux de marge
    unite: "%"
    statut: a_fournir_par_entreprise
    valeur: null
    ou_fournir: le propriétaire le déclare à M3 (paramètre de la création du devis)
  - id: plancher-rentabilite
    libelle: Plancher de rentabilité
    unite: "%"
    statut: a_fournir_par_entreprise
    valeur: null
    ou_fournir: le propriétaire le déclare ; sous ce plancher, M3 signale une alerte rouge
  - id: seuils-meteo-service
    libelle: Seuils météo par service (vent, pluie, gel, verglas, chaleur)
    unite: selon la mesure
    statut: a_fournir_par_entreprise
    valeur: null
    ou_fournir: profil de l'entreprise (entreprise.yaml), clé meteo
  - id: seuil-reapprovisionnement
    libelle: Seuil de réapprovisionnement par article
    unite: unités de l'article
    statut: a_fournir_par_entreprise
    valeur: null
    ou_fournir: configuration de M6, article par article

exemples:
  - id: m01-gouttieres-coulent
    departement: m01
    demande: "Allo, mes gouttières sont toutes croches pis ça coule dans l'entrée. Vous faites-tu ça, vous autres ?"
    fictif: true
  - id: m03-soffite-photo-floue
    departement: m03
    demande: "Le client a envoyé une photo floue de son soffite et veut savoir combien ça va coûter."
    fictif: true
  - id: m06-fascia-bas
    departement: m06
    demande: "Sommes-nous bas en fascia blanc ?"
    fictif: true
  - id: m07-post-gouttieres
    departement: m07
    demande: "Un brouillon de post pour dire qu'on pose des gouttières avant les premières bordées de neige."
    fictif: true

# Propositions de profil de réception (M1-A) : ce que le propriétaire écrit lui-même dans `entreprise.yaml` pour que M1
# qualifie (questions par service, vocabulaire des plaintes et des urgences, destinataires de transfert, fenêtre de
# conversation, poids du score). TOUT est `a_valider` : rien de ceci n'est lu par M1 tant que Nathan n'a pas adopté un
# élément (`opsys-metier pack adopter <élément> --par NOM`, signé au journal d'audit). Les mots-clés servent à
# reconnaître qu'une question a reçu réponse (mot entier, pluriel admis, accents et casse ignorés) ; une demande de
# photos ne se reconnaît jamais par du texte et reste fermée tant que la politique « photos » n'est pas validée.
# Source : le prompt de Nathan (M1.3, juin 2026) et l'analyse d'écart M1 (2026-11-02). Rien n'est calibré sur de vrais
# messages de clients ; aucun nom de personne, aucune coordonnée, aucun montant.
propositions_profil:
  source: >-
    Prompt de Nathan, sous-module M1.3 (qualification par service) et M1.8 (plaintes), 2026-06-08 ; analyse d'écart
    M1 du 2026-11-02. Propositions de départ, non calibrées sur de vrais messages, à corriger par le propriétaire.
  questions_qualification:
    gouttieres:
      - code: adresse
        question: "Quelle est l'adresse des travaux (numéro civique et rue)?"
        mots_cles: [adresse, rue, avenue, boulevard, chemin, rang, place, croissant, montée, côte, impasse, allée]
        statut: a_valider
      - code: type_batiment
        question: "Quel type de bâtiment est-ce (maison, duplex, jumelé, commerce ou autre)?"
        mots_cles: [maison, bungalow, cottage, duplex, triplex, jumelé, condo, chalet, commerce, immeuble, bâtiment]
        statut: a_valider
      - code: etages
        question: "Combien d'étages le bâtiment compte-t-il?"
        mots_cles: [étage, plain-pied, bungalow, cottage]
        statut: a_valider
      - code: photos_facades
        question: "Pouvez-vous nous envoyer des photos de l'avant, de l'arrière et des côtés du bâtiment?"
        photos: true
        statut: a_valider
      - code: probleme
        question: "Quel est le problème observé (fuite, débordement, gouttière décrochée ou bosselée, glace)?"
        mots_cles: [fuite, fuit, fuient, déborde, débordent, débordement, coule, coulent, décrochée, décroché, bosselée, affaissée, bouchée, glace, rouillée, percée, abîmée]
        statut: a_valider
      - code: reparation_ou_neuf
        question: "Souhaitez-vous une réparation ou un remplacement complet?"
        mots_cles: [réparation, réparer, remplacement, remplacer, neuf, neuves, nouvelles, nouveau]
        statut: a_valider
      - code: urgence
        question: "Est-ce urgent (eau qui entre dans le bâtiment, dommage en cours)?"
        mots_cles: [urgent, urgence, rapidement, vite, pressé, infiltration, dégât d'eau]
        statut: a_valider
      - code: delai
        question: "Pour quelle période souhaitez-vous faire faire les travaux?"
        mots_cles: [semaine, mois, printemps, été, automne, hiver, bientôt, prochainement, délai, flexible]
        statut: a_valider
      - code: acces_arbres
        question: "L'accès est-il dégagé (cour, clôture, escalier) et y a-t-il des arbres ou des branches près du bâtiment?"
        mots_cles: [accès, cour, clôture, barrière, escalier, stationnement, arbre, branches, haie]
        statut: a_valider
      - code: couleur
        question: "Avez-vous une préférence de couleur (blanc, brun, noir, gris ou autre)?"
        mots_cles: [couleur, blanc, brun, noir, gris, beige, bronze, argent]
        statut: a_valider
    revetement:
      - code: adresse
        question: "Quelle est l'adresse des travaux (numéro civique et rue)?"
        mots_cles: [adresse, rue, avenue, boulevard, chemin, rang, place, croissant, montée, côte, impasse, allée]
        statut: a_valider
      - code: revetement_actuel
        question: "De quel matériau est le revêtement actuel (vinyle, aluminium, bois, brique, autre)?"
        mots_cles: [vinyle, aluminium, bois, brique, canexel, acier, pierre, stuc, fibrociment]
        statut: a_valider
      - code: etages
        question: "Combien d'étages le bâtiment compte-t-il?"
        mots_cles: [étage, plain-pied, bungalow, cottage]
        statut: a_valider
      - code: surface
        question: "Quelle est la surface approximative à couvrir, en pieds carrés ou en mètres carrés?"
        mots_cles: [pied carré, mètre carré, superficie, surface, murs]
        statut: a_valider
      - code: photos_murs
        question: "Pouvez-vous nous envoyer des photos de chaque côté du bâtiment et des zones abîmées?"
        photos: true
        statut: a_valider
      - code: reparation_ou_remplacement
        question: "Souhaitez-vous une réparation ou un remplacement complet du revêtement?"
        mots_cles: [réparation, réparer, remplacement, remplacer, neuf, nouveau, refaire]
        statut: a_valider
      - code: infiltration
        question: "Constatez-vous une infiltration d'eau, de la moisissure ou du pourrissement?"
        mots_cles: [infiltration, infiltre, eau, moisissure, pourri, pourrissement, humidité]
        statut: a_valider
      - code: materiau_souhaite
        question: "Avez-vous un matériau en tête pour le nouveau revêtement?"
        mots_cles: [vinyle, aluminium, bois, brique, canexel, acier, fibrociment, matériau, cèdre]
        statut: a_valider
      - code: delai
        question: "Pour quelle période souhaitez-vous faire faire les travaux?"
        mots_cles: [semaine, mois, printemps, été, automne, hiver, bientôt, prochainement, délai, flexible]
        statut: a_valider
    soffite_fascia:
      - code: photos_soffite
        question: "Pouvez-vous nous envoyer des photos du soffite et du fascia concernés?"
        photos: true
        statut: a_valider
      - code: longueur
        question: "Quelle est la longueur approximative concernée, en pieds ou en mètres?"
        mots_cles: [pied, mètre, pouce, longueur]
        statut: a_valider
      - code: ventilation
        question: "Le soffite est-il ajouré pour la ventilation de l'entretoit?"
        mots_cles: [ventilation, ventilé, ajouré, perforé, aération, entretoit]
        statut: a_valider
      - code: dommage
        question: "Quel dommage constatez-vous (pourriture, trou, panneau arraché, nid d'animaux)?"
        mots_cles: [pourri, pourriture, trou, arraché, tombé, nid, écaillé, gondolé, abîmé]
        statut: a_valider
      - code: hauteur
        question: "À quelle hauteur se trouvent-ils (un étage, deux étages)?"
        mots_cles: [étage, hauteur, haut, plain-pied]
        statut: a_valider
      - code: acces
        question: "L'accès au pourtour du bâtiment est-il dégagé?"
        mots_cles: [accès, dégagé, cour, clôture, escalier, arbre, stationnement]
        statut: a_valider
    reparation:
      - code: probleme
        question: "Quel est le problème à réparer?"
        mots_cles: [trou, fissure, arraché, pourri, brisé, percé, fuite, décroché, abîmé, cassé]
        statut: a_valider
      - code: urgence
        question: "Est-ce urgent (eau qui entre, pièce qui risque de tomber)?"
        mots_cles: [urgent, urgence, rapidement, vite, pressé, infiltration]
        statut: a_valider
      - code: photos_dommage
        question: "Une photo du dommage nous aiderait beaucoup, si vous pouvez nous l'envoyer."
        photos: true
        statut: a_valider
      - code: risque_securite
        question: "Y a-t-il un risque pour la sécurité des occupants ou des passants?"
        mots_cles: [risque, danger, dangereux, sécurité, tomber, chute]
        statut: a_valider
      - code: delai
        question: "Pour quelle période souhaitez-vous la réparation?"
        mots_cles: [semaine, mois, printemps, été, automne, hiver, bientôt, prochainement, délai, flexible]
        statut: a_valider
  signaux_plainte:
    insatisfaction:
      statut: a_valider
      termes: [déçu, déçue, insatisfait, insatisfaite, mécontent, mécontente, fâché, fâchée, en colère, tanné, tannée,
               écoeuré, écoeurée, inacceptable, scandaleux, honteux, plainte, pas content, pas satisfait, pas satisfaite,
               service lamentable, service épouvantable, incompétent, incompétents, bâclé, bâclée, arnaque, arnaqué,
               arnaquée, personne ne me rappelle, jamais rappelé, aucune nouvelle, sans nouvelles, mauvais avis,
               avis négatif, j'en ai assez, à bout]
    degat:
      statut: a_valider
      termes: [après vos travaux, après votre passage, après l'installation, vos employés ont, vous avez endommagé,
               vous avez brisé, vous avez abîmé, ont endommagé, ont brisé, ont abîmé, dommages causés, dégâts causés,
               dégât causé, laissé un dégât, laissé du dégât]
    garantie:
      statut: a_valider
      termes: [sous garantie, réclamation, malfaçon, mal installé, mal installée, mal posé, mal posée, travail mal fait,
               travaux défectueux, défectueux, défectueuse, ça n'a pas tenu, pas conforme]
    avocat:
      statut: a_valider
      termes: [avocat, avocate, mise en demeure, poursuite, poursuivre, poursuivre en justice, tribunal, petites créances,
               recours judiciaire, protection du consommateur, régie du bâtiment, huissier]
    securite:
      statut: a_valider
      termes: [danger, dangereux, dangereuse, incendie, fumée, feu, gaz, odeur de gaz, fuite de gaz, fil électrique,
               fils électriques, court-circuit, étincelles, électrocution, choc électrique, effondrement, s'effondre,
               blessé, blessée, blessure, ambulance, pompiers, "911"]
  destinataires_transfert:
    ventes: {role: seller, statut: a_valider}
    estimation: {role: manager, statut: a_valider}
    admin: {role: admin, statut: a_valider}
    finance: {role: finance, statut: a_valider}
    plainte: {role: nathan_owner, statut: a_valider}
    urgence: {role: nathan_owner, statut: a_valider}
    technique: {role: manager, statut: a_valider}
    proprietaire: {role: nathan_owner, statut: a_valider}
  fenetre_conversation_minutes:
    valeur: 30
    statut: a_valider
    etiquette: recommandation, non validée
    justification: >-
      Illustratif : l'exemple chiffré de la documentation de M1 (M1-canaux §8), jamais calibré sur l'entreprise. Un client
      qui écrit le service puis la ville quelques minutes plus tard est regroupé ; au-delà, une nouvelle conversation.
  poids_score_lead:
    statut: a_valider
    etiquette: recommandation, non validée
    valeurs: {urgence: 30, completude: 50, zone: 20}
    justification: >-
      Illustratif : les poids de la fixture fictive de M1 (profil-fictif.v1.yaml), jamais calibrés sur l'entreprise.
      Un poids à 0 écarte le critère.

blocs:
  m01:
    ligne: >-
      Les demandes que tu reçois portent le plus souvent sur les services de référence ci-dessous, et un client les nomme avec ses mots.
      Tu ne devines jamais un service qui n'est pas dans le message du client.
    inclure: [services, glossaire]
  m02:
    ligne: >-
      Les services de l'entreprise structurent le pipeline : un lead porte le code d'un service du profil, jamais
      déduit du texte du client.
    inclure: [services]
  m03:
    ligne: >-
      Une estimation porte sur un des services de référence ci-dessous, à partir de photos et d'une demande qualifiée. Le pack ne fournit
      aucun barème : sans le taux ou le coût déclaré par l'entreprise, tu ne proposes aucun prix et tu dis quoi déclarer.
    inclure: [services, glossaire, baremes]
  m04:
    ligne: >-
      La météo du créneau pèse différemment selon le service (un revêtement ne craint pas le vent comme une gouttière) :
      les seuils et les compétences par service sont déclarés par l'entreprise dans son profil, jamais supposés.
    inclure: [services, baremes]
  m05:
    ligne: >-
      La rentabilité se lit par chantier et par service ; la marge et le plancher de rentabilité sont ceux de
      l'entreprise, jamais une valeur du pack.
    inclure: [baremes]
  m06:
    ligne: >-
      Les matériaux du secteur (gouttières, revêtement, soffite, fascia) se suivent article par article ; le seuil de
      réapprovisionnement de chaque article est à configurer par l'entreprise.
    inclure: [glossaire, baremes]
  m07:
    ligne: >-
      Le contenu public parle des services de référence ci-dessous, au rythme des saisons québécoises ; il ne promet ni prix, ni garantie non
      validée, ni date.
    inclure: [services]
  m08:
    ligne: >-
      Les mesures se lisent par service et par chantier ; les seuils d'alerte sont ceux de l'entreprise.
    inclure: [services]
  m09:
    ligne: >-
      Les lectures stratégiques citent les services de l'entreprise tels qu'ils figurent dans son profil.
    inclure: [services]
  m10:
    ligne: >-
      La mémoire garde le vocabulaire du métier de l'entreprise pour le restituer tel quel, jamais réinterprété.
    inclure: [glossaire]

# Les termes que la garde interdit dans le cœur (hors packs, tests de pack et documentation d'exemple) et dans toute
# sortie effective d'un pack non sectoriel. Comparés sans accent ni casse, au début d'un mot.
termes_sectoriels:
  - rénovation
  - gouttière
  - descente pluviale
  - soffite
  - fascia
  - revêtement
  - bardeau
  - toiture
  - toit
  - siding
  - vinyle
  - couvreur
  - ravalement
  - isolation thermique
  - Synergy
