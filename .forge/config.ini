; ForgeAI PROOF IDE System — configuration exemple
; Copier vers .forge/config.ini dans un projet ou vers la configuration globale.
; NE JAMAIS placer une clé réelle dans ce fichier.

[forge]
config_version = 1
mode = connected
; Valeurs: native | standalone | connected
profile = PROOF-Team
; Valeurs: PROOF-Solo | PROOF-Team
; PROOF-Team car projet GRS/OPSYS-AI touche finance/legal/donnees personnelles (T2/T3 frequents)
fail_closed = true
auto_start = true
auto_mini_agents = true
project_id = OPSYS-AI

[project]
name = OPSYS-AI
repository_root = .
default_branch = main
require_git = true
require_worktree_for_parallel = true

[connected]
; L'édition interne ForgeAI peut préremplir cette URL.
litellm_base_url = http://192.168.1.149:4000/v1
key_source = os_keyring
key_name = forgeai-litellm
api_key_env = FORGE_LITELLM_API_KEY
; SANITIZED by Cursor bootstrap 2026-07-23: literal key removed; use OS keyring / forge secrets set litellm
verify_tls = true
timeout_seconds = 120
max_retries = 2

; Utilisation recommandée:
;   forge secrets set litellm
; La clé est alors enregistrée dans le coffre du système d'exploitation.

[provider.openrouter]
enabled = false
protocol = openai_compatible
base_url =
api_key_env = OPENROUTER_API_KEY
vendor_label = openrouter-gateway
verify_tls = true

[provider.deepinfra]
enabled = false
protocol = openai_compatible
base_url =
api_key_env = DEEPINFRA_API_KEY
vendor_label = deepinfra-gateway
verify_tls = true

[provider.custom_1]
enabled = false
protocol = openai_compatible
base_url =
api_key_env = CUSTOM_PROVIDER_API_KEY
vendor_label =
verify_tls = true

; En mode connected, gateway_alias est utilisé.
; En mode standalone, renseigner provider, model_id et vendor réel.
; vendor doit représenter le fournisseur du modèle, pas seulement la passerelle.

[role.orchestrator]
gateway_alias = forge-orchestrator
provider = native
model_id =
vendor = ide-native
required_capabilities = tools,structured_output
fallback_role =

[role.architect]
gateway_alias = forge-architect
provider = litellm
model_id =
; Nathan: remplir avec l'alias LiteLLM exact de GLM-5.2
vendor = zhipu
required_capabilities = tools,structured_output,long_context
fallback_role =

[role.hard_coder]
; Profil ForgeAI interne declare: Kimi K3 (code complique/long/1M ctx)
gateway_alias = forge-hard-coder
provider = litellm
model_id =
; Nathan: remplir avec l'alias LiteLLM exact de Kimi K3
vendor = moonshot
required_capabilities = tools,code,multi_file
fallback_role = forge-bulk-coder

[role.bulk_coder]
; NOUVEAU role - critere de difficulte confirme par Nathan (23 juillet 2026)
; Profil ForgeAI interne declare: Kimi Code 2.7 (code facile/standard)
gateway_alias = forge-bulk-coder
provider = litellm
model_id =
; Nathan: remplir avec l'alias LiteLLM exact de Kimi Code 2.7
vendor = moonshot
required_capabilities = tools,code
fallback_role =

[role.canon_keeper]
; Profil ForgeAI interne declare: Gemini Flash 3.6 (CORRIGE depuis brouillon v0.2 qui disait 3.5)
; Modele puissant, ne pas sous-estimer (confirme Nathan, 23 juillet 2026). Ce role est TOUJOURS proposal_only.
gateway_alias = forge-canon-keeper
provider = litellm
model_id =
; Nathan: remplir avec l'alias LiteLLM exact de Gemini Flash 3.6
vendor = google
required_capabilities = structured_output,long_context
write_policy = proposal_only
fallback_role =

[role.reviewer_1]
; Profil ForgeAI interne declare: DeepSeek V4 Pro
gateway_alias = forge-reviewer-1
provider = litellm
model_id =
vendor = deepseek
required_capabilities = structured_output,code_review
write_policy = verdict_only
fallback_role =

[role.reviewer_2]
; Profil ForgeAI interne declare: Gemini 3.1 Pro
gateway_alias = forge-reviewer-2
provider = litellm
model_id =
vendor = google
required_capabilities = structured_output,code_review,multimodal_optional
write_policy = verdict_only
fallback_role =

[role.reviewer_3]
; Profil ForgeAI interne declare: LongCat 2.0
gateway_alias = forge-reviewer-3
provider = litellm
model_id =
vendor = meituan
required_capabilities = structured_output,code_review,security
write_policy = verdict_only
fallback_role =

[role.security]
; Pas de modele dedie distinct confirme par Nathan - porte par reviewer_3 (LongCat 2.0) par defaut.
; Alias separe conserve pour permettre une specialisation future sans casser la config.
gateway_alias = forge-security
provider = litellm
model_id =
vendor = meituan
required_capabilities = structured_output,security
write_policy = report_only
fallback_role = forge-reviewer-3

[role.test_runner]
gateway_alias = forge-test-runner
provider = native
model_id =
vendor = ide-native
required_capabilities = tools,terminal,structured_output
fallback_role =

[role.evidence]
; Profil ForgeAI interne declare: MiMo 2.5 Pro (1M ctx, synthese de preuves)
gateway_alias = forge-evidence
provider = litellm
model_id =
vendor = xiaomi
required_capabilities = structured_output,long_context
write_policy = evidence_only
fallback_role =

[role.sentinelle_a]
; NOUVEAU role tandem - etabli par Nathan, absent du brouillon v0.2 original
; Tandem Sentinelle = 2 modeles distincts, controle continu, peut ROUVRIR une story, ne valide JAMAIS
gateway_alias = forge-sentinelle-a
provider = litellm
model_id =
vendor = deepseek
required_capabilities = structured_output,code_review
write_policy = reopen_only
fallback_role =

[role.sentinelle_b]
gateway_alias = forge-sentinelle-b
provider = litellm
model_id =
vendor = zhipu
required_capabilities = structured_output,code_review
write_policy = reopen_only
fallback_role =

[role.parallel]
; NOUVEAU role - Grok 4.5, parallelisme/worktrees, absent du brouillon v0.2 original
; ATTENTION CIV: Grok 4.5 sert aussi de modele natif Cursor (voir ide.cursor ci-dessous).
; Toute PR co-ecrite avec Grok, peu importe la porte d'entree, EXCLUT Grok de sa propre revue.
gateway_alias = forge-parallel
provider = litellm
model_id =
vendor = xai
required_capabilities = tools,code,multi_file
fallback_role = forge-bulk-coder

[model_policy]
run_firing_test_before_autonomy = true
minimum_firing_success_rate = 0.90
record_served_model = true
record_served_vendor = true
allow_silent_fallback = false
allow_same_vendor_author_reviewer = false
require_distinct_review_vendors = true

; Pool de rotation (hors alias de role fixe) : Kimi (generique), Qwen 3.7 Max, MiMo 2.5 Pro,
; MiniMax M3 (donnees synthetiques / tests E2E / volume - ajoute par Nathan, absent du brouillon v0.2).
; Reassignation journalisee, pilotee par les metriques de gouvernance (taux de rejet, bugs par poste).

[mini_agents]
max_parallel = 3
max_depth = 1
default_timeout_seconds = 900
require_structured_output = true
context_scout = automatic
design_analyst = automatic
architect = automatic_on_trigger
hard_coder = automatic_on_trigger
test_runner = automatic_after_code
drift_checker = automatic_on_resume_and_pre_merge
docs_canon = automatic_after_functional_change
security_reviewer = automatic_for_t2_t3
reviewers = automatic_before_approval
evidence_synthesizer = automatic_before_done

[proof]
profile = PROOF-Solo
require_story = true
require_claim = true
require_branch = true
require_pr = true
require_tdd = true
require_tdad_for_t2_t3 = true
require_no_stub = true
require_secret_scan = true
require_symbol_sweep = true
require_evidence_before_done = true
require_docs_canon_check = true
sealed_reviews = true
tally_by_script = true
human_approval_t3 = true
reviewers_t0 = 0
reviewers_t1 = 1
reviewers_t2 = 3
reviewers_t3 = 3
max_delphi_rounds = 2

[context]
policy = strict
reserve_percent = 20
stable_prefixes = true
require_context_manifest = true
require_provenance = true
reload_after_compaction = true

; C0/C1 ne doivent jamais être compressés avec perte.
compress_c0 = false
compress_c1 = false
compress_c2 = selective
compress_c3 = true

[headroom]
enabled = true
mode = audit
; Valeurs recommandées par progression: audit | c3_only | c2_c3
allow_instruction_file_mutation = false
allow_canon_mutation = false
allow_code_compression = false
allow_diff_compression = false
allow_test_compression = false
allow_review_compression = false
allow_evidence_compression = false

[llmlingua2]
enabled = true
mode = selective_docs_only
allow_c0 = false
allow_c1 = false
allow_code = false
allow_diff = false
allow_tests = false
allow_reviews = false
allow_evidence = false
fallback_without_gpu = no_compression
prevent_double_compression = true

[superpowers]
enabled = true
integration = pending_decision
; Valeurs après ADR: fork | overlay | vendored_patches | plugin
upstream_version =
replace_inline_self_review = true
propagate_proof_to_subagents = true
route_implementers_by_role = true
require_passthrough_test = true

[state]
backend = sqlite
database_path = .forge/state/forge.db
claims_backend = local_git
ledger_format = jsonl_hash_chain
session_resume = true
remote_claims_url =

[optimization]
dspy_enabled = true
gepa_enabled = true
runtime_auto_optimization = false
require_holdout = true
require_independent_review = true
require_canary = true
require_rollback = true
allow_canon_mutation = false
allow_gate_mutation = false
allow_t3_mutation = false

[security]
allow_plaintext_secrets = false
allow_keys_in_config = false
allow_keys_in_git = false
redact_logs = true
verify_tls = true
require_secret_scan = true
require_signed_updates = true
allow_bypass_hooks = false
sandbox_untrusted_tools = true

[ide.claude_code]
enabled = true
auto_load = true
install_agents = true
install_hooks = true
install_mcp = true

[ide.codex]
enabled = true
auto_load = true
install_agents_md = true
install_tools = true
install_mcp = true

[ide.cursor]
enabled = true
auto_load = true
install_rules = true
install_mcp = true
; Modele natif Cursor: Grok 4.5 ou Composer 2.5 (inclus abonnement, ne PAS router via LiteLLM)
native_model_note = grok-4.5-or-composer-2.5

[ide.github_copilot_native]
; Remplace ide.vscode_copilot - decision Nathan 23 juillet 2026 (pas d'installation locale VS Code)
enabled = true
auto_load = true
install_repo_instructions = true
; .github/copilot-instructions.md - lu par Copilot Chat ET le coding agent (cloud)
enable_coding_agent = true
; Si true: le coding agent est un FRONT DE CONSTRUCTION soumis aux memes regles PROOF
; (claim avant assignation d'issue, zones bornees, pipeline complet) - jamais un passe-droit.
coding_agent_requires_claim = true

[telemetry]
enabled = false
remote_export = false
include_code = false
include_prompts = false
include_secrets = false
retention_days = 30
