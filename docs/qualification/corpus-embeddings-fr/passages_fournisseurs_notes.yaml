# Corpus FICTIF (suite) : fiches fournisseurs, notes de chantier. Voir passages_gouttieres_revetement.yaml.
schema: opsys.qualification.passages-embeddings-fr/v1
fictif: true
categories:
  fournisseurs:
    V001: "Alu-Nord Distribution (fournisseur fictif) : aluminium prélaqué en rouleaux de 24 po sur 50 pi. Livraison en 48 heures dans les Laurentides. Commande minimale 500 $. Paiement net 30 jours."
    V002: "Vinyl-Québec Matériaux (fictif) : déclin de vinyle, douze couleurs en stock, délai de quatre semaines pour une couleur spéciale. Garantie à vie limitée du fabricant sur le produit."
    V003: "Quincaillerie Boisé (fictive) : vis, clous, scellants et crochets. Compte client avec 10 % de rabais de volume sur les commandes de plus de 300 $. Ramassage au comptoir de 7 h à 17 h."
    V004: "Scellants Polytech (fictif) : scellant polyuréthane pour gouttières et solins, tube de 10 oz, fiche de données de sécurité (FDS) disponible en ligne. Entreposage à l'abri du gel."
    V005: "Location Échafauds Laurentides (fictif) : échafaudage pour trois jours à 450 $, nacelle pour une journée à 520 $, livraison et ramassage inclus dans un rayon de 40 km."
    V006: "Acier-Plus Revêtement (fictif) : panneaux d'acier prépeint garantis 40 ans. Délai de deux à trois semaines. Commande minimale de 25 panneaux ; coupe sur mesure possible sans reprise."
    V007: "Composite BoisPro (fictif) : déclin de composite garanti 25 ans. Livraison au chantier, entreposage à plat à l'abri de la pluie obligatoire jusqu'à la pose."
    V008: "Cimentec (fournisseur fictif de fibrociment) : palettes de 54 planches, livraison par camion avec grue. Aucun retour accepté après la coupe d'une planche."
    V009: "Recyclage Métal Nord (fictif) : reprise des vieilles gouttières d'aluminium, payée au kilo selon le cours du jour. Les pesées sont inscrites sur un bon de dépôt remis à l'atelier."
    V010: "Contact chez Alu-Nord : ventes@alunord.example.test, 450-555-0147 (numéro fictif), représentant Luc Fictif. Heures d'appel de 7 h 30 à 16 h, du lundi au vendredi."
    V011: "Politique de retour de Vinyl-Québec : retour accepté sous 14 jours, matériel entier dans son emballage, frais de reprise de 15 %. Les couleurs spéciales ne sont jamais reprises."
    V012: "Évaluation des fournisseurs, troisième trimestre 2026 : ponctualité des livraisons 94 %, taux d'erreur de commande 2 %. Le fournisseur sous 90 % de ponctualité passe en surveillance."
    V013: "Assurance responsabilité du sous-traitant Équipe Laflamme (fictif) : certificat valide jusqu'au 2027-03-31. À renouveler avant cette date, sinon aucun chantier ne lui est attribué."
    V014: "Équipe Laflamme (sous-traitant fictif) : poseurs de revêtement et de gouttières à 38 $ l'heure par poseur, disponibles d'avril à novembre. Licence RBQ fictive au dossier."
    V015: "Filtra-Net (protège-gouttières fictif) : grillage en acier inoxydable, rouleaux de 4 pi, boîtes de 24. Compatible avec les gouttières de 5 po et de 6 po."
    V016: "Électro-Fictif inc. : électricien partenaire pour le raccordement des câbles chauffants et des lumières de soffite. Intervention à planifier une semaine d'avance, devis séparé."
    V017: "Bois Traité du Nord (fictif) : fascia de pin traité de 1 po sur 6 po, longueur 16 pi, à l'unité ou en paquet de 10. Livraison le lendemain pour une commande passée avant midi."
    V018: "Isolation Rigide-Q (fictif) : panneaux de polystyrène de 4 pi sur 8 pi, épaisseur de 1 po, en paquet de 20. À entreposer à plat et à l'abri du soleil."
    V019: "Livraison des fournisseurs : du lundi au vendredi de 7 h à 15 h, avis d'au moins 24 heures. Livraison hors horaire ou le samedi : supplément de 75 $."
    V020: "Compte chez Alu-Nord : limite de crédit de 15 000 $, solde ouvert de 7 480 $. Au-delà de 90 % de la limite, la comptabilité demande l'accord de la direction avant toute nouvelle commande."
    V021: "Substitution de produit : si un article est en rupture, le fournisseur peut proposer un équivalent. Le client doit approuver la couleur avant livraison ; sinon le matériel est retourné."
    V022: "Garantie du fabricant d'aluminium prépeint : 25 ans sur la peinture. Elle ne couvre pas les dommages par impact ni les atmosphères salines. Le numéro de lot doit être conservé."
    V023: "Fiche de sécurité de la colle de contact à base de solvant : inflammable, ventiler, porter des gants et un masque, ne pas utiliser près d'une flamme. Une colle à base d'eau est préférée en milieu habité."
    V024: "LumiSoffite (fournisseur fictif de lumières DEL) : modules 12 V pour soffite, transformateur extérieur, garantie de cinq ans. Se commande par paquet de six."
    V025: "Livraison ou ramassage : le ramassage au comptoir fait économiser environ 60 $ de frais de livraison, mais mobilise un camion et un employé pendant une heure."
    V026: "Entente de prix avec Alu-Nord : prix fixe pour 90 jours sur toute commande de 10 rouleaux ou plus. Au-delà, le prix du jour s'applique."
    V027: "Trimax (PVC cellulaire fictif) : planches de 5/4 po sur 6 po pour fascia, sans pourriture, se peignent en couleur foncée. Plus chères que le bois traité."
    V028: "Évaluation d'un nouveau fournisseur : assurance, références, délais de livraison, prix, mode de paiement et garantie. Une liste de contrôle est cochée avant le premier achat."
    V029: "Attaches de gouttière : crochets cachés en acier inoxydable, boîte de 100. Pas de crochets zingués près des arbres où les feuilles mouillées corrodent le métal."
    V030: "Rappel de produit : le lot de scellant 2026-07 est retiré par le fabricant. Vérifier les numéros de lot en stock et sur les camions, puis retourner les tubes concernés."
  notes_chantier:
    N001: "Chantier Gagnon, jour 1 : anciennes gouttières retirées, fascia en bon état, deux techniciens sur place, fin des travaux à 15 h 30. Les mesures coïncident avec la soumission."
    N002: "Pluie à 10 h, travaux arrêtés, matériel couvert d'une toile. Reprise demain à 7 h 30 selon la météo ; le client est avisé par message texte."
    N003: "Bois pourri sous le coin nord-est : environ 8 pi de fascia à remplacer. Photo prise, client informé sur place, accord verbal. À confirmer par écrit avant de facturer l'extra."
    N004: "Client absent, barrière arrière verrouillée. L'équipe travaille uniquement sur la façade avant et laisse un mot ; la façade arrière sera faite à la prochaine visite."
    N005: "Échafaudage monté sur la façade sud, vérifié par le chef d'équipe : garde-corps en place, planchers fixés, harnais portés au-dessus de 10 pi."
    N006: "Le voisin demande de déplacer le camion qui bloque son entrée. Camion déplacé sur la rue, chef d'équipe s'est excusé. Note ajoutée à la fiche de chantier."
    N007: "Chantier Lavoie : 32 panneaux de vinyle endommagés à la livraison, couleur sable. Photos transmises au fournisseur, remplacement commandé, livraison prévue dans cinq jours."
    N008: "Fin de chantier : nettoyage du terrain à l'aimant, trois sacs de rebuts, photos après, inspection finale avec le client. Signature du client au bas de la fiche."
    N009: "À l'ouverture du soffite, un écureuil logeait dans l'entretoit. Trappe à sens unique installée, grillage métallique posé avant de refermer. Le client en a été informé."
    N010: "Vent de 50 km/h en après-midi : travaux sur échelle suspendus par sécurité. L'équipe passe à l'atelier pour plier le fascia en attendant."
    N011: "Entrée électrique : le déclin autour de la tête de service doit être dégagé sans toucher aux fils. Communiquer avec le distributeur d'électricité avant de déplacer quoi que ce soit."
    N012: "Il manquait quatre coins extérieurs à la livraison. Livraison complémentaire demain à 8 h ; l'équipe est réaffectée au fascia en attendant."
    N013: "Arrivée de l'équipe à 7 h 30, stationnement sur la rue, chef d'équipe Mathieu Fictif. Tout le matériel est déchargé avant 8 h pour dégager le passage."
    N014: "Inspection préalable : murs courbes, ancien déclin en tôle, 14 photos prises avant le chantier. Les photos sont jointes à la soumission pour éviter un litige sur l'état initial."
    N015: "Température de -12 °C : le vinyle est trop cassant, le chantier est reporté à la semaine prochaine. Le client est informé et la date est reconfirmée par courriel."
    N016: "Fenêtre du sous-sol sans solin : ajout d'un solin et d'un calfeutrage de finition. Extra de 75 $ accepté par le client sur place."
    N017: "Chien du client laissé à l'intérieur pendant le chantier, barrière fermée. L'équipe ne laisse jamais la barrière ouverte quand elle quitte."
    N018: "Calfeutrage terminé autour des fenêtres. Température minimale de 5 °C respectée pour la prise du scellant ; sinon le scellant ne durcit pas correctement et le travail est repris."
    N019: "Maison de deux étages : nacelle louée pour une journée, livraison à 7 h, retour à 17 h. Le chauffeur de la nacelle attend l'équipe sur la rue."
    N020: "Mesures corrigées : le pourtour réel est de 182 pi lin. au lieu des 168 pi de la soumission, soit 14 pi de plus. Ajuster la facture de 126 $ avant taxes avec accord du client."
    N021: "Conteneur de 14 verges cubes déposé dans l'entrée pour les rebuts. Ramassage prévu vendredi. Le client doit laisser le passage libre pour le camion."
    N022: "Garde-corps de galerie retiré puis remis en place avec des vis neuves. Le client est satisfait, la rampe est ferme à l'essai de poussée."
    N023: "Demande du client à la visite finale : ajouter une descente côté garage. Extra de 95 $ accepté, installé le jour même par l'équipe."
    N024: "Test à l'eau avec le boyau en fin de chantier : pente validée, aucune fuite aux joints, vidéo de preuve ajoutée au dossier du chantier."
    N025: "Blessure légère : coupure à la main d'un poseur, premiers soins sur place. Déclaration d'incident à la CNESST au besoin ; rapport interne rempli le jour même."
    N026: "Contrôle de qualité du chef d'équipe : alignement du soffite vérifié au cordeau, écart sous 1/8 po. Les photos sont jointes à la fiche de chantier."
    N027: "Photos avant et après prises par le chef d'équipe sur son téléphone et téléversées dans le dossier du chantier avant 17 h le jour même."
    N028: "Livraison erronée : vinyle blanc reçu au lieu de gris ardoise. Retour au fournisseur planifié, appel avec le représentant, chantier mis en attente pour la façade nord."
    N029: "Inventaire restant en fin de chantier : trois morceaux de fascia de 12 pi et deux boîtes de crochets. Retour au camion puis à l'atelier pour réutilisation."
    N030: "Arrêt de chantier à 14 h : le client veut changer la couleur du soffite en cours de route. Le changement doit être confirmé par écrit, avec les coûts et le nouveau délai."
