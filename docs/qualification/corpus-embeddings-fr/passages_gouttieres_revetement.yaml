# Corpus FICTIF de mesure des embeddings — français québécois, rénovation extérieure.
# Entreprise, clients, fournisseurs, numéros, montants et courriels sont inventés (@example.test). Aucune donnée réelle.
# Les règles de métier, prix et délais ci-dessous sont des énoncés de FICTION pour mesurer la recherche : ce ne sont pas
# des références techniques, tarifaires, fiscales ni juridiques.
schema: opsys.qualification.passages-embeddings-fr/v1
fictif: true
categories:
  gouttieres:
    G001: "Installation standard : gouttières en aluminium prélaqué de 5 po avec descentes de 2 po sur 3 po, fixées par crochets cachés à tous les 24 po. La couleur est choisie par le client sur l'échantillonnage."
    G002: "Nos gouttières sans joint sont formées sur place à partir d'un rouleau d'aluminium de calibre .027. Moins de joints veut dire moins de fuites : seuls les coins et les raccords de descente sont scellés."
    G003: "Le barrage de glace se forme quand la chaleur qui s'échappe du grenier fait fondre la neige au-dessus du mur ; l'eau regèle à la bordure froide du toit et la glace tire sur la gouttière. Une gouttière arrachée par la glace n'est pas couverte par la garantie."
    G004: "Pente d'une gouttière : 1/16 po par pied vers la descente, soit environ 1 po sur 16 pi. Une mauvaise pente laisse l'eau stagner, ce qui attire les moustiques et fait rouiller les joints."
    G005: "Le protège-gouttière (grillage ou capuchon) réduit le nettoyage sans l'éliminer. Les aiguilles de pin et les samares d'érable s'y logent quand même. Tarif fictif : 14 $ du pied linéaire installé, grillage en acier inoxydable."
    G006: "Chaque descente doit rejeter l'eau à au moins 6 pi (1,8 m) du solage, avec une rallonge de plastique ou un bloc de béton. Sinon l'eau retourne vers la maison et finit dans le sous-sol."
    G007: "Gouttière de 6 po recommandée quand la surface de toit drainée dépasse 1 200 pi² ou quand la pente de toit est forte (plus de 8/12). Les chutes d'eau y sont plus rapides et la 5 po déborde."
    G008: "Un coin de gouttière qui fuit se reprend en nettoyant le joint d'angle et en le recalfeutrant au scellant polyuréthane. Ne jamais utiliser du silicone : la peinture de l'aluminium ne le retient pas."
    G009: "Nettoyage de gouttières : deux fois par année, au printemps et à la fin de l'automne après la chute des feuilles. Forfait fictif de 150 $ pour une maison à un étage, 220 $ pour deux étages."
    G010: "Les câbles chauffants se posent en zigzag sur le bord du toit et dans la gouttière et la descente pour fondre la glace. Un thermostat les met en marche sous 2 °C. L'alimentation est raccordée par un électricien licencié, pas par nos poseurs."
    G011: "Réparer ou remplacer ? Si plus de 30 % des sections sont affaissées, ouvertes ou rouillées, on recommande de tout remplacer plutôt que de multiplier les réparations de joints."
    G012: "Gouttières en cuivre : sur demande spéciale seulement, soudées sur place, délai de 4 semaines pour la fabrication. Le cuivre ne se peinture pas et change de teinte avec les années."
    G013: "Les vieilles gouttières en acier galvanisé de plus de 25 ans percent par la rouille, surtout sous les arbres où les feuilles mouillées restent. On les remplace par de l'aluminium prélaqué."
    G014: "Couleurs de gouttière en stock : blanc, brun commercial, noir, gris ardoise et bronze. On harmonise la teinte avec celle du fascia pour que la ligne de toit reste propre."
    G015: "Garantie des gouttières : 20 ans sur la peinture (garantie du fabricant) et 5 ans sur la main-d'œuvre d'étanchéité des joints. La garantie ne couvre ni la glace, ni les chocs, ni le manque d'entretien."
    G016: "Longueur maximale d'un tronçon sans descente : 40 pi. Au-delà, on ajoute une descente pour que le débit ne dépasse pas la capacité de la gouttière."
    G017: "Les embouts de gouttière sont rivetés et scellés au polyuréthane. Un embout qui se décolle laisse couler l'eau derrière le fascia et finit par le faire pourrir."
    G018: "Sous une descente qui sort sur du pavé uni ou un trottoir, on pose un bloc éclaboussure (splash block) en béton ou un coude de sortie pour diriger l'eau loin du passage."
    G019: "Sur un toit à deux niveaux ou une lucarne, la descente haute se prolonge par une descente en cascade avec déflecteur. Sans déflecteur, l'eau éclabousse le revêtement du bas et le salit."
    G020: "Baril d'eau de pluie : on installe un collecteur sur la descente avec dérivation vers le baril. À l'automne, on débranche le collecteur pour que l'eau ne gèle pas dans le tuyau."
    G021: "Crochets cachés à vis plutôt que vieux clous à gouttière : les clous finissent par s'arracher avec les cycles de gel et de dégel. Nos poseurs fixent un crochet tous les 24 po."
    G022: "Les feuilles d'érable et les branches bouchent la descente. On teste au boyau en fin de chantier et on débouche avec une sonde ; une descente obstruée fait déborder la gouttière."
    G023: "Retrait des vieilles gouttières incluses dans la soumission : l'aluminium est récupéré et envoyé au recyclage, l'acier galvanisé va au conteneur. Aucun frais de disposition au client."
    G024: "Avant de soumissionner, on mesure le pourtour du toit en pieds linéaires et on compte les coins, les descentes et la hauteur des murs (un ou deux étages). Ces mesures sont reportées à la fiche de visite."
    G025: "Sur une maison de deux étages, l'installation demande une échelle de 28 pi ou une nacelle. La majoration de main-d'œuvre fictive est de 15 % par rapport à un étage."
    G026: "Une gouttière au-dessus d'une porte d'entrée est dirigée vers une descente placée à côté, jamais au centre. Autrement l'eau ruisselle sur le perron et gèle en une plaque de glace dangereuse."
    G027: "Descente rectangulaire de 2 po sur 3 po pour les maisons standard ; descente ronde de 3 po ou rectangulaire de 3 po sur 4 po pour les toits à fort débit. Plus grosse, elle se bouche moins."
    G028: "Une gouttière qui déborde sous une forte pluie a presque toujours trop peu de descentes ou une descente obstruée. Avant de remplacer, on ajoute une descente ou on débouche, puis on revérifie au boyau."
    G029: "Sur une longueur de plus de 50 pi, on place un raccord de dilatation : l'aluminium s'allonge et se contracte avec la température, ce qui finit par fendre les joints d'angle."
    G030: "Entretien d'une gouttière prélaquée : chiffon doux et eau savonneuse. Éviter le lavage à pression directe qui écaille la peinture et force l'eau derrière les joints."
    G031: "Un solin de mur au-dessus de la gouttière empêche l'eau de se faufiler derrière. Le larmier doit couvrir le haut du fascia et déborder dans la gouttière."
    G032: "Quand le larmier (drip edge) est absent, l'eau coule derrière la gouttière, mouille le fascia et le fait pourrir en quelques saisons. Le problème est fréquent sur les vieilles maisons."
    G033: "Garage détaché : une seule face de toit, une descente à chaque extrémité et la sortie ramenée vers la pelouse. Pas de raccordement au drain de la maison."
    G034: "Délai d'installation : une journée pour une maison de taille moyenne, avec deux techniciens et fabrication de la gouttière sur place. Une maison de deux étages demande une journée et demie."
    G035: "Tarifs fictifs de référence : gouttière de 5 po en aluminium installée, 9 $ du pied linéaire ; descente de 2 po sur 3 po, 7 $ du pied linéaire. Les taxes sont en sus."
  revetement:
    R001: "Pose du revêtement de vinyle : sur membrane pare-intempéries, on cloue au centre de la fente sans serrer. Il faut laisser 1/32 po de jeu entre la tête du clou et le panneau pour que le vinyle puisse bouger avec la chaleur."
    R002: "Déclin de vinyle ou déclin de composite (bois traité) ? Le composite résiste mieux aux chocs mais demande de la peinture et du calfeutrage des coupes. Le vinyle est moins cher et ne se peint pas."
    R003: "Revêtement d'acier prépeint : durable, garantie fabricant de 40 ans contre le pelage. Il se bosselle toutefois sous la grêle ou un coup de tondeuse, et la pluie y est plus bruyante."
    R004: "Le fibrociment est lourd : deux personnes par planche. La coupe se fait avec un outil à lame spéciale et un masque respiratoire à cause de la poussière de silice. Peinture d'usine garantie 15 ans."
    R005: "Membrane pare-air et pare-intempéries : chevauchement horizontal de 6 po, de 12 po aux joints verticaux, avec ruban adhésif aux ouvertures. La membrane se pose avant le revêtement, de bas en haut."
    R006: "Autour des fenêtres et des portes, on pose des moulures en J (J-channel) ; aux angles du mur, des coins extérieurs et intérieurs. Le déclin y glisse et reste libre de se dilater."
    R007: "Maison d'avant 1980 : avant de retirer un ancien revêtement ou un papier de construction, faire tester les matériaux pour l'amiante en laboratoire. Si le résultat est positif, le chantier est suspendu et le client est avisé par écrit."
    R008: "Isolant rigide de 1 po sous le déclin : ajoute environ R-5 au mur et égalise la surface. Il se fixe par fourrures de bois de 1 po sur 3 po traitées, vissées aux montants."
    R009: "Bardeau de cèdre : entretien (teinture ou préservatif) tous les 5 ans, coût plus élevé que le vinyle. Il est plus attrayant pour les pic-bois et vieillit en gris argenté si on ne le teint pas."
    R010: "Un déclin de vinyle qui gondole ou ondule vient de clous trop serrés, de panneaux sans jeu de dilatation ou de la chaleur réfléchie par une fenêtre voisine à haut rendement. On desserre les clous et on vérifie le jeu."
    R011: "Couleurs foncées en vinyle (brun, bleu marine, vert forêt) : plus de dilatation et risque de gauchissement. Le fabricant impose parfois des profils spéciaux pour ces teintes."
    R012: "Jeu de dilatation du vinyle : 1/4 po aux extrémités des panneaux en été, 3/8 po quand on installe sous zéro. Un panneau posé sans jeu cloque à la première canicule."
    R013: "Le vinyle devient cassant sous -10 °C : on le coupe avec une lame très tranchante, on pré-perce les trous de clou et on évite les chocs. Au-delà d'une semaine de grand froid, on reporte le chantier."
    R014: "Calcul de la quantité de revêtement : mesurer la surface des murs en pi², soustraire les ouvertures, ajouter 10 % de perte. Un « carré » de revêtement couvre 100 pi²."
    R015: "Garantie du revêtement : 10 ans sur la pose (main-d'œuvre) ; garantie du fabricant sur le produit, à vie limitée, selon ses conditions. La garantie du fabricant n'est pas transférable après le deuxième propriétaire."
    R016: "Au-dessus des fenêtres et des portes, on pose un solin de métal (flashing) sous le déclin, avec un calfeutrage de finition. Sans solin, l'eau s'infiltre derrière le revêtement."
    R017: "Pignon : on commence par le bas, on découpe chaque panneau à l'angle du toit et on finit par la pointe. Les coupes en biais sont couvertes par une moulure de finition."
    R018: "Trous de pic-bois : on inspecte le cèdre et le composite avant la soumission. Un trou profond se bouche au scellant ; si l'oiseau revient, on pose un filet de protection."
    R019: "Lavage à pression du déclin : sous 1 500 psi, avec une buse large, de haut en bas. Pas de jet vers le haut : l'eau serait projetée derrière le revêtement et mouillerait l'isolant."
    R020: "Pourriture du panneau de mur découverte en retirant l'ancien revêtement : on remplace la partie atteinte du contreplaqué. C'est un extra, facturé au taux horaire plus le matériel, avec autorisation du client."
    R021: "Autour des prises extérieures, des sorties de sécheuse et des robinets, on installe des blocs de montage (mounting blocks) pour que le déclin soit coupé proprement et calfeutré."
    R022: "Fenêtre ou porte remplacée pendant le chantier : on coordonne avec l'installateur de fenêtres pour ne pas défaire le déclin deux fois. Sinon on calfeutre le périmètre et on remet la moulure en J."
    R023: "Délai de livraison du revêtement : couleur en stock, 5 jours ouvrables ; couleur spéciale ou profil particulier, 3 à 4 semaines. La date de début de chantier n'est confirmée qu'à la réception du matériel."
    R024: "Commander tout le revêtement d'un coup : les lots de teinture varient et deux commandes à des semaines d'écart peuvent donner des panneaux de teinte légèrement différente sur le même mur."
    R025: "Fourrures de bois 1 po sur 3 po traitées pour égaliser un mur croche avant la pose du composite. Elles sont espacées de 16 po et fixées dans les montants."
    R026: "Mur de brique en bas et déclin en haut : la transition se fait par un solin en Z (Z-flashing) posé au-dessus de la brique, calfeutré à sa jonction avec le mur."
    R027: "Garde-corps de galerie à retirer et à remettre pour poser le revêtement derrière : autorisation du client avant le chantier, vis neuves en inox à la remise en place."
    R028: "Maison de deux étages : échafaudage ou nacelle, majoration de 15 % sur la main-d'œuvre fictive du revêtement, et le délai passe d'environ 3 jours à 5 jours pour 1 800 pi²."
    R029: "Vinyle isolé (insulated siding) : une mousse de polystyrène moulée est collée derrière le panneau. Il est plus rigide, plus silencieux et mieux aligné qu'un vinyle ordinaire sur un mur croche."
    R030: "Calfeutrage de finition autour des ouvertures : il faut un scellant de couleur assortie au déclin, en tube de 10 oz. Appliqué à 5 °C ou plus pour bien prendre."
    R031: "La teinte du calfeutrage est choisie pour correspondre au déclin : blanc, sable, gris ardoise ou brun. Un scellant mal assorti saute aux yeux de la rue."
    R032: "Entretien du vinyle : lavage doux une fois par année avec un boyau et une brosse souple. Pour la moisissure, une solution d'eau et de vinaigre blanc suffit ; éviter les solvants."
    R033: "Profils de déclin : clin double de 4 po (D4), clin simple de 8 po, et déclin vertical « planche et couvre-joint » (board and batten). Le choix change l'apparence et la quantité de pièces."
    R034: "Dégagement : laisser au moins 6 po entre le bas du déclin et le sol ou la terre, et 2 po avec un toit adjacent. La neige empilée contre le mur et le paillis accélèrent la détérioration."
    R035: "Placage de pierre cultivée sur le bas du mur : à confier à un maçon. Nous posons le déclin au-dessus avec un solin en Z, mais nous ne faisons pas la maçonnerie."
