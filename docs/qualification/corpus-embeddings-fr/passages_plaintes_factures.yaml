# Corpus FICTIF (suite) : plaintes de clients, factures. Voir passages_gouttieres_revetement.yaml pour l'avertissement.
schema: opsys.qualification.passages-embeddings-fr/v1
fictif: true
categories:
  plaintes:
    P001: "Plainte d'un client (fictif) : la gouttière installée coule à l'angle du coin ouest depuis la première pluie. Il demande une réparation sous garantie et une visite rapide avant l'hiver."
    P002: "Plainte : la couleur du déclin livré ne correspond pas à l'échantillon, elle est plus pâle. Le lot n'était pas le même que celui de l'échantillon ; nous proposons le remplacement partiel des panneaux."
    P003: "Plainte : l'équipe est arrivée trois heures en retard et personne n'a prévenu la cliente. Le chef d'équipe n'avait pas son numéro. Excuses présentées et rappel de la procédure d'appel avant 8 h."
    P004: "Plainte : le camion a laissé des ornières profondes dans la pelouse. Nous remettons le terrain en état à nos frais : terre, tourbe posée et arrosage conseillé pendant dix jours."
    P005: "Plainte du voisin : bruit de coupe avant 7 h du matin. L'équipe respecte l'heure de début prévue par le règlement municipal ; rappel au chef d'équipe de ne pas démarrer les outils avant 7 h."
    P006: "Plainte : clous et rebuts laissés dans l'herbe, un enfant s'est piqué le pied. Nous retournons le jour même avec un aimant à balayer, puis une inspection avec photos est envoyée au client."
    P007: "Plainte : parterre de fleurs et arbustes écrasés par l'échelle et les débris. Nous remplaçons les plantes à nos frais après photos avant et après, avec l'accord du client."
    P008: "Plainte : infiltration d'eau dans le mur après la pose du revêtement. Solin mal posé au-dessus de la fenêtre. Inspection d'urgence dans les 48 heures et réparation sous garantie de pose."
    P009: "Plainte : une cliente dit que personne n'a retourné ses appels depuis une semaine pour connaître la date de début des travaux. Rappel immédiat par le responsable des opérations et message confirmé par courriel."
    P010: "Plainte : la facture dépasse la soumission de 600 $ sans avertissement. Les extras n'ont pas été autorisés par écrit. La politique est de n'exiger que les extras confirmés par le client ; le dossier est revu avant paiement."
    P011: "Plainte : garantie refusée pour une gouttière arrachée par la glace. Le client conteste. Explication de l'exclusion écrite à la soumission : glace, chocs et manque d'entretien ne sont pas couverts."
    P012: "Plainte : peinture écaillée sur le fascia 14 mois après la pose. Couverte par la garantie du fabricant (20 ans) : photos, numéro de lot et réclamation au fournisseur, visite de remplacement planifiée."
    P013: "Plainte : un poseur a fumé sur la propriété du client et laissé des mégots. Rappel du code de conduite : interdiction de fumer sur le terrain du client, excuses du chef d'équipe."
    P014: "Plainte : le soffite est mal aligné et les lignes sont visibles de la rue. Contrôle de qualité au cordeau : l'écart dépasse la tolérance de 1/8 po ; l'équipe reprend l'alignement."
    P015: "Plainte : entrée de garage tachée de goudron et de calfeutrage tombé. Nettoyage au solvant doux et à la brosse, photo avant et après transmise au client."
    P016: "Plainte : une fenêtre a été égratignée par l'échelle. La photo prise avant le chantier est comparée. Si le dommage est confirmé, l'assurance responsabilité de l'entreprise est avisée."
    P017: "Plainte : les trous d'écureuil sont réapparus dans le soffite deux mois après la pose. La garantie ne couvre pas la faune. Option payante : grillage métallique et trappe à sens unique."
    P018: "Plainte : chantier laissé inachevé pendant cinq jours à cause de la pluie, sans aucune communication. Procédure : avertir le client dès le premier jour d'arrêt et proposer une nouvelle date."
    P019: "Avis en ligne de deux étoiles pour un retard : réponse polie et sans détails privés. Offrir un appel direct du responsable. Ne jamais révéler d'information sur le dossier du client."
    P020: "Plainte : le devis oral ne correspond pas à l'écrit, le vendeur aurait promis des protège-gouttières inclus. On compare le dossier de visite et on offre une option de règlement à valider avec la direction."
    P021: "Plainte du voisin : la descente rejette l'eau vers sa fondation. Litige de mitoyenneté. On déplace la sortie de la descente vers notre client et on ajoute une rallonge."
    P022: "Plainte : la cliente est allergique à la poussière du fibrociment. Nous protégeons les fenêtres, coupons à l'extérieur loin des prises d'air et nettoyons le terrain chaque soir."
    P023: "Plainte du voisin : la poussière et le camion bloquent l'accès à son entrée. Le camion est déplacé, une zone de livraison est marquée à la craie et un avis est remis aux voisins le matin."
    P024: "Plainte : la gouttière claque par grand vent. Crochets lâches : resserrer ou ajouter des crochets cachés tous les 24 po. Passage de l'équipe de service sous garantie de main-d'œuvre."
    P025: "Plainte : l'acompte a été facturé en double. Reçu vérifié, doublon confirmé, remboursement par virement Interac dans les cinq jours ouvrables et note de crédit au dossier."
    P026: "Escalade des plaintes : non résolue après dix jours ouvrables, le dossier passe à la direction. En dernier recours, le client peut s'adresser à l'Office de la protection du consommateur."
    P027: "Plainte : un morceau de fascia est tombé sur le toit du cabanon du client pendant le chantier. Évaluation des dommages avec photos, réparation par l'entreprise, assurance responsabilité en réserve."
    P028: "Plainte : le client voulait des gouttières de 6 po et on a installé du 5 po. Erreur de bon de commande. Reprise des gouttières ou crédit, selon la préférence du client, validé par la direction."
    P029: "Plainte : forte odeur de colle et de solvant pendant le chantier, enfants à la maison. Pause du travail, ventilation, remplacement de la colle à solvant par un produit à base d'eau."
    P030: "Mesure d'apaisement : crédit commercial plutôt que remboursement en espèces. Tout crédit supérieur à 500 $ exige l'approbation de la direction, avec le motif écrit au dossier."
  factures:
    F001: "Facture 2026-1187, M. Gagnon : gouttières de 5 po complétées. Solde dû 2 415 $ après acompte de 1 035 $ reçu à la signature. Échéance 15 jours après l'émission."
    F002: "Facture 2026-1192, Mme Lavoie : acompte de 30 % (4 470 $) reçu par virement Interac le 12 octobre. Le solde est facturé à la livraison du matériel puis à la fin du chantier."
    F003: "Intérêts de retard : 2 % par mois sur le solde impayé après 30 jours, ce qui correspond à 24 % par année. La mention figure sur la facture. À valider auprès d'un professionnel qualifié."
    F004: "Note de crédit NC-2026-014 : 180 $ accordés à la cliente pour ajustement de couleur après la plainte sur le lot de déclin. Elle est déduite du solde de la facture suivante."
    F005: "Retard de paiement : rappel de courtoisie à J+7, rappel formel à J+15, mise en demeure à J+45. Tout appel est noté au dossier. Aucune pénalité n'est appliquée avant le 31e jour."
    F006: "Facture du fournisseur Alu-Nord n° A-88231 : 24 rouleaux d'aluminium prélaqué, paiement net 30 jours, imputée au chantier Gagnon et au stock. À payer avant le 20 du mois suivant."
    F007: "Retenue de 5 % du montant du contrat jusqu'à l'inspection finale sur les chantiers commerciaux. Elle est libérée par la comptabilité après la signature du client."
    F008: "Facture d'extras, chantier Pelletier : remplacement de 12 pi de fascia pourri. Main-d'œuvre 2 h à 85 $ plus matériel 96 $, avec l'autorisation écrite du client jointe à la facture."
    F009: "Modes de paiement acceptés : virement Interac, chèque, comptant et carte de crédit avec frais de 2,5 %. Les paiements en espèces de plus de 500 $ sont inscrits avec un reçu signé."
    F010: "Les numéros d'inscription aux taxes (TPS et TVQ) de l'entreprise figurent sur chaque facture. Les montants de taxes sont calculés par le logiciel comptable, jamais à la main. À valider auprès d'un comptable (CPA)."
    F011: "Facture annulée et remplacée : adresse du chantier erronée. La facture 2026-1203 annule la 2026-1198 ; l'ancienne reste dans le registre avec la mention « annulée »."
    F012: "Reçu de dépôt : 500 $ pour réserver une date de chantier. Il est déduit du solde final. Le dépôt n'est pas remboursé si le client annule moins de 14 jours avant la date."
    F013: "Gros chantier (plus de 20 000 $) : facturation par jalons en trois versements, le premier à la signature, le deuxième à la livraison du matériel et le dernier à la fin du chantier."
    F014: "Facture impayée depuis plus de 60 jours : avis préalable d'hypothèque légale de la construction à envisager dans les 30 jours suivant la fin des travaux. À valider auprès d'un professionnel qualifié (avocat)."
    F015: "Facture avec acompte et rabais combiné : le rabais de 5 % s'applique au sous-total avant taxes, puis on soustrait l'acompte, puis on ajoute les taxes sur le montant net."
    F016: "Relevé de compte mensuel envoyé par courriel le 1er de chaque mois à tous les clients qui ont un solde. Il liste les factures, les paiements reçus et les intérêts éventuels."
    F017: "Facture de la Quincaillerie Boisé n° 77-402 : vis inoxydables, scellant polyuréthane, 312,40 $. Imputée au chantier Pelletier ; le reçu est numérisé au dossier du chantier."
    F018: "Frais de déplacement hors zone : 0,75 $ du kilomètre au-delà de 50 km de l'atelier, facturés sur une ligne distincte pour que le client voie le détail."
    F019: "Entente de paiement échelonné pour un client en difficulté : trois chèques postdatés, un par mois. L'entente est écrite et signée ; le défaut remet la totalité du solde exigible."
    F020: "Chèque sans provision : frais administratifs de 25 $ ajoutés à la facture. Le client est avisé par téléphone, puis un nouveau mode de paiement est convenu par écrit."
    F021: "Facture 2026-1215, Les Entreprises Beaulieu : fascia et soffite d'aluminium, 5 200 $ plus taxes. Conditions de paiement net 30 jours à compter de la date d'émission."
    F022: "Preuve de paiement : mention « payé » avec la date et le mode de paiement. Un reçu est envoyé automatiquement par courriel après chaque encaissement."
    F023: "Un virement Interac de 3 450 $ est arrivé sans message. À rapprocher avec la soumission S-2026-0412 de M. Gagnon (3 450 $ avant taxes) ou une facture ouverte de même montant avant tout classement."
    F024: "La facture finale est émise dans les 48 heures suivant la fin des travaux, avec le résumé des garanties et les instructions d'entretien."
    F025: "Acompte non remboursable une fois le matériel commandé, notamment les couleurs sur mesure : le fournisseur n'accepte pas le retour de produits coupés ou teints sur demande."
    F026: "Retour de matériel au fournisseur : crédit moins 15 % de frais de remise en stock. Les produits coupés ou entamés ne sont pas repris."
    F027: "Échafaudage : location de trois jours à 450 $, refacturée au client seulement si elle est prévue à la soumission. Le montant apparaît sur une ligne distincte de la facture."
    F028: "Les factures sont en dollars canadiens. Le total est arrondi au cent près ; le comptant est arrondi au multiple de 5 ¢ selon la règle fiscale de l'arrondi. À valider auprès d'un comptable (CPA)."
    F029: "La facture finale inclut le numéro de soumission d'origine, la liste des travaux effectués, la liste des extras autorisés et le solde, afin que le client puisse tout rapprocher."
    F030: "Chèque retourné de 2 415 $ : frais de 25 $, le client est contacté. La facture 2026-1187 est rouverte avec le solde et les frais, et la relance recommence à J+0."
