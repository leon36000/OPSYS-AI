# Corpus FICTIF (suite) : soffite et fascia, soumissions. Voir passages_gouttieres_revetement.yaml pour l'avertissement.
schema: opsys.qualification.passages-embeddings-fr/v1
fictif: true
categories:
  soffite_fascia:
    S001: "Le soffite est le panneau installé sous le débord du toit. Ventilé (perforé), il laisse entrer l'air dans l'entretoit pour éviter la condensation et les barrages de glace."
    S002: "Le fascia (aussi appelé planche de rive ou bordure de toit) est la planche verticale au bout des chevrons qui porte la gouttière. On le recouvre d'aluminium plié de 6 po ou de 8 po."
    S003: "Fascia pourri : signe que l'eau passe derrière la gouttière depuis longtemps. On remplace la planche de pin traité de 1 po sur 6 po avant de poser le recouvrement d'aluminium, et on règle la cause de l'infiltration."
    S004: "Ventilation de l'entretoit : règle de 1 pi² de ventilation nette pour 300 pi² de plancher du grenier, à répartir moitié au soffite et moitié au faîte. Valeur indicative de fiction, à valider avec le code applicable."
    S005: "Nids de guêpes, d'écureuils ou de suisses dans le soffite : faire retirer l'animal ou le nid d'abord, puis fermer avec un grillage métallique à mailles fines avant de poser le panneau neuf."
    S006: "Soffite de vinyle continu ou panneaux d'aluminium ? Le vinyle coûte moins cher mais se déforme avec les années ; l'aluminium dure plus longtemps et tient mieux les couleurs."
    S007: "Soffite plein (non ventilé) sur un débord de 6 po : on ajoute des évents de grenier ou des lamelles de ventilation, sinon l'entretoit est mal aéré et l'humidité s'accumule."
    S008: "Ancien soffite en contreplaqué peint qui s'écaille : on gratte, on remplace les sections ramollies, puis on recouvre d'un panneau d'aluminium perforé."
    S009: "Les moulures de finition en J et en F longent le mur et les rives du soffite. Elles retiennent le panneau sans le clouer en plein centre et laissent l'air circuler."
    S010: "Débord de toit de 24 po : le soffite repose sur un support de bois (sous-fascia) fixé au mur et au bout des chevrons. Pour un débord plus court, la lisse est directement vissée au mur."
    S011: "Éclairage de soffite : lumières DEL encastrées, trou de 4 po percé dans le panneau, boîtier étanche. Le câblage est raccordé par un électricien, pas par nos poseurs. Option fictive : 420 $ pour six lumières."
    S012: "Fascia de bois peint ou fascia recouvert d'aluminium ? Le recouvrement évite de repeindre tous les 5 ans, à condition que le bois dessous soit sain."
    S013: "Teintes de soffite : le blanc est la plus courante ; le gris ardoise ou le brun contraste avec un déclin clair. Le vinyle foncé se déforme davantage au soleil."
    S014: "Du givre sur le dessous du platelage dans le grenier, des taches d'humidité ou de la moisissure : manque de ventilation, souvent parce que l'isolant soufflé bouche les évents de soffite. On pose des chutes d'air (déflecteurs) pour dégager le passage."
    S015: "Évents de soffite continus de 2 po de largeur le long du débord, ou évents ronds individuels de 2 po tous les 24 po. Le continu laisse passer plus d'air et se bouche moins vite."
    S016: "Un fascia fendu par la glace : la glace tire sur la gouttière et fend le bois. On remplace la planche, on ajoute un support de gouttière tous les 24 po et on règle la cause du barrage de glace."
    S017: "Soffite sous une galerie ou un balcon : panneau de PVC résistant à l'humidité, sans perforation si l'espace dessous est fermé. Le plafond de galerie est en pente légère pour évacuer l'eau."
    S018: "Retours de corniche aux pignons : petites pièces triangulaires de finition entre le soffite et le pignon. Elles se coupent sur place et se fixent avec une moulure en J."
    S019: "Dégât d'eau au soffite : tache brune, peinture qui cloque. Origine probable : barrage de glace qui remonte sous les bardeaux, gouttière qui déborde ou larmier absent. On trouve la cause avant de refaire la finition."
    S020: "Garantie du soffite et du fascia : 10 ans sur la main-d'œuvre ; aluminium de calibre .019 garanti par le fabricant. Elle ne couvre ni les nids d'animaux ni la peinture déjà détériorée."
    S021: "Fascia plié sur mesure à l'atelier : rouleau d'aluminium de 24 po par 50 pi plié en lames de 10 pi, coins mitrés. Pour un chantier de plus de 200 pi lin., on plie sur place avec la plieuse mobile."
    S022: "Fourrures de bois de 1 po sur 2 po sous le débord quand le plafond du soffite est irrégulier. On redresse la surface avant de poser les panneaux pour que les rainures restent droites."
    S023: "Ne pas peindre un soffite de vinyle foncé : la peinture claire change la façon dont il absorbe la chaleur et peut le déformer."
    S024: "Panneaux perforés ou pleins ? Perforés au-dessus de l'entretoit ventilé ; pleins aux endroits où l'air ne doit pas monter (au-dessus d'une galerie fermée, d'un garage attaché)."
    S025: "Fixation du soffite : clous ou vis à tous les 16 po au centre de la rainure, dans le support de bois. Pas de clou trop serré, pour permettre le jeu de dilatation."
    S026: "Nettoyage du soffite : boyau et brosse douce une fois par année, surtout au-dessus des galeries où les toiles d'araignée et la poussière s'accumulent."
    S027: "Chantier de fascia et soffite d'une maison de 1 600 pi² : deux jours avec deux poseurs, plus une demi-journée si le fascia de bois est à remplacer sur plus de 20 pi."
    S028: "Isolation : laisser un espace libre de 1 po entre l'isolant et le platelage du toit au-dessus du soffite, grâce à une chute d'air, pour que l'air puisse circuler vers le faîte."
    S029: "Rouleau d'aluminium de 24 po sur 50 pi : environ 100 pi lin. de fascia de 6 po avant les pertes. On compte 10 % de chutes sur les coins et les joints."
    S030: "Frelons et guêpes dans le soffite en été : ne pas ouvrir avant d'avoir fait traiter le nid par un exterminateur. Le chantier est replanifié sans frais pour le client."
  soumissions:
    U001: "Soumission S-2026-0412, M. Gagnon (client fictif), Saint-Jérôme : gouttières de 5 po en aluminium, 168 pi lin., 6 descentes, 3 450 $ avant taxes. Valide 30 jours. Installation prévue en septembre."
    U002: "Soumission S-2026-0418, Mme Lavoie (cliente fictive), Blainville : remplacement du déclin de vinyle sur 1 850 pi², 14 900 $ avant taxes. Délai de trois semaines après réception du matériel."
    U003: "Soumission S-2026-0421, Les Entreprises Beaulieu (client commercial fictif), Mirabel : fascia et soffite d'aluminium sur 220 pi lin., 5 200 $ avant taxes. Paiement net 30 jours."
    U004: "Politique d'acompte : 30 % à la signature de la soumission, 40 % à la livraison du matériel, 30 % à la fin du chantier après l'inspection finale avec le client."
    U005: "Validité de la soumission : 30 jours. Passé ce délai, le prix du matériel est révisé avant de confirmer la date de chantier."
    U006: "La visite d'évaluation est gratuite. Mesures au laser, photos du chantier, puis soumission écrite remise dans les 48 heures ouvrables suivant la visite."
    U007: "Clause d'extras : si du bois pourri ou un défaut caché est découvert en cours de chantier, les travaux supplémentaires sont facturés au taux horaire de 85 $ plus le matériel, avec autorisation écrite du client avant exécution."
    U008: "Rabais de 5 % sur le sous-total avant taxes lorsque gouttières, soffite et fascia sont combinés dans le même chantier. Le rabais n'est pas cumulable avec une autre promotion."
    U009: "Deux options peuvent être soumises : entrée de gamme (vinyle standard, garantie de base) et premium (vinyle isolé ou composite, garantie prolongée). Le client choisit en connaissance de cause."
    U010: "Soumission refusée : relance 7 jours plus tard, puis classement « perdue » avec le motif (prix, délai, concurrent). Pas de rappel après la deuxième relance."
    U011: "Soumission S-2026-0430, M. Pelletier (client fictif), Terrebonne : protège-gouttières sur 120 pi lin., 1 680 $, taxes en sus. Installation en septembre, après le nettoyage des gouttières existantes."
    U012: "Estimation par téléphone : fourchette approximative seulement, non engageante pour l'entreprise. Un prix ferme n'est donné qu'après la visite d'évaluation et la soumission écrite."
    U013: "La soumission porte les mentions obligatoires : numéro de licence RBQ (fictif 0000-0000-00), adresse du chantier, description des travaux, échéancier, modalités de paiement et garanties."
    U014: "Soumission combinée gouttières et revêtement pour une copropriété : l'approbation vient d'une résolution du syndicat, pas d'un copropriétaire seul. Le dossier garde copie du procès-verbal."
    U015: "Modalités de paiement : virement Interac, chèque ou comptant. La carte de crédit est acceptée avec des frais de 2,5 % ajoutés au montant."
    U016: "Soumission S-2026-0433, Mme Roy (cliente fictive), Laval : bardeaux de cèdre sur un pignon de 320 pi², 6 400 $ avant taxes. La teinture n'est pas incluse."
    U017: "Prix de référence fictifs pour le vinyle : de 8 $ à 11 $ du pi² installé, selon la qualité du produit et la hauteur de la maison. Les extras sont facturés à part."
    U018: "Délai de chantier annoncé dans la soumission. Un retard dû à la météo ne constitue pas un manquement, mais l'équipe avise le client dans la journée."
    U019: "Clause météo : travaux reportés en cas de pluie, de vent de plus de 40 km/h ou de froid sous -15 °C. La nouvelle date est proposée au client dans les 24 heures."
    U020: "Exclusions habituelles : peinture intérieure, réparation de maçonnerie, élagage d'arbres, enlèvement d'amiante et remplacement de fenêtres. Elles sont écrites noir sur blanc dans la soumission."
    U021: "Acceptation électronique : le client répond par courriel avec la mention « Bon pour accord » et la date. Cette réponse tient lieu de signature pour les soumissions de moins de 20 000 $. À valider auprès d'un professionnel qualifié."
    U022: "Soumission S-2026-0440, M. Tremblay-Lachance (client fictif), Sainte-Thérèse : soffite ventilé et fascia sur deux façades, 3 980 $ avant taxes, option lumières DEL 420 $ en plus."
    U023: "Relance automatique : un courriel après 3 jours sans réponse, un deuxième après 7 jours, pas davantage. Le client peut demander de ne plus être contacté."
    U024: "Taux horaire de main-d'œuvre : 85 $ de l'heure, deux poseurs. Le déplacement est inclus dans un rayon de 50 km autour de l'atelier ; au-delà, 0,75 $ du kilomètre."
    U025: "Garantie prolongée en option : +8 % du prix pour passer de 5 à 10 ans sur l'étanchéité des gouttières. Le contrat précise les exclusions comme la glace et le manque d'entretien."
    U026: "Soumission expirée S-2026-0301 remise à jour : le prix des matériaux a augmenté de 6 %. Le client reçoit une nouvelle version avec un nouveau numéro, l'ancienne est archivée."
    U027: "Annulation : le client dispose d'un délai de réflexion de trois jours ouvrables après la signature pour annuler sans frais, avant toute commande de matériel. À valider auprès d'un professionnel qualifié."
    U028: "Échafaudage : un étage ou deux étages ? Location de trois jours à 450 $, montage et démontage par l'équipe. Le coût est précisé dans la soumission s'il est requis."
    U029: "Gouttières en cuivre : prix sur demande après visite, car le cuivre est commandé à la pièce et soudé sur place. Aucune soumission rapide n'est donnée par téléphone."
    U030: "Soumission S-2026-0452, Syndicat des copropriétaires Les Jardins (client fictif), Boisbriand : revêtement d'acier sur quatre bâtiments, 62 400 $ avant taxes, paiement échelonné en trois versements."
    U031: "Hypothèses de la soumission : accès libre au camion, stationnement à proximité, électricité disponible sur place et terrain dégagé sur 3 pi autour du bâtiment."
    U032: "Les prix de la soumission sont indiqués avant taxes ; la TPS et la TVQ sont ajoutées sur la facture selon la loi. Les taux ne sont pas inscrits dans la soumission."
    U033: "Chaque soumission est accompagnée de photos annotées du chantier (en moyenne douze) liées au dossier client, pour éviter les litiges sur l'état initial."
    U034: "Soumissions concurrentes : le client veut un prix égal. Notre politique est de ne pas surenchérir, mais de présenter les garanties, l'assurance et les références comme différences."
    U035: "Après l'acceptation, délai de planification de deux semaines avant la date de chantier ; le bon de commande de matériel part à la réception de l'acompte."
