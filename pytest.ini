[pytest]
# --import-mode=importlib : chaque fichier de test est importé sous un nom dérivé
# de son chemin COMPLET, et non de son seul basename. Sans cela, deux modules
# exposant tous deux tests/test_registre.py (M1 et M2) ne peuvent pas être
# collectés dans le même processus — pytest refuse avec « not the same as the
# test file we want to collect ». C'est le pendant, côté tests, de l'identité de
# paquet donnée aux sources (chore #109) : les deux étaient nécessaires pour
# qu'un seul processus puisse couvrir tous les modules.
addopts = -q --import-mode=importlib
testpaths =
    scripts/tests
